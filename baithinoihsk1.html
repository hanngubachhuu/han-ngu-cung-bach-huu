<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phiếu chấm thi nói HSK1 — Dành cho người đi làm</title>
<script>document.documentElement.setAttribute("data-theme","dark");</script>
<style>
/* ============================================================
   TOKEN HỆ THỐNG THIẾT KẾ
   Ý tưởng: "phiếu chấm thi" giấy — nền giấy ngà, mực đen,
   con dấu đỏ (chop) dùng làm điểm nhấn cho huy hiệu điểm số
   và trạng thái Đạt/Chưa đạt. Chữ Hán dùng font hệ thống CJK.
   ============================================================ */
:root{
  --paper:      #F6F3EC;
  --paper-alt:  #EFEBE0;
  --ink:        #23241F;
  --ink-soft:   #55564C;
  --line:       #D9D3C1;
  --jade:       #1B4332;
  --jade-soft:  #2D6A4F;
  --seal:       #A8342A;
  --seal-soft:  #C75C4E;
  --gold:       #9C7A26;
  --ok:         #2D6A4F;
  --warn:       #A8342A;
  --radius:     14px;
  --radius-sm:  8px;
  --shadow:     0 1px 2px rgba(35,36,31,.06), 0 8px 24px rgba(35,36,31,.08);
  --shadow-lg:  0 12px 32px rgba(35,36,31,.14);
  /* Phông chữ theo yêu cầu:
     - Chữ Hán: KaiTi trước, các biến thể tương đương sau, cuối cùng serif.
     - Tiếng Việt / tiếng Anh: Times New Roman trước, cuối cùng serif. */
  --serif: 'Times New Roman', Times, serif;
  --sans:  'Times New Roman', Times, serif;
  --cjk:   'KaiTi','STKaiti','KaiTi_GB2312','DFKai-SB',serif;
  --mono:  'Times New Roman', Times, serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(35,36,31,.035) 1px, transparent 1px);
  background-size:22px 22px;
}
h1,h2,h3{font-family:var(--serif); font-weight:700; margin:0;}
button{font-family:var(--sans); cursor:pointer;}
.hidden{display:none !important;}

/* ---------- LAYOUT SHELL ---------- */
.app-shell{
  max-width:960px;
  margin:0 auto;
  padding:22px 18px 80px;
  position:relative;
  z-index:1;
}

/* ---------- HEADER / TICKET STUB ---------- */
.exam-header{
  background:linear-gradient(180deg,#FBF9F4,var(--paper-alt));
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px 24px;
  margin-bottom:18px;
  position:relative;
  overflow:hidden;
}
.exam-header::after{
  content:"";
  position:absolute; left:0; right:0; bottom:0; height:6px;
  background:repeating-linear-gradient(90deg,var(--jade) 0 14px, transparent 14px 20px);
  opacity:.55;
}
.exam-title-vi{font-size:26px; color:var(--ink); margin-bottom:2px;}
.exam-title-zh{font-family:var(--cjk); font-size:16px; color:var(--ink-soft); font-weight:400;}
.exam-meta{
  display:flex; flex-wrap:wrap; gap:8px 22px;
  margin-top:14px; font-size:13px; color:var(--ink-soft);
}
.exam-meta strong{color:var(--ink); font-weight:600;}

/* control bar */
.control-bar{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px;
  margin-top:16px; padding-top:16px; border-top:1px dashed var(--line);
}
.timer-box{
  display:flex; align-items:center; gap:12px;
  background:var(--ink); color:var(--paper);
  border-radius:var(--radius-sm); padding:10px 20px;
  font-family:var(--mono); font-size:26px; letter-spacing:.04em;
  box-shadow:0 4px 14px rgba(35,36,31,.25);
  transition:background .25s ease, transform .2s ease;
}
.timer-box.warn{background:var(--seal); animation:pulseWarn 1.2s ease-in-out infinite;}
@keyframes pulseWarn{
  0%,100%{box-shadow:0 4px 14px rgba(168,52,42,.35);}
  50%{box-shadow:0 4px 24px rgba(168,52,42,.65);}
}
.timer-label{font-family:var(--sans); font-size:10px; letter-spacing:.08em; text-transform:uppercase; opacity:.75;}
.btn{
  border:1px solid var(--line); background:#fff; color:var(--ink);
  padding:11px 18px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:600;
  transition:background .18s ease, border-color .18s ease, transform .15s ease, box-shadow .18s ease;
}
.btn:hover{background:var(--paper-alt); border-color:var(--ink-soft); transform:translateY(-1px); box-shadow:0 4px 10px rgba(35,36,31,.1);}
.btn:active{transform:translateY(0); box-shadow:none;}
.btn.primary{background:var(--jade); border-color:var(--jade); color:#fff;}
.btn.primary:hover{background:var(--jade-soft);}
.btn.seal{background:var(--seal); border-color:var(--seal); color:#fff;}
.btn.seal:hover{background:var(--seal-soft);}
.btn.ghost{background:transparent;}
.spacer{flex:1;}

/* progress */
.progress-wrap{margin-top:14px;}
.progress-track{
  height:12px; background:var(--paper-alt); border:1px solid var(--line);
  border-radius:99px; overflow:hidden;
}
.progress-fill{
  height:100%; width:0%; border-radius:99px;
  background:linear-gradient(90deg, var(--jade-soft), var(--jade));
  transition:width .4s ease;
}
.progress-text{font-size:12px; color:var(--ink-soft); margin-top:6px; display:flex; justify-content:space-between; font-weight:600;}

/* ---------- SECTION / PART ---------- */
.part-card{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden;
  transition:box-shadow .2s ease;
}
.part-card:hover{box-shadow:var(--shadow-lg);}
.part-head{
  display:flex; align-items:baseline; gap:14px;
  padding:18px 22px; background:var(--paper-alt); border-bottom:1px solid var(--line);
  cursor:pointer; transition:background .18s ease;
}
.part-head:hover{background:#E9E3D2;}
.part-stub{
  font-family:var(--serif); font-size:28px; color:var(--jade); font-weight:700;
  min-width:34px;
}
.part-head-text{flex:1;}
.part-title-vi{font-size:17px; font-weight:700;}
.part-title-zh{font-family:var(--cjk); color:var(--ink-soft); font-size:13px;}
.part-desc{font-size:12.5px; color:var(--ink-soft); margin-top:4px; max-width:60ch;}
.part-score-badge{
  font-family:var(--mono); font-size:14px; font-weight:700; color:var(--ink);
  background:#fff; border:1px solid var(--line); border-radius:99px;
  padding:5px 12px; white-space:nowrap;
}
.part-toggle{font-size:18px; color:var(--ink-soft); transition:transform .25s ease;}
.part-toggle.collapsed{transform:rotate(-90deg);}
.part-body{
  padding:6px 20px 18px; overflow:hidden;
  max-height:4000px; opacity:1;
  transition:max-height .35s ease, opacity .3s ease, padding .35s ease;
}
.part-body.collapsed{max-height:0; opacity:0; padding-top:0; padding-bottom:0;}

/* question block */
.question-block{
  border-top:1px solid var(--line); padding:16px 0;
}
.question-block:first-child{border-top:none;}
.q-zh{font-family:var(--cjk); font-size:18px; font-weight:600; margin-bottom:2px;}
.q-pinyin{font-size:13px; color:var(--gold); font-style:italic; margin-bottom:4px;}
.q-vi{font-size:14px; color:var(--ink); margin-bottom:6px;}
.q-followup{
  font-size:12.5px; color:var(--ink-soft); background:var(--paper);
  border-left:3px solid var(--jade-soft); padding:6px 10px; margin:6px 0;
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
}
.q-followup em{font-family:var(--cjk); font-style:normal; color:var(--ink);}
.q-suggested{font-size:12.5px; color:var(--ink-soft); margin-top:6px;}
.q-suggested summary{cursor:pointer; color:var(--jade); font-weight:600; font-size:12px;}
.q-suggested .sugg-line{margin-top:4px; padding-left:10px; border-left:2px solid var(--line);}

/* grading controls */
.grade-row{
  display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start;
  margin-top:10px; background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius-sm); padding:10px 12px;
}
.grade-col{display:flex; flex-direction:column; gap:4px;}
.grade-col label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600;}
.score-input{
  width:70px; padding:6px 8px; border:1px solid var(--line); border-radius:var(--radius-sm);
  font-family:var(--mono); font-size:15px; text-align:center; background:#fff;
  transition:border-color .15s ease;
}
.score-input:focus, textarea:focus, select:focus{outline:2px solid var(--jade-soft); outline-offset:1px;}
.note-input{
  flex:1; min-width:180px; padding:6px 8px; border:1px solid var(--line); border-radius:var(--radius-sm);
  font-size:13px; background:#fff; resize:vertical; min-height:36px; font-family:var(--sans);
}
.tag-group{display:flex; flex-wrap:wrap; gap:6px;}
.tag-chip{
  font-size:11.5px; padding:4px 9px; border-radius:99px; border:1px solid var(--line);
  background:#fff; color:var(--ink-soft); user-select:none;
}
.tag-chip.active{background:var(--seal); border-color:var(--seal); color:#fff;}

/* picture */
.picture-frame{
  border:1px solid var(--line); border-radius:8px; background:var(--paper-alt);
  padding:10px; margin:12px 0; box-shadow:var(--shadow);
}
.picture-frame img{
  width:100%; height:auto; display:block; border-radius:6px;
  object-fit:contain; cursor:zoom-in;
  transition:transform .25s ease, box-shadow .25s ease;
}
.picture-frame img:hover{transform:scale(1.015); box-shadow:0 6px 20px rgba(35,36,31,.18);}
.picture-placeholder{
  display:flex; align-items:center; justify-content:center;
  min-height:160px; color:var(--ink-soft); font-size:13px;
  border:1px dashed var(--line); border-radius:6px; background:#fff;
}
.picture-caption{font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:6px;}

/* lightbox phóng to ảnh */
.lightbox-overlay{
  position:fixed; inset:0; background:rgba(24,24,20,.86);
  display:flex; align-items:center; justify-content:center;
  z-index:100; padding:24px; opacity:0; pointer-events:none;
  transition:opacity .2s ease;
}
.lightbox-overlay.show{opacity:1; pointer-events:auto;}
.lightbox-overlay img{
  max-width:100%; max-height:100%; border-radius:8px;
  box-shadow:0 10px 40px rgba(0,0,0,.4);
}
.lightbox-close{
  position:absolute; top:20px; right:26px; color:#fff; font-size:32px;
  cursor:pointer; line-height:1; opacity:.85;
}
.lightbox-close:hover{opacity:1;}

/* final panel */
.final-panel{
  background:linear-gradient(180deg,#FBF9F4,var(--paper-alt));
  border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:22px 24px; margin-top:18px; position:relative;
}
.final-grid{display:flex; flex-wrap:wrap; gap:24px; align-items:center;}
.final-score-seal{
  width:118px; height:118px; border-radius:50%;
  border:3px solid var(--seal); color:var(--seal);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:var(--serif); transform:rotate(-4deg);
}
.final-score-seal .num{font-size:34px; font-weight:700; line-height:1;}
.final-score-seal .lbl{font-size:10px; letter-spacing:.08em; text-transform:uppercase; margin-top:2px;}
.final-status{font-size:15px; font-weight:700;}
.final-status.pass{color:var(--ok);}
.final-status.fail{color:var(--warn);}
.final-descriptor{font-size:13px; color:var(--ink-soft); max-width:48ch;}
.adjust-row{display:flex; align-items:center; gap:8px; margin-top:12px;}
.final-comment{width:100%; margin-top:14px;}
.final-comment textarea{
  width:100%; min-height:80px; padding:10px; border:1px solid var(--line);
  border-radius:var(--radius-sm); font-size:13px; font-family:var(--sans);
}

/* teacher notes */
.notes-card{
  background:var(--paper-alt); border:1px dashed var(--line); border-radius:var(--radius);
  padding:14px 18px; margin-top:16px; font-size:12.5px; color:var(--ink-soft);
}
.notes-card h4{font-size:13px; color:var(--ink); margin-bottom:6px;}
.notes-card ul{margin:0; padding-left:18px;}
.notes-card li{margin-bottom:4px;}

footer.app-footer{
  text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:24px; opacity:.7;
}

/* toast */
#toast{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--paper); padding:9px 18px; border-radius:99px;
  font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  z-index:50;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- RESPONSIVE ---------- */
@media (max-width:640px){
  .exam-title-vi{font-size:21px;}
  .part-head{flex-wrap:wrap;}
  .part-score-badge{order:3;}
  .final-grid{flex-direction:column; align-items:flex-start;}
}

/* ---------- PRINT ---------- */
@media print{
  body::before{display:none;}
  body{background:#fff;}
  .control-bar,.progress-wrap,.part-toggle,#toast,.no-print{display:none !important;}
  .app-shell{max-width:none; padding:0; margin:0;}
  .part-card,.exam-header,.final-panel{box-shadow:none; border:1px solid #999; break-inside:avoid;}
  .part-body{display:block !important;}
  @page{size:A4; margin:14mm;}
  .question-block{break-inside:avoid;}
}
/* ---------- DARK MODE ---------- */
[data-theme="dark"]{
  --paper:#15191f;--paper-alt:#1e252d;--ink:#eef1f4;--ink-soft:#b8c1cb;--line:#3b4652;
  --jade:#58b889;--jade-soft:#78c99f;--seal:#df6258;--seal-soft:#ea7b72;--gold:#ddb866;--ok:#58b889;--warn:#df6258;
  --shadow:0 1px 2px rgba(0,0,0,.20),0 8px 24px rgba(0,0,0,.30);--shadow-lg:0 12px 32px rgba(0,0,0,.45);
}
[data-theme="dark"] body::before{background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.022) 1px,transparent 1px);}
[data-theme="dark"] .exam-header,[data-theme="dark"] .final-panel{background:linear-gradient(180deg,#1d232b,var(--paper-alt));}
[data-theme="dark"] .btn{background:#252d36;color:var(--ink);}
[data-theme="dark"] .btn:hover{background:#2f3944;}
[data-theme="dark"] .part-card{background:#1a2027;}
[data-theme="dark"] .part-head{background:var(--paper-alt);}
[data-theme="dark"] .part-head:hover{background:#2a333d;}
[data-theme="dark"] .part-score-badge,[data-theme="dark"] .score-input,[data-theme="dark"] .note-input,[data-theme="dark"] .tag-chip,[data-theme="dark"] .picture-placeholder,[data-theme="dark"] .final-comment textarea,[data-theme="dark"] input,[data-theme="dark"] textarea,[data-theme="dark"] select{background:#222a33;color:var(--ink);}
[data-theme="dark"] .grade-row,[data-theme="dark"] .q-followup,[data-theme="dark"] .notes-card,[data-theme="dark"] .picture-frame,[data-theme="dark"] .progress-track{background:var(--paper-alt);}
[data-theme="dark"] .lightbox-overlay{background:rgba(4,6,9,.90);}
[data-theme="dark"] .exam-title-vi,[data-theme="dark"] .q-vi,[data-theme="dark"] .q-followup em,[data-theme="dark"] .notes-card h4{color:var(--ink);}
[data-theme="dark"] .timer-box{background:#0f1318;color:#eef1f4;}

</style>
</head>
<body>

<div class="app-shell">

  <!-- ============ HEADER ============ -->
  <header class="exam-header">
    <h1 class="exam-title-vi" id="examTitleVi"></h1>
    <div class="exam-title-zh" id="examTitleZh"></div>

    <div class="exam-meta" id="examMeta"></div>

    <div class="control-bar no-print">
      <div class="timer-box" id="timerBox">
        <div>
          <div class="timer-label">Thời gian</div>
          <span id="timerDisplay">15:00</span>
        </div>
      </div>
      <button class="btn" id="btnTimerStart">▶ Bắt đầu</button>
      <button class="btn" id="btnTimerPause">⏸ Tạm dừng</button>
      <button class="btn" id="btnTimerReset">↺ Đặt lại giờ</button>
      <div class="spacer"></div>
      <button class="btn" id="btnFullscreen">⛶ Toàn màn hình</button>
      <button class="btn primary" id="btnPrint">🖶 In / Lưu PDF</button>
      <button class="btn" id="btnExport">⬇ Xuất JSON kết quả</button>
      <button class="btn ghost" id="btnResetData">Xóa dữ liệu đã chấm</button>
    </div>

    <div class="progress-wrap no-print">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text">
        <span id="progressText">Đã chấm 0/16 câu</span>
        <span id="progressPercent">0%</span>
      </div>
    </div>
  </header>

  <!-- ============ PARTS (rendered by JS) ============ -->
  <main id="partsContainer"></main>

  <!-- ============ FINAL SCORE PANEL ============ -->
  <section class="final-panel">
    <div class="final-grid">
      <div class="final-score-seal">
        <span class="num" id="finalScoreNum">0</span>
        <span class="lbl">/ 100 điểm</span>
      </div>
      <div>
        <div class="final-status" id="finalStatus">Chưa đạt</div>
        <div class="final-descriptor" id="finalDescriptor"></div>
        <div class="adjust-row no-print">
          <label style="font-size:12px;color:var(--ink-soft);">Điều chỉnh điểm (+/-):</label>
          <input type="number" id="adjustScore" class="score-input" value="0" style="width:70px;">
          <span style="font-size:12px;color:var(--ink-soft);">Điểm câu hỏi: <strong id="rawQuestionTotal">0</strong>/100</span>
        </div>
      </div>
    </div>
    <div class="final-comment">
      <label style="font-size:12px;font-weight:600;color:var(--ink-soft);">Nhận xét cuối bài của giáo viên</label>
      <textarea id="finalComment" placeholder="Nhận xét tổng quát về phần thi nói của học viên..."></textarea>
    </div>
  </section>

  <!-- ============ TEACHER NOTES ============ -->
  <section class="notes-card" id="teacherNotesCard"></section>

  <footer class="app-footer">Phiếu chấm thi nói HSK1 · Tạo tự động từ dữ liệu đề thi JSON · Chạy hoàn toàn ngoại tuyến</footer>
</div>

<div id="toast"></div>

<div class="lightbox-overlay no-print" id="lightboxOverlay">
  <span class="lightbox-close" id="lightboxClose">&times;</span>
  <img id="lightboxImg" src="" alt="Tranh minh họa phóng to">
</div>

<script>
/* ============================================================
   MODULE 0: DỮ LIỆU ĐỀ THI
   Toàn bộ nội dung câu hỏi đọc trực tiếp từ đối tượng EXAM_DATA.
   Muốn tạo đề mới: chỉ cần thay nội dung của EXAM_DATA bên dưới
   (giữ nguyên cấu trúc trường) rồi tải lại trang.
   ============================================================ */

/* ============================================================
   MODULE 1: STATE + LOCALSTORAGE
   ============================================================ */
const STORAGE_KEY = "hsk1_grading_state_v1";
const ERROR_TAG_TYPES = [
  {key:"phatAm",    label:"Lỗi phát âm"},
  {key:"thanhDieu", label:"Lỗi thanh điệu"},
  {key:"nguPhap",   label:"Lỗi ngữ pháp"},
  {key:"tuVung",    label:"Lỗi từ vựng"}
];

function buildEmptyState(){
  const state = { questions:{}, adjustScore:0, finalComment:"", timerRemaining:15*60 };
  EXAM_DATA.parts.forEach(part=>{
    part.questions.forEach(q=>{
      state.questions[q.id] = { score:"", note:"", tags:{phatAm:false,thanhDieu:false,nguPhap:false,tuVung:false} };
    });
  });
  return state;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return buildEmptyState();
    const parsed = JSON.parse(raw);
    // hoà trộn với cấu trúc mặc định để tránh thiếu trường khi đề JSON thay đổi
    const fresh = buildEmptyState();
    Object.keys(fresh.questions).forEach(id=>{
      if(parsed.questions && parsed.questions[id]) fresh.questions[id] = parsed.questions[id];
    });
    fresh.adjustScore = typeof parsed.adjustScore === "number" ? parsed.adjustScore : 0;
    fresh.finalComment = parsed.finalComment || "";
    return fresh;
  }catch(e){
    console.warn("Không đọc được dữ liệu đã lưu, dùng trạng thái trống.", e);
    return buildEmptyState();
  }
}

let gradingState = loadState();

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(gradingState));
  }catch(e){
    showToast("⚠ Không thể lưu vào bộ nhớ trình duyệt.");
  }
}

/* ============================================================
   MODULE 2: TOAST HELPER
   ============================================================ */
let toastTimer = null;
function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);
}

/* ============================================================
   MODULE 3: RENDER HEADER
   ============================================================ */
function renderHeader(){
  const info = EXAM_DATA.examInfo;
  document.getElementById("examTitleVi").textContent = info.title_vi;
  document.getElementById("examTitleZh").textContent = info.title_zh;

  const meta = document.getElementById("examMeta");
  // Chỉ hiển thị: Thời lượng và Tổng điểm (yêu cầu bỏ Đối tượng/Trình độ/Hình thức thi)
  const metaItems = [
    ["Thời lượng", info.duration],
    ["Tổng điểm", info.totalScore]
  ];
  meta.innerHTML = metaItems.filter(m=>m[1]).map(m=>`<span><strong>${m[0]}:</strong> ${escapeHtml(String(m[1]))}</span>`).join("");
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

/* ============================================================
   MODULE 4: HIỂN THỊ ẢNH MINH HỌA CHO PHẦN "NHÌN TRANH NÓI CHUYỆN"
   Ảnh đọc trực tiếp từ trường picture.image trong EXAM_DATA (không
   hard-code tên/đường dẫn file). Nếu không có ảnh, hiện placeholder.
   ============================================================ */
function renderPictureImage(picture){
  if(picture && picture.image){
    const caption = [picture.time, picture.weather].filter(Boolean).join(" · ");
    return `
      <img src="${picture.image}" alt="Tranh minh họa cho phần nhìn tranh nói chuyện" class="js-picture-zoom">
      ${caption ? `<div class="picture-caption">${escapeHtml(caption)}</div>` : ""}
    `;
  }
  return `<div class="picture-placeholder">Chưa có hình minh họa</div>`;
}

/* ============================================================
   MODULE 5: RENDER CÁC PHẦN THI + CÂU HỎI
   ============================================================ */
function partScoreSum(part){
  return part.questions.reduce((sum,q)=>{
    const s = gradingState.questions[q.id];
    const val = s && s.score !== "" ? Number(s.score) : 0;
    return sum + (isNaN(val)?0:val);
  },0);
}

function renderQuestionBlock(q){
  const state = gradingState.questions[q.id];
  const followUps = (q.followUpQuestions||[]).map(f=>`<div class="q-followup">↳ Hỏi thêm: <em>${escapeHtml(f)}</em></div>`).join("");
  const suggested = (q.suggestedAnswers||[]).map(s=>`
      <div class="sugg-line">
        <div style="font-family:var(--cjk);">${escapeHtml(s.chinese)}</div>
        <div style="color:var(--gold);font-style:italic;">${escapeHtml(s.pinyin)}</div>
        <div>${escapeHtml(s.vietnamese)}</div>
      </div>`).join("");

  const tagChips = ERROR_TAG_TYPES.map(t=>{
    const active = state.tags[t.key] ? "active" : "";
    return `<button type="button" class="tag-chip ${active}" data-qid="${q.id}" data-tagkey="${t.key}">${t.label}</button>`;
  }).join("");

  return `
  <div class="question-block" data-question-id="${q.id}">
    <div class="q-zh">${escapeHtml(q.chinese)}</div>
    <div class="q-pinyin">${escapeHtml(q.pinyin)}</div>
    <div class="q-vi">${escapeHtml(q.vietnamese)}</div>
    ${followUps}
    ${suggested ? `<details class="q-suggested"><summary>Xem gợi ý câu trả lời mẫu</summary>${suggested}</details>` : ""}

    <div class="grade-row">
      <div class="grade-col">
        <label>Điểm (tối đa ${q.score})</label>
        <input type="number" class="score-input js-question-score" data-qid="${q.id}" min="0" max="${q.score}" step="0.5" value="${state.score}" placeholder="0">
      </div>
      <div class="grade-col" style="flex:1;">
        <label>Ghi chú / nhận xét câu này</label>
        <textarea class="note-input js-question-note" data-qid="${q.id}" placeholder="Nhận xét, lỗi cụ thể...">${escapeHtml(state.note)}</textarea>
      </div>
      <div class="grade-col">
        <label>Gắn thẻ lỗi</label>
        <div class="tag-group">${tagChips}</div>
      </div>
    </div>
  </div>`;
}

function renderPart(part, index){
  const scoreSum = partScoreSum(part);
  const pictureBlock = part.picture ? `
    <div class="picture-frame">
      ${renderPictureImage(part.picture)}
    </div>` : "";

  return `
  <section class="part-card" data-part-id="${part.id}">
    <div class="part-head js-part-toggle" data-part-id="${part.id}">
      <div class="part-stub">${String(index+1).padStart(2,"0")}</div>
      <div class="part-head-text">
        <div class="part-title-vi">${escapeHtml(part.title_vi)}</div>
        <div class="part-title-zh">${escapeHtml(part.title_zh)} · ${escapeHtml(part.estimatedTime||"")}</div>
        <div class="part-desc">${escapeHtml(part.description||"")}</div>
      </div>
      <div class="part-score-badge js-part-score-badge" data-part-id="${part.id}">${scoreSum} / ${part.totalScore}</div>
      <div class="part-toggle js-part-arrow" data-part-id="${part.id}">▾</div>
    </div>
    <div class="part-body js-part-body" data-part-id="${part.id}">
      ${pictureBlock}
      ${part.questions.map(renderQuestionBlock).join("")}
    </div>
  </section>`;
}

function renderParts(){
  document.getElementById("partsContainer").innerHTML =
    EXAM_DATA.parts.map((p,i)=>renderPart(p,i)).join("");
}

/* ============================================================
   MODULE 7: TÍNH ĐIỂM TỔNG + TRẠNG THÁI ĐẠT/CHƯA ĐẠT
   ============================================================ */
function round1(n){ return Math.round(n*10)/10; }

function computeRawQuestionTotal(){
  let sum = 0;
  EXAM_DATA.parts.forEach(part=>{
    sum += partScoreSum(part);
  });
  return round1(sum);
}

function getLevelDescriptor(score){
  const d = EXAM_DATA.summary ? EXAM_DATA.summary.levelDescriptors_vi : (EXAM_DATA.summary||{});
  const desc = (EXAM_DATA.summary && EXAM_DATA.summary.levelDescriptors_vi) || {};
  if(score>=90) return {label:"Xuất sắc (90-100)", text:desc.xuatSac_90_100};
  if(score>=75) return {label:"Khá (75-89)", text:desc.kha_75_89};
  if(score>=60) return {label:"Trung bình (60-74)", text:desc.trungBinh_60_74};
  return {label:"Chưa đạt (dưới 60)", text:desc.chuaDat_duoi_60};
}

function updateFinalPanel(){
  const raw = computeRawQuestionTotal();
  document.getElementById("rawQuestionTotal").textContent = raw;
  const adjust = Number(gradingState.adjustScore)||0;
  let final = raw + adjust;
  final = Math.max(0, Math.min(100, round1(final)));
  document.getElementById("finalScoreNum").textContent = final;

  const passLine = (EXAM_DATA.summary && EXAM_DATA.summary.passingScoreSuggestion_vi) || "";
  const passThreshold = 60;
  const statusEl = document.getElementById("finalStatus");
  if(final >= passThreshold){
    statusEl.textContent = "✓ Đạt";
    statusEl.className = "final-status pass";
  } else {
    statusEl.textContent = "✕ Chưa đạt";
    statusEl.className = "final-status fail";
  }
  const level = getLevelDescriptor(final);
  document.getElementById("finalDescriptor").innerHTML =
    `<strong>${escapeHtml(level.label)}</strong> — ${escapeHtml(level.text||"")}<br><span style="opacity:.75;">Mức đạt gợi ý: ${escapeHtml(passLine)}</span>`;
}

/* ============================================================
   MODULE 8: TIẾN TRÌNH CHẤM ĐIỂM
   ============================================================ */
function updateProgress(){
  const totalQuestions = Object.keys(gradingState.questions).length;
  let graded = 0;
  Object.values(gradingState.questions).forEach(q=>{ if(q.score !== "" && q.score !== null) graded++; });
  const pct = totalQuestions ? Math.round((graded/totalQuestions)*100) : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `Đã chấm ${graded}/${totalQuestions} câu`;
  document.getElementById("progressPercent").textContent = pct + "%";
}

  `;

/* ============================================================
   MODULE 10: SỰ KIỆN NHẬP LIỆU (event delegation)
   ============================================================ */
function attachInputEvents(){
  const container = document.getElementById("partsContainer");

  container.addEventListener("input", e=>{
    if(e.target.classList.contains("js-question-score")){
      const qid = e.target.dataset.qid;
      let val = e.target.value;
      const max = Number(e.target.max);
      if(val !== "" && Number(val) > max){
        val = max;
        e.target.value = max;
        showToast(`⚠ Điểm không được vượt quá ${max}`);
      }
      if(val !== "" && Number(val) < 0){ val = 0; e.target.value = 0; }
      gradingState.questions[qid].score = val;
      refreshPartBadge(qid);
      updateFinalPanel();
      updateProgress();
      saveState();
    }
    if(e.target.classList.contains("js-question-note")){
      const qid = e.target.dataset.qid;
      gradingState.questions[qid].note = e.target.value;
      saveState();
    }
  });

  container.addEventListener("click", e=>{
    if(e.target.classList.contains("js-tag-chip") || e.target.matches("[data-tagkey]")){
      const qid = e.target.dataset.qid;
      const tagKey = e.target.dataset.tagkey;
      gradingState.questions[qid].tags[tagKey] = !gradingState.questions[qid].tags[tagKey];
      e.target.classList.toggle("active");
      saveState();
    }
    if(e.target.classList.contains("js-picture-zoom")){
      openLightbox(e.target.src);
    }

    const toggleHead = e.target.closest(".js-part-toggle");
    if(toggleHead){
      const partId = toggleHead.dataset.partId;
      togglePart(partId);
    }
  });

  // final panel
  document.getElementById("adjustScore").addEventListener("input", e=>{
    gradingState.adjustScore = e.target.value === "" ? 0 : Number(e.target.value);
    updateFinalPanel();
    saveState();
  });
  document.getElementById("finalComment").addEventListener("input", e=>{
    gradingState.finalComment = e.target.value;
    saveState();
  });
}

function togglePart(partId){
  const body = document.querySelector(`.js-part-body[data-part-id="${partId}"]`);
  const arrow = document.querySelector(`.js-part-arrow[data-part-id="${partId}"]`);
  body.classList.toggle("collapsed");
  arrow.classList.toggle("collapsed");
}

function openLightbox(src){
  const overlay = document.getElementById("lightboxOverlay");
  document.getElementById("lightboxImg").src = src;
  overlay.classList.add("show");
}
function closeLightbox(){
  document.getElementById("lightboxOverlay").classList.remove("show");
}

function refreshPartBadge(qid){
  const part = EXAM_DATA.parts.find(p=>p.questions.some(q=>q.id===qid));
  if(!part) return;
  const badge = document.querySelector(`.js-part-score-badge[data-part-id="${part.id}"]`);
  badge.textContent = `${round1(partScoreSum(part))} / ${part.totalScore}`;
}

/* ============================================================
   MODULE 11: TIMER 15 PHÚT
   ============================================================ */
let timerInterval = null;
function formatTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,"0");
  const s = Math.floor(sec%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}
function renderTimer(){
  document.getElementById("timerDisplay").textContent = formatTime(gradingState.timerRemaining);
  const box = document.getElementById("timerBox");
  box.classList.toggle("warn", gradingState.timerRemaining <= 60);
}
function startTimer(){
  if(timerInterval) return;
  timerInterval = setInterval(()=>{
    if(gradingState.timerRemaining > 0){
      gradingState.timerRemaining--;
      renderTimer();
      saveState();
    } else {
      clearInterval(timerInterval);
      timerInterval = null;
      showToast("⏰ Hết 15 phút thi nói!");
    }
  },1000);
}
function pauseTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
}
function resetTimer(){
  pauseTimer();
  gradingState.timerRemaining = 15*60;
  renderTimer();
  saveState();
}

/* ============================================================
   MODULE 12: TOÀN MÀN HÌNH / IN / XUẤT JSON / RESET
   ============================================================ */
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>showToast("Không thể bật toàn màn hình."));
  } else {
    document.exitFullscreen();
  }
}

function exportResultJSON(){
  const raw = computeRawQuestionTotal();
  const adjust = Number(gradingState.adjustScore)||0;
  const final = Math.max(0, Math.min(100, round1(raw+adjust)));
  const exportPayload = {
    examTitle: EXAM_DATA.examInfo.title_vi,
    gradedAt: new Date().toISOString(),
    questionScores: gradingState.questions,
    adjustScore: adjust,
    rawQuestionTotal: raw,
    finalScore: final,
    finalComment: gradingState.finalComment
  };
  const blob = new Blob([JSON.stringify(exportPayload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ket-qua-cham-thi-hsk1.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("✓ Đã xuất file JSON kết quả chấm.");
}

function resetAllData(){
  if(!confirm("Xóa toàn bộ dữ liệu đã chấm? Hành động này không thể hoàn tác.")) return;
  localStorage.removeItem(STORAGE_KEY);
  gradingState = buildEmptyState();
  renderAll();
  showToast("Đã xóa dữ liệu chấm điểm.");
}

/* ============================================================
   MODULE 13: KHỞI TẠO
   ============================================================ */
function renderAll(){
  renderHeader();
  renderParts();
  renderTeacherNotes();
  renderTimer();
  updateFinalPanel();
  updateProgress();
  document.getElementById("adjustScore").value = gradingState.adjustScore;
  document.getElementById("finalComment").value = gradingState.finalComment;
}

function attachControlEvents(){
  document.getElementById("btnTimerStart").addEventListener("click", startTimer);
  document.getElementById("btnTimerPause").addEventListener("click", pauseTimer);
  document.getElementById("btnTimerReset").addEventListener("click", resetTimer);
  document.getElementById("btnFullscreen").addEventListener("click", toggleFullscreen);
  document.getElementById("btnPrint").addEventListener("click", ()=>window.print());
  document.getElementById("btnExport").addEventListener("click", exportResultJSON);
  document.getElementById("btnResetData").addEventListener("click", resetAllData);

  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
  document.getElementById("lightboxOverlay").addEventListener("click", e=>{
    if(e.target.id === "lightboxOverlay") closeLightbox();
  });
  document.addEventListener("keydown", e=>{
    if(e.key === "Escape") closeLightbox();
  });
}

renderAll();
attachInputEvents();
attachControlEvents();
</script>
