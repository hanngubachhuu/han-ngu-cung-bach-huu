name: Deploy website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Migrate first ZIP upload to normal files
        run: |
          if [ -f "web.zip" ]; then
            rm -rf __web_extract
            mkdir -p __web_extract
            unzip -q web.zip -d __web_extract
            if [ -d "__web_extract/web" ]; then
              cp -a __web_extract/web/. .
            else
              cp -a __web_extract/. .
            fi
            if [ -f "trang-chu.html" ]; then
              cp "trang-chu.html" "index.html"
            fi
            rm -rf __web_extract
            rm -f web.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Migrate website files from web.zip"
              git push
            fi
          elif [ -f "trang-chu.html" ] && [ ! -f "index.html" ]; then
            cp "trang-chu.html" "index.html"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Add website entry point"
            git push
          fi

      - name: Prepare deployment folder
        run: |
          rm -rf dist
          mkdir dist
          rsync -a --exclude=".git/" --exclude=".github/" --exclude="dist/" --exclude="README.md" ./ dist/

          # Cache-bust shared navigation assets so GitHub Pages/browsers never
          # serve an older navigation.css or hsk1-navigation.js after deploy.
          export HNH_ASSET_VERSION="$GITHUB_SHA"
          find dist -type f -name "*.html" -print0 | xargs -0 sed -i \
            -e "s#navigation\\.css#navigation.css?v=$GITHUB_SHA#g" \
            -e "s#hsk1-navigation\\.js#hsk1-navigation.js?v=$GITHUB_SHA#g"

          touch dist/.nojekyll

      - name: Publish to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Deploy website"
