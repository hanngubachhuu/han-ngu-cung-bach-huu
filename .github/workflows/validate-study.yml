name: Validate study web app
on: [pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audio:install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run validate:study
      - run: node scripts/validate-lessons.mjs
      - run: npx playwright install --with-deps chromium
      - name: Check browser interactions
        run: |
          node scripts/dev-server.mjs &
          trap 'kill $!' EXIT
          npm run test:browser
          node scripts/check-account-browser.mjs
          node scripts/check-private-browser.mjs
          node scripts/check-assignment-browser.mjs
          node scripts/check-assignment-authoring-browser.mjs
          node scripts/check-assignment-cp2-browser.mjs
          node scripts/check-assignment-ui-browser.mjs
          node scripts/check-hskk-browser.mjs
          node scripts/check-hskk-delivery-browser.mjs
          node scripts/check-admin-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-browser-results
          path: test-results/
