name: Validate lesson data
on:
  push:
    paths:
      - "data/**"
      - "scripts/validate-lessons.mjs"
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate-lessons.mjs"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/validate-lessons.mjs
      - run: node scripts/validate-publish-readiness.mjs
