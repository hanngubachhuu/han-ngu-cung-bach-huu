name: Export project rules

on:
  push:
    paths:
      - "ARCHITECTURE.md"
      - "CODE_RULES.md"
      - ".github/workflows/export-project-rules.yml"

permissions:
  contents: read
  actions: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Package project rules
        run: |
          mkdir -p export
          cp ARCHITECTURE.md CODE_RULES.md export/
          cd export
          zip -q ../HNG-Clean-Code-Rules.zip ARCHITECTURE.md CODE_RULES.md
      - name: Upload project rules
        uses: actions/upload-artifact@v4
        with:
          name: HNG-Clean-Code-Rules
          path: HNG-Clean-Code-Rules.zip
          if-no-files-found: error
