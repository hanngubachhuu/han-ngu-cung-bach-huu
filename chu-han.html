<style>
:root{--bg:#FDFBF7;--card:#fff;--soft:#F5F2EB;--text:#2C3E50;--muted:#566573;--faint:#8492A6;--border:#E5E0D8;--primary:#C0392B;--primary-soft:#FADBD8;--green:#27AE60;--green-soft:#E8F8F5;--amber:#D68910;--amber-soft:#FCF3CF;--shadow:0 4px 18px rgba(44,62,80,.08);--cn:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;--vn:"Times New Roman",Times,serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--vn);padding-bottom:60px}a{color:var(--primary)}
.wrap{max-width:980px;margin:auto;padding:34px 18px 70px}.back{display:inline-flex;gap:7px;margin-bottom:18px;text-decoration:none;font-weight:700}
.hero{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.char-box{text-align:center;background:var(--soft);border:1px solid var(--border);border-radius:16px;padding:20px}.char{font-family:var(--cn);font-size:112px;line-height:1.05}.pinyin{font-size:24px;color:var(--primary);font-weight:700;margin-top:8px}.meaning{font-size:18px;color:var(--muted);margin-top:7px}.status{display:inline-block;margin-top:12px;padding:5px 10px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:11px;font-weight:800}
h1{font-size:30px;margin:0 0 8px}h2{font-size:20px;margin:0 0 14px}.lead{color:var(--muted);line-height:1.75;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.info{background:var(--soft);border-radius:10px;padding:12px}.label{font-size:11px;color:var(--faint);font-weight:800;text-transform:uppercase;letter-spacing:.05em}.value{font-size:17px;margin-top:3px}.value.zh{font-family:var(--cn)}
.words{display:flex;flex-wrap:wrap;gap:8px}.word{padding:7px 10px;border-radius:9px;background:var(--primary-soft);color:var(--primary);font-family:var(--cn);font-weight:700}
.sent{padding:12px 0;border-bottom:1px solid var(--border)}.sent:last-child{border-bottom:0}.sent-zh{font-family:var(--cn);font-size:19px;line-height:1.7}.sent-pin{color:var(--primary);font-size:14px;margin-top:3px}.sent-vi{color:var(--muted);font-size:14px;margin-top:3px}
.sources{display:grid;gap:8px}.source{padding:11px 13px;background:var(--soft);border-radius:9px;font-size:13px}.source b{display:block;margin-bottom:2px}.source a{text-decoration:none}.note{background:var(--amber-soft);border-left:4px solid var(--amber);padding:13px 15px;border-radius:9px;color:#6f5412;font-size:13px;line-height:1.65}.empty{text-align:center;padding:70px 20px;color:var(--muted)}.char-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.btn{border:1px solid var(--border);background:var(--card);padding:10px 14px;border-radius:10px;font-weight:700;color:var(--text);text-decoration:none}
@media(max-width:700px){.hero{grid-template-columns:1fr;text-align:center}.char-box{max-width:280px;margin:auto}.grid{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}.char{font-size:92px}}
.inline-hanzi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:16px}.inline-hanzi-stage{position:relative;width:min(390px,100%);aspect-ratio:1;margin:auto;border:1px solid var(--border);border-radius:13px;overflow:hidden;background:#fff}.inline-hanzi-grid{position:absolute;inset:0;background:linear-gradient(#e3ebe6 1px,transparent 1px),linear-gradient(90deg,#e3ebe6 1px,transparent 1px),linear-gradient(45deg,transparent calc(50% - .5px),#edf1ee calc(50% - .5px),#edf1ee calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(-45deg,transparent calc(50% - .5px),#edf1ee calc(50% - .5px),#edf1ee calc(50% + .5px),transparent calc(50% + .5px));background-size:50% 50%,50% 50%,100% 100%,100% 100%;pointer-events:none}.inline-hanzi-target,.inline-hanzi-draw{position:absolute;inset:0}.inline-hanzi-draw{width:100%;height:100%;touch-action:none}.inline-hanzi-actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:10px}.inline-hanzi-actions button{border:0;border-radius:10px;padding:9px 13px;font-weight:800;font-size:12px;cursor:pointer}.inline-hanzi-actions .s{background:#27ae60;color:#fff}.inline-hanzi-actions .t{background:#f2b01e;color:#432f00}.inline-hanzi-actions .q{background:#d94a3a;color:#fff}.inline-hanzi-actions button.active{box-shadow:0 0 0 3px rgba(44,62,80,.12)}.inline-hanzi-status{margin-top:9px;padding:9px 11px;border-radius:9px;background:var(--soft);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.inline-hanzi-speed{text-align:center;margin-top:8px;font-size:12px;color:var(--muted)}.inline-hanzi-speed select{border:1px solid var(--border);border-radius:8px;padding:5px;background:#fff}.inline-hanzi-note{text-align:center;margin-top:7px;font-size:11px;color:var(--faint)}</style><link rel="stylesheet" href="navigation.css">
</head>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wanted=new URLSearchParams(location.search).get('char')||'';
const urls=h=>[...new Set((h.match(/(?:bvnh\d+-\d+|bai\d+_index)\.html/g)||[]))];
function parseLesson(h){
 const m=h.indexOf('const LESSON ='),st=h.indexOf('{',m);if(m<0||st<0)throw Error('LESSON not found');
 let d=0,q=null,e=false,lc=false,bc=false;
 for(let i=st;i<h.length;i++){const c=h[i],n=h[i+1];if(lc){if(c==='\n')lc=false;continue}if(bc){if(c==='*'&&n==='/'){bc=false;i++}continue}if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}if(c==='/'&&n==='/'){lc=true;i++;continue}if(c==='/'&&n==='*'){bc=true;i++;continue}if(c==='"'||c==="'"||c===String.fromCharCode(96)){q=c;continue}if(c==='{')d++;else if(c==='}'){d--;if(!d)return Function('"use strict";return ('+h.slice(st,i+1)+')')()}}throw Error('LESSON parse failed')}
async function get(u){const r=await fetch(u+'?hanzi_profile='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(u);return{u,l:parseLesson(await r.text())}}
const sourceMap={'han-dian':['汉典','https://www.zdic.net/','bộ thủ / số nét / cấu trúc'],'unicode_uax38':['Unicode Unihan / UAX #38','https://www.unicode.org/reports/tr38/','thuộc tính dữ liệu chữ Hán'],'GF0023-2020':['通用规范汉字笔顺规范 GF 0023—2020','https://www.moe.gov.cn/jyb_sjzl/ziliao/A19/202103/W020210318300204215237.pdf','chuẩn thứ tự nét'],'textbook_lesson1':['Giáo trình chuẩn HSK 2 · Bài 1','https://chinese.edu.vn/giao-trinh-chuan-hsk-2-bai-1.html','từ vựng và câu mẫu']};
function sources(refs){return(refs||[]).map(k=>{const s=sourceMap[k];return s?'<div class="source"><b>'+esc(s[0])+'</b><a href="'+s[1]+'" target="_blank" rel="noopener">'+esc(s[2])+' ↗</a></div>':''}).join('')}
function loadInlineWriter(){if(window.HanziWriter)return Promise.resolve(window.HanziWriter);return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js';s.onload=()=>window.HanziWriter?resolve(window.HanziWriter):reject(Error('HanziWriter unavailable'));s.onerror=()=>reject(Error('Cannot load HanziWriter'));document.head.appendChild(s)})}
let inlineWriter=null,inlineCleanup=null;
function mountInlineHanzi(char){
 const root=document.getElementById('inlineHanziPractice');if(!root)return;
 root.innerHTML='<div class="inline-hanzi"><div class="inline-hanzi-stage"><div class="inline-hanzi-grid"></div><div class="inline-hanzi-target"></div><canvas class="inline-hanzi-draw"></canvas></div><div class="inline-hanzi-actions"><button class="s active" data-mode="stroke">▶ Xem nét</button><button class="t" data-mode="trace">✎ Viết mờ</button><button class="q" data-mode="quiz">📝 Tự viết</button></div><div class="inline-hanzi-status"><span class="left">Đang tải dữ liệu nét…</span><span class="right"></span></div><div class="inline-hanzi-speed">Tốc độ <select><option value=".7">Nhanh</option><option value="1" selected>Bình thường</option><option value="1.5">Chậm</option></select></div><div class="inline-hanzi-note">Ở “Tự viết”, nếu nét gần đúng nhưng chưa đạt, hệ thống sẽ tự gợi lại nét chuẩn.</div></div>';
 const status=(a,b)=>{root.querySelector('.left').textContent=a;root.querySelector('.right').textContent=b||''};
 const clear=()=>{if(inlineWriter&&inlineWriter.cancelQuiz){try{inlineWriter.cancelQuiz()}catch(e){}}inlineWriter=null;if(inlineCleanup){inlineCleanup();inlineCleanup=null}root.querySelector('.inline-hanzi-target').innerHTML='';root.querySelector('.inline-hanzi-draw').getContext('2d').clearRect(0,0,720,720)};
 const setup=mode=>{clear();root.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));const target=root.querySelector('.inline-hanzi-target'),canvas=root.querySelector('.inline-hanzi-draw');if(mode==='stroke'){status('Đang phát thứ tự nét…','Thứ tự nét tích hợp trong Xem nét');inlineWriter=window.HanziWriter.create(target,char,{width:390,height:390,padding:20,showCharacter:false,showOutline:true,strokeColor:'#1d8f63',radicalColor:'#d94a3a',strokeAnimationSpeed:parseFloat(root.querySelector('select').value),delayBetweenStrokes:350});inlineWriter.animateCharacter({onComplete:()=>status('✓ Hoàn tất thứ tự nét','Bấm Xem nét để xem lại')})}else if(mode==='trace'){status('Viết theo chữ mờ','Dùng chuột hoặc ngón tay');inlineWriter=window.HanziWriter.create(target,char,{width:390,height:390,padding:20,showCharacter:true,showOutline:false,strokeColor:'#b8ddca',radicalColor:'#b8ddca'});const ctx=canvas.getContext('2d');canvas.width=720;canvas.height=720;ctx.lineWidth=12;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#D68910';let drawing=false;const pos=e=>{const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*(720/r.width),y:(p.clientY-r.top)*(720/r.height)}};const down=e=>{e.preventDefault();drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)},move=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()},up=()=>drawing=false;canvas.addEventListener('mousedown',down);canvas.addEventListener('mousemove',move);window.addEventListener('mouseup',up);canvas.addEventListener('touchstart',down,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});window.addEventListener('touchend',up);inlineCleanup=()=>{canvas.removeEventListener('mousedown',down);canvas.removeEventListener('mousemove',move);window.removeEventListener('mouseup',up);canvas.removeEventListener('touchstart',down);canvas.removeEventListener('touchmove',move);window.removeEventListener('touchend',up)}}else{status('Tự viết · hệ thống chấm nét','Nét gần đúng sẽ tự gợi nét chuẩn');inlineWriter=window.HanziWriter.create(target,char,{width:390,height:390,padding:20,showCharacter:false,showOutline:false,strokeColor:'#1d8f63',radicalColor:'#d94a3a'});inlineWriter.quiz({leniency:1,showHintAfterMisses:1,showOutline:false,highlightOnComplete:true,onMistake:d=>status('✗ Nét '+(d.strokeNum+1)+' chưa đúng','Đang gợi nét chuẩn…'),onCorrectStroke:d=>status('✓ Đúng nét '+d.strokeNum,'Còn '+d.strokesRemaining+' nét'),onComplete:d=>status('🎉 Hoàn thành '+d.character,'Tổng lỗi: '+d.totalMistakes)})}};
 root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setup(b.dataset.mode));root.querySelector('select').onchange=()=>{const b=root.querySelector('[data-mode].active');if(b)setup(b.dataset.mode)};loadInlineWriter().then(()=>setup('stroke')).catch(()=>status('Không tải được dữ liệu nét','Kiểm tra kết nối mạng'))}
function render(hit){
 const c=hit.l.content||{},h=(c.hanzi||[]).find(x=>x.char===wanted);
 if(!h){$('#app').innerHTML='<div class="empty">Không tìm thấy hồ sơ chữ '+esc(wanted)+'.</div>';return}
 const examples=(c.exampleSentences||[]).filter(x=>x.zh&&x.zh.includes(wanted)),words=h.exampleWords||h.words||[];
 document.title='Hồ sơ chữ '+wanted+' · Hán Ngữ Cùng Bách Hữu';
 $('#app').innerHTML='<a class="back" href="on-tap-chung.html">← Quay lại Ôn tập chung · Chữ Hán</a><section class="hero"><div class="char-box"><div class="char">'+esc(h.char)+'</div><div class="pinyin">'+esc(h.pinyin||'Chưa có pinyin')+'</div><div class="meaning">'+esc(h.meaning||'Chưa có nghĩa chuẩn hóa')+'</div><div class="status">'+esc(h.status||'data')+'</div></div><div><h1>'+esc(h.char)+' · '+esc(h.pinyin||'')+'</h1><p class="lead">Học chữ qua phát âm, nghĩa, cấu tạo và luyện viết. Phần luyện viết mặc định bắt đầu ở <b>Xem nét</b>, trong đó thứ tự từng nét đã được tích hợp sẵn.</p><div class="info-grid"><div class="info"><div class="label">Bộ thủ</div><div class="value zh">'+esc(h.radical||'Chưa có')+'</div></div><div class="info"><div class="label">Cấu tạo</div><div class="value zh">'+esc(h.structure||'Chưa có')+'</div></div><div class="info"><div class="label">Số nét</div><div class="value">'+(h.strokes??'Chưa có')+'</div></div><div class="info"><div class="label">Từ trong bài</div><div class="value zh">'+esc(words.join(' · ')||'Chưa có')+'</div></div></div></div></section><section class="card" style="margin-top:14px"><h2>✍️ Luyện viết</h2><div id="inlineHanziPractice"></div></section><section class="grid"><section class="card"><h2>🧩 Từ có chứa chữ này trong bài</h2><div class="words">'+(words.length?words.map(w=>'<span class="word">'+esc(w)+'</span>').join(''):'Chưa có')+'</div></section><section class="card"><h2>🔎 Ghi chú</h2><div class="note">'+esc(h.notes||'Chưa có ghi chú.')+'</div></section></section><section class="card" style="margin-top:14px"><h2>💬 Câu mẫu trong bài</h2>'+(examples.length?examples.map(x=>'<div class="sent"><div class="sent-zh">'+esc(x.zh)+'</div><div class="sent-pin">'+esc(x.pinyin||'')+'</div><div class="sent-vi">'+esc(x.vi||'')+'</div></div>').join(''):'<p class="lead">Chưa có câu mẫu chứa trực tiếp chữ này trong dữ liệu bài học.</p>')+'</section><div class="char-nav"><a class="btn" href="on-tap-chung.html">← Danh sách chữ Hán</a><a class="btn" href="'+esc(hit.u)+'">Mở bài học →</a></div>';
 mountInlineHanzi(h.char);
}
async function load(){
 if(!wanted){$('#app').innerHTML='<div class="empty">Hãy mở hồ sơ từ Ôn tập chung → Chữ Hán.</div>';return}
 const home=await(await fetch('trang-chu.html?manifest='+Date.now(),{cache:'no-store'})).text();
 const all=['bvnh2-1.html',...urls(home)],rs=await Promise.allSettled([...new Set(all)].map(get));
 const hit=rs.filter(x=>x.status==='fulfilled').map(x=>x.value).find(x=>(x.l.content?.hanzi||[]).some(h=>h.char===wanted));
 if(!hit){$('#app').innerHTML='<div class="empty">Chưa có hồ sơ cho chữ '+esc(wanted)+' trong dữ liệu bài học hiện tại.</div>';return}render(hit);
}
$('#footerYear').textContent=new Date().getFullYear();
const b=$('#siteNavBurger'),l=$('#siteNavLinks');if(b&&l)b.onclick=()=>{const o=l.classList.toggle('open');b.textContent=o?'✕':'☰';b.setAttribute('aria-expanded',o?'true':'false')};
const bt=$('#siteBackTop');addEventListener('scroll',()=>bt.classList.toggle('visible',scrollY>400));bt.onclick=()=>scrollTo({top:0,behavior:'smooth'});load().catch(()=>$('#app').innerHTML='<div class="empty">Không tải được dữ liệu chữ Hán.</div>');
})();
</script></body></html>
