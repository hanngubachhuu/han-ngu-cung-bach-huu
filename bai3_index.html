<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">Luyện tập HSK 2</title>
<style>
/* ============================================================
   THEME VARIABLES
============================================================ */
:root{
  --bg:#f4f6fb; --bg-card:#ffffff; --bg-soft:#eef1f8;
  --text:#1c2333; --text-dim:#5b6577; --text-faint:#8992a3;
  --accent:#3b5bdb; --accent-dark:#2a43a8; --accent-soft:#e9edfd;
  --green:#1f9d55; --green-soft:#e6f7ec;
  --red:#e03131; --red-soft:#fdecec;
  --amber:#f0a500; --amber-soft:#fff6e0;
  --gray:#9aa2b1; --gray-soft:#eef0f4;
  --border:#e3e7f0; --shadow:0 4px 18px rgba(30,40,80,.07);
  --shadow-sm:0 2px 8px rgba(30,40,80,.06);
  --radius:16px; --radius-sm:10px;
  --zh-font:"KaiTi","STKaiti","KaiTi_GB2312",serif;
  --vi-font:"Times New Roman","Times",serif;
}
[data-theme="dark"]{
  --bg:#12151f; --bg-card:#1a1e2b; --bg-soft:#20253544;
  --text:#e8eaf2; --text-dim:#a9b0c3; --text-faint:#767f95;
  --accent:#6d8dff; --accent-dark:#4f6ee0; --accent-soft:#232a48;
  --green:#4bd07a; --green-soft:#16301f;
  --red:#ff6b6b; --red-soft:#3a1c1c;
  --amber:#ffc94a; --amber-soft:#3a2f10;
  --gray:#767f95; --gray-soft:#232838;
  --border:#2b3145; --shadow:0 4px 20px rgba(0,0,0,.35);
  --shadow-sm:0 2px 10px rgba(0,0,0,.3);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--vi-font); line-height:1.6;
  transition:background .3s,color .3s;
  padding-bottom:40px;
}
.zh{font-family:var(--zh-font); font-size:1.15em; letter-spacing:.5px;}
h1,h2,h3,h4{font-family:var(--vi-font); margin:0 0 8px;}
h1{font-size:44pt; line-height:1.15;}
h2{font-size:28pt; line-height:1.2;}
h3{font-size:20pt; line-height:1.25;}
h4{font-size:16pt;}
p{margin:0 0 10px;}
button{font-family:var(--vi-font); cursor:pointer;}
a{color:var(--accent);}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

.container{max-width:980px; margin:0 auto; padding:0 18px;}
.hidden{display:none !important;}
.card{
  background:var(--bg-card); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:24px; margin-bottom:20px;
  border:1px solid var(--border);
}
.btn{
  border:none; border-radius:999px; padding:13px 24px; font-size:17px;
  font-weight:600; transition:.2s; background:var(--accent-soft); color:var(--accent-dark);
}
.btn:hover{filter:brightness(1.05); transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--accent); color:#fff; box-shadow:0 4px 14px rgba(59,91,219,.35);}
.btn-primary:hover{background:var(--accent-dark);}
.btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--border);}
.btn-danger{background:var(--red-soft); color:var(--red);}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
.btn-sm{padding:8px 16px; font-size:15px;}

/* ============ HEADER / TOPBAR ============ */
.topbar{
  position:sticky; top:0; z-index:50; background:var(--bg-card);
  border-bottom:1px solid var(--border); box-shadow:var(--shadow-sm);
}
.topbar-inner{
  max-width:980px; margin:0 auto; padding:10px 18px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.brand{font-weight:800; font-size:20px; color:var(--accent-dark); flex:1; min-width:140px;}
.brand small{display:block; font-weight:400; color:var(--text-faint); font-size:13px;}
.timer-box{
  display:flex; align-items:center; gap:6px; background:var(--bg-soft);
  padding:8px 16px; border-radius:999px; font-weight:700; font-size:17px;
  font-variant-numeric:tabular-nums;
}
.timer-box.warn{color:var(--red); background:var(--red-soft);}
.icon-btn{
  background:var(--bg-soft); border:none; border-radius:50%; width:38px; height:38px;
  display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--text);
}

/* ============ PROGRESS ============ */
.progress-wrap{margin:14px 0 6px;}
.progress-meta{
  display:flex; justify-content:space-between; font-size:15px; color:var(--text-dim); margin-bottom:6px;
}
.progress-bar-track{
  height:10px; border-radius:999px; background:var(--bg-soft); overflow:hidden;
}
.progress-bar-fill{
  height:100%; background:linear-gradient(90deg,var(--accent),#7c9bff);
  border-radius:999px; transition:width .4s ease;
}

/* ============ NAV GRID ============ */
.nav-toggle-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.qnav-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:14px; color:var(--text-dim); margin-bottom:10px;}
.legend-dot{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:middle;}
.qnav-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(42px,1fr)); gap:8px;}
.qnav-item{
  aspect-ratio:1/1; border-radius:8px; border:none; background:var(--gray-soft); color:var(--text-dim);
  font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center;
  position:relative; transition:.15s;
}
.qnav-item.answered{background:var(--accent-soft); color:var(--accent-dark);}
.qnav-item.current{outline:2px solid var(--accent); outline-offset:2px;}
.qnav-item.correct{background:var(--green-soft); color:var(--green);}
.qnav-item.wrong{background:var(--red-soft); color:var(--red);}
.qnav-item.self{background:var(--amber-soft); color:var(--amber);}
.qnav-item.partial{background:var(--amber-soft); color:var(--amber);}
.qnav-item .dot-type{position:absolute; bottom:2px; right:2px; width:5px; height:5px; border-radius:50%; background:var(--text-faint);}

/* ============ QUESTION CARD ============ */
.q-section-title{font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); font-weight:700; margin-bottom:4px;}
.q-skill-tag{
  display:inline-block; font-size:13px; padding:4px 12px; border-radius:999px;
  background:var(--accent-soft); color:var(--accent-dark); font-weight:700; margin-bottom:10px;
}
.q-num{font-size:15px; color:var(--text-faint); margin-bottom:6px;}
.q-prompt{font-size:24pt; line-height:1.5; margin-bottom:18px;}
.passage-box{
  background:var(--bg-soft); border-left:4px solid var(--accent); border-radius:8px;
  padding:18px 20px; margin-bottom:18px; font-size:22pt; line-height:1.6;
}
.options-list{display:flex; flex-direction:column; gap:12px;}
.option-item{
  display:flex; align-items:center; gap:14px; padding:16px 20px; border-radius:12px;
  border:1.5px solid var(--border); background:var(--bg-card); transition:.15s; text-align:left; width:100%;
  font-size:22pt; color:var(--text);
}
.option-item:hover{border-color:var(--accent);}
.option-item.selected{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark); font-weight:600;}
.option-item .opt-key{
  width:34px; height:34px; border-radius:50%; background:var(--bg-soft); display:flex; align-items:center;
  justify-content:center; font-size:15px; font-weight:700; flex-shrink:0;
}
.option-item.selected .opt-key{background:var(--accent); color:#fff;}
.option-item.locked.correct-answer{border-color:var(--green); background:var(--green-soft); color:var(--green);}
.option-item.locked.wrong-selected{border-color:var(--red); background:var(--red-soft); color:var(--red);}

.text-input, textarea.text-input{
  width:100%; padding:15px 18px; border-radius:12px; border:1.5px solid var(--border);
  background:var(--bg-card); color:var(--text); font-size:22pt; font-family:var(--zh-font);
}
textarea.text-input{min-height:120px; resize:vertical; font-family:var(--vi-font);}
.text-input:focus, textarea.text-input:focus{outline:none; border-color:var(--accent);}
select.blank-select{
  font-family:var(--zh-font); padding:7px 12px; border-radius:8px; border:1.5px solid var(--accent);
  background:var(--accent-soft); color:var(--accent-dark); font-size:18pt; font-weight:600; margin:0 4px;
}
select.blank-select.correct{border-color:var(--green); background:var(--green-soft); color:var(--green);}
select.blank-select.wrong{border-color:var(--red); background:var(--red-soft); color:var(--red);}
.sentence-line{font-size:24pt; line-height:2.1;}
.gap-mark{
  display:inline-flex; align-items:center; justify-content:center; width:1.1em; height:1.1em;
  border-radius:50%; background:var(--accent-soft); color:var(--accent-dark); font-size:.6em;
  font-weight:800; margin:0 2px; vertical-align:middle;
}

.reorder-tokens-pool, .reorder-answer-row{
  display:flex; flex-wrap:wrap; gap:10px; min-height:64px; padding:12px; border-radius:12px;
}
.reorder-answer-row{background:var(--bg-soft); border:1.5px dashed var(--border); margin-bottom:14px;}
.token-chip{
  font-family:var(--zh-font); font-size:20pt; background:var(--accent-soft); color:var(--accent-dark);
  border:none; padding:10px 16px; border-radius:10px; font-weight:600;
}
.token-chip.used{opacity:.35; pointer-events:none;}
.token-chip.in-answer{background:var(--accent); color:#fff;}

.result-badge{
  display:inline-flex; align-items:center; gap:6px; padding:6px 16px; border-radius:999px;
  font-size:15px; font-weight:700; margin-bottom:12px;
}
.result-badge.ok{background:var(--green-soft); color:var(--green);}
.result-badge.no{background:var(--red-soft); color:var(--red);}
.result-badge.pending{background:var(--amber-soft); color:var(--amber);}
.result-badge.partial{background:var(--amber-soft); color:var(--amber);}

.classification-box{
  text-align:center; font-size:32pt; font-weight:800; padding:26px 20px; border-radius:18px;
  margin:16px auto 22px; max-width:640px; border:2.5px solid transparent; line-height:1.3;
}
.classification-box .cb-score{font-size:16pt; font-weight:600; display:block; margin-top:6px;}
.classification-box.tier-good{background:var(--green-soft); color:var(--green); border-color:var(--green);}
.classification-box.tier-mid{background:var(--amber-soft); color:var(--amber); border-color:var(--amber);}
.classification-box.tier-low{background:var(--red-soft); color:var(--red); border-color:var(--red);}

.explain-box{
  margin-top:16px; padding:18px 20px; background:var(--bg-soft); border-radius:12px; font-size:18pt; line-height:1.55;
}
.explain-box p{margin:0 0 10px;}
.explain-box p:last-child{margin-bottom:0;}
.explain-box b{color:var(--accent-dark);}
.ref-answer-box{
  margin-top:16px; padding:18px 20px; background:var(--amber-soft); border-radius:12px; border-left:4px solid var(--amber);
  font-size:20pt; line-height:1.55;
}
.self-mark-row{display:flex; gap:10px; margin-top:14px;}

.match-table{width:100%; border-collapse:separate; border-spacing:0 10px;}
.match-row td{padding:6px 0; vertical-align:middle;}
.match-term{
  font-family:var(--zh-font); font-size:22pt; background:var(--bg-soft); border-radius:10px;
  padding:10px 16px; display:inline-block; min-width:64px; text-align:center; font-weight:700;
}
.match-arrow{color:var(--text-faint); padding:0 12px; font-size:18px;}
select.match-select{
  font-size:16px; padding:9px 12px; border-radius:10px; border:1.5px solid var(--border);
  background:var(--bg-card); color:var(--text); min-width:220px; max-width:100%;
}
select.match-select.correct{border-color:var(--green); background:var(--green-soft); color:var(--green);}
select.match-select.wrong{border-color:var(--red); background:var(--red-soft); color:var(--red);}
@media (max-width:640px){
  .match-table, .match-table tbody, .match-table tr, .match-table td{display:block; width:100%;}
  .match-row{margin-bottom:4px; border-bottom:1px solid var(--border); padding-bottom:10px;}
  select.match-select{width:100%; margin-top:6px;}
}

.qnav-arrows{display:flex; justify-content:space-between; margin-top:20px; gap:10px;}

.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin:16px 0;}
.stat-box{background:var(--bg-soft); border-radius:12px; padding:14px; text-align:center;}
.stat-box .num{font-size:30px; font-weight:800; color:var(--accent-dark);}
.stat-box .lbl{font-size:14px; color:var(--text-dim); margin-top:2px;}

.filter-row{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0;}
.filter-chip{
  padding:8px 18px; border-radius:999px; border:1.5px solid var(--border); background:var(--bg-card);
  color:var(--text-dim); font-size:15px; font-weight:600;
}
.filter-chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}

table.history-table{width:100%; border-collapse:collapse; font-size:16px;}
table.history-table th, table.history-table td{padding:10px 8px; text-align:left; border-bottom:1px solid var(--border);}
table.history-table th{color:var(--text-dim); font-size:13px; text-transform:uppercase;}
table.history-table tr:hover td{background:var(--bg-soft); cursor:pointer;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(10,14,25,.55); display:flex; align-items:center; justify-content:center;
  z-index:200; padding:20px;
}
.modal-box{
  background:var(--bg-card); border-radius:var(--radius); padding:26px; max-width:440px; width:100%;
  box-shadow:var(--shadow);
}
.modal-box h3{margin-bottom:10px;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:20px; flex-wrap:wrap;}
.missing-list{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0;}
.missing-chip{background:var(--red-soft); color:var(--red); padding:5px 12px; border-radius:8px; font-size:15px; font-weight:700;}

.float-btns{position:fixed; right:20px; bottom:24px; display:flex; flex-direction:column; gap:10px; z-index:80;}
.float-btn{
  width:44px; height:44px; border-radius:50%; background:var(--accent); color:#fff; border:none;
  box-shadow:var(--shadow); font-size:18px; display:flex; align-items:center; justify-content:center;
}

.chart-wrap{background:var(--bg-card); border-radius:12px; padding:10px 6px;}
canvas{max-width:100%;}

.toast{
  position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg-card);
  padding:11px 22px; border-radius:999px; font-size:16px; z-index:300; box-shadow:var(--shadow);
  opacity:0; transition:opacity .3s, top .3s; pointer-events:none;
}
.toast.show{opacity:1; top:26px;}

.start-hero{text-align:center; padding:34px 20px;}
.start-hero .zh{font-size:50pt; font-weight:800; display:block; margin-bottom:10px; color:var(--accent-dark); line-height:1.2;}
.start-meta{display:flex; justify-content:center; gap:26px; flex-wrap:wrap; margin:22px 0; color:var(--text-dim); font-size:16px;}
.start-meta b{display:block; font-size:26px; color:var(--text); font-weight:800;}

.history-mini{
  background:var(--accent-soft); border-radius:12px; padding:16px 20px; margin-top:18px; font-size:16px; color:var(--accent-dark);
}

@media print{
  .no-print{display:none !important;}
  body{background:#fff; color:#000; padding:0;}
  .card{box-shadow:none; border:1px solid #ccc; page-break-inside:avoid;}
  .container{max-width:100%;}
  @page{size:A4; margin:14mm;}
}
@media (max-width:640px){
  .card{padding:16px;}
  .qnav-grid{grid-template-columns:repeat(auto-fill,minmax(32px,1fr));}
  .start-meta{gap:16px;}
}
</style>
</head>
<body>

<!-- ============================================================ TOP BAR ============================================================ -->
<div class="topbar no-print" id="topbar">
  <div class="topbar-inner">
    <div class="brand"><span id="brandZh"></span><small id="brandSub"></small></div>
    <div class="timer-box hidden" id="timerBox">⏱ <span id="timerDisplay">45:00</span></div>
    <button class="icon-btn" id="themeToggle" title="Đổi giao diện sáng/tối">🌙</button>
    <button class="icon-btn hidden" id="navPanelToggle" title="Bảng câu hỏi">☰</button>
  </div>
  <div class="container hidden" id="progressWrap">
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="progressText">Đã làm: 0 / 52 câu</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div></div>
    </div>
  </div>
</div>

<div class="container">

  <!-- ============================================================ START SCREEN ============================================================ -->
  <section id="startScreen">
    <div class="card start-hero">
      <span class="zh" id="heroZh"></span>
      <h1 id="heroTitle"></h1>
      <p id="heroDesc" style="color:var(--text-dim);max-width:560px;margin:0 auto;"></p>
      <div class="start-meta">
        <div><b id="metaTotalQ">52</b>Câu hỏi</div>
        <div><b id="metaSections">13</b>Phần bài tập</div>
        <div><b id="metaTime">45 phút</b>Thời gian đề nghị</div>
      </div>
      <button class="btn btn-primary" id="btnStart" style="font-size:18px;padding:16px 38px;">Bắt đầu làm bài</button>
      <div id="historyMiniBox" class="history-mini hidden"></div>
    </div>
  </section>

  <!-- ============================================================ QUIZ SCREEN ============================================================ -->
  <section id="quizScreen" class="hidden">
    <div class="card no-print" id="navPanel">
      <div class="nav-toggle-row">
        <h3 style="margin:0;font-size:17px;">Bảng điều hướng câu hỏi</h3>
        <span id="unansweredCount" style="font-size:14px;color:var(--text-dim);"></span>
      </div>
      <div class="qnav-legend">
        <span><i class="legend-dot" style="background:var(--gray-soft);"></i>Chưa làm</span>
        <span><i class="legend-dot" style="background:var(--accent-soft);"></i>Đã làm</span>
        <span><i class="legend-dot" style="background:var(--accent);"></i>Đang xem</span>
      </div>
      <div class="qnav-grid" id="qnavGrid"></div>
    </div>

    <div class="card" id="questionCard"></div>

    <div class="qnav-arrows no-print">
      <button class="btn btn-ghost" id="btnPrev">← Câu trước</button>
      <button class="btn btn-primary hidden" id="btnSubmit">Nộp bài</button>
      <button class="btn btn-ghost" id="btnNext">Câu sau →</button>
    </div>
  </section>

  <!-- ============================================================ RESULT SCREEN ============================================================ -->
  <section id="resultScreen" class="hidden">
    <div class="card" id="resultSummaryCard"></div>

    <div class="card no-print">
      <h3>Biểu đồ kết quả theo nhóm kiến thức</h3>
      <div class="chart-wrap"><canvas id="skillChart" width="900" height="320"></canvas></div>
    </div>

    <div class="card">
      <h3>Thống kê lịch sử làm bài</h3>
      <div class="stat-grid" id="historyStatGrid"></div>
      <div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
        <button class="btn btn-ghost btn-sm" id="btnShowHistory">Xem lịch sử các lần làm</button>
        <button class="btn btn-danger btn-sm" id="btnClearHistory">Xóa toàn bộ lịch sử</button>
      </div>
      <div id="historyTableWrap" class="hidden" style="margin-top:16px;overflow-x:auto;"></div>
    </div>

    <div class="card no-print" style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-primary" id="btnRetake">↻ Làm lại bài</button>
      <button class="btn btn-ghost" id="btnPrintResult">🖨 In kết quả</button>
      <button class="btn btn-ghost" id="btnPdfExport">⬇ Xuất PDF</button>
    </div>

    <div class="card no-print">
      <h3>Xem lại chi tiết từng câu</h3>
      <div class="filter-row" id="reviewFilters"></div>
      <div id="reviewList"></div>
    </div>
  </section>

</div>

<!-- Floating buttons -->
<div class="float-btns no-print">
  <button class="float-btn" id="btnScrollTop" title="Lên đầu trang">↑</button>
  <button class="float-btn" id="btnScrollBottom" title="Xuống cuối trang">↓</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal container -->
<div id="modalRoot"></div>

<script>
"use strict";
/* ==========================================================================================
   1. DỮ LIỆU BÀI HỌC — tách biệt hoàn toàn khỏi logic hiển thị.
   Muốn tái sử dụng cho bài học khác: chỉ cần thay object LESSON này.
========================================================================================== */
const LESSON = {
  id: "hsk2_bai3_zuobian_hongse",
  zhTitle: "左边那个红色的是我的",
  viSubtitle: "Bài 3 · Giáo trình chuẩn HSK 2",
  heroTitle: "Bài tập về nhà — Bài 3 · Giáo trình chuẩn HSK 2",

       {k:"A",t:"bên trái"},{k:"B",t:"sữa bò"},{k:"C",t:"thật, quả là"},{k:"D",t:"đồng hồ đeo tay"},
       {k:"E",t:"màu, màu sắc"},{k:"F",t:"nghìn"},{k:"G",t:"chồng"},{k:"H",t:"báo"},

     correctMap:{1:"D",2:"F",3:"H",4:"J",5:"M",6:"B",7:"K",8:"G",9:"L",10:"C",11:"N",12:"E",13:"A",14:"I"},
     explain:"<p><b>1. 手表 → D (đồng hồ đeo tay)</b> — Mẹo: 手 (tay) + 表 (đồng hồ) → đồng hồ đeo ở tay.</p><p><b>2. 千 → F (nghìn)</b> — Mẹo: So sánh với 百 (trăm) đã học — 千 lớn hơn 10 lần.</p><p><b>3. 报纸 → H (báo)</b> — Mẹo: 纸 = giấy → tờ giấy đưa tin = báo.</p><p><b>4. 送 → J (giao, đưa, tặng)</b> — Mẹo: Liên tưởng 送礼物 (tặng quà), 送牛奶 (giao sữa).</p><p><b>5. 一下 → M (làm gì đó chốc lát)</b> — Mẹo: Luôn dính liền ngay sau động từ: V + 一下.</p><p><b>6. 牛奶 → B (sữa bò)</b> — Mẹo: 牛 (bò) + 奶 (sữa) → sữa bò.</p><p><b>7. 房间 → K (phòng)</b> — Mẹo: 间 vốn nghĩa 'khoảng giữa' → không gian giữa các bức tường = phòng.</p><p><b>8. 丈夫 → G (chồng)</b> — Mẹo: Bộ 一 trên chữ 大 như người đàn ông cao lớn đứng thẳng.</p><p><b>9. 旁边 → L (bên cạnh)</b> — Mẹo: Không có hướng cụ thể, chỉ 'ở gần, kề bên'.</p><p><b>10. 真 → C (thật, quả là)</b> — Mẹo: Dấu hiệu nhận biết: câu có dấu '！' phía sau tính từ.</p><p><b>11. 粉色 → N (màu hồng)</b> — Mẹo: 粉 vốn nghĩa 'bột' (như phấn) → màu hồng nhạt như phấn.</p><p><b>12. 颜色 → E (màu, màu sắc)</b> — Mẹo: Từ khái quát, khác với tên màu cụ thể như 红色/粉色.</p><p><b>13. 左边 → A (bên trái)</b> — Mẹo: Ghi nhớ theo cặp đối lập: 左边 ↔ 右边.</p><p><b>14. 红色 → I (màu đỏ)</b> — Mẹo: 红 = tính từ 'có màu đỏ', 红色 = danh từ 'màu đỏ'.</p>"},

    // ================= PHẦN II: Điền từ vào chỗ trống =================
    {id:"q2",section:"p2",type:"text_fill",prompt:"你 ___，我看看你的手表。",
     correct:"等一下",
     explain:"<p><b>Giải thích:</b> Câu cần diễn tả 'đợi một chút' — 一下 đứng sau động từ 等 để diễn tả hành động ngắn. Đáp án đầy đủ theo câu gốc: 你等一下，我看看你的手表。</p><p><b>Vì sao đúng:</b> 一下 (yíxià) đúng ngữ pháp: Động từ + 一下 = làm trong chốc lát. 等一下 = đợi một chút.</p><p><b>Lỗi HS Việt hay gặp:</b> Học sinh hay quên 一下 phải đứng NGAY sau động từ, không chèn tân ngữ vào giữa (không viết 等你一下).</p><p><b>Mẹo ghi nhớ:</b> 一下 luôn dính liền sau động từ như một combo cố định: V + 一下.</p><p><b>Ví dụ bổ sung:</b> 你写一下这个字。(Bạn viết chữ này một chút.)</p>"},
    {id:"q3",section:"p2",type:"mcq",prompt:"这不是今天的 ___，是昨天的。",
     options:[{k:"A",t:"报纸"},{k:"B",t:"牛奶"}],correct:"A",
     explain:"<p><b>Giải thích:</b> Ngữ cảnh 'không phải của hôm nay, là của hôm qua' khớp với vật có tính thời sự theo ngày — báo.</p><p><b>Vì sao đúng:</b> 报纸 (bàozhǐ) = báo, phát hành theo ngày nên hợp lý khi so sánh 'hôm nay/hôm qua'.</p><p><b>Vì sao phương án khác sai:</b> 牛奶 (sữa bò) không có khái niệm 'sữa hôm nay/hôm qua' theo cách tự nhiên như vậy.</p><p><b>Lỗi HS Việt hay gặp:</b> Nhầm 报纸 (bàozhǐ) với 报告 (bàogào - báo cáo) do gần âm.</p><p><b>Mẹo ghi nhớ:</b> 纸 (zhǐ) = giấy → 报纸 = tờ giấy đưa tin = báo.</p><p><b>Ví dụ bổ sung:</b> 我每天早上看报纸。</p>"},
    {id:"q4",section:"p2",type:"mcq",prompt:"A：这是谁的房间？ B：这是我和我 ___ 的。",
     options:[{k:"A",t:"丈夫"},{k:"B",t:"儿子"}],correct:"A",
     explain:"<p><b>Giải thích:</b> Ngữ cảnh SGK: phòng là của 'tôi và chồng tôi' (vợ chồng).</p><p><b>Vì sao đúng:</b> 丈夫 (zhàngfu) = chồng, đúng nguyên văn hội thoại SGK: 这是我和我丈夫的。</p><p><b>Vì sao phương án khác sai:</b> 儿子 (con trai) không khớp ngữ cảnh phòng của vợ chồng trong bài.</p><p><b>Lỗi HS Việt hay gặp:</b> Nhầm 丈夫 (zhàngfu - chồng) với 大夫 (dàifu - bác sĩ) do mặt chữ 丈/大 gần giống.</p><p><b>Mẹo ghi nhớ:</b> 丈夫 có bộ 一 trên chữ 大 nhìn giống người đàn ông cao lớn đứng thẳng.</p><p><b>Ví dụ bổ sung:</b> 她的丈夫是老师。</p>"},
    {id:"q5",section:"p2",type:"mcq",prompt:"这块手表三 ___ 多块钱。",
     options:[{k:"A",t:"百"},{k:"B",t:"千"}],correct:"B",
     explain:"<p><b>Giải thích:</b> Theo hội thoại gốc: 三千多块 (hơn 3000 đồng) cho một chiếc đồng hồ.</p><p><b>Vì sao đúng:</b> 千 (qiān) = nghìn, đúng nguyên văn SGK: 三千多块。</p><p><b>Vì sao phương án khác sai:</b> 百 (trăm) làm giá trị quá thấp cho một chiếc đồng hồ đeo tay, không khớp ngữ cảnh gốc.</p><p><b>Lỗi HS Việt hay gặp:</b> Nhầm vị trí của 多 khi số > 10: viết '三千块多' (sai) thay vì '三千多块' (đúng).</p><p><b>Mẹo ghi nhớ:</b> Khi số > 10: Số + 多 + lượng từ (三千多块). Khi số < 10: số + lượng từ + 多 (三个多月).</p><p><b>Ví dụ bổ sung:</b> 这本书两千多块。</p>"},
    {id:"q6",section:"p2",type:"mcq",prompt:"我最喜欢的 ___ 是红色。",
     options:[{k:"A",t:"颜色"},{k:"B",t:"房间"}],correct:"A",
     explain:"<p><b>Giải thích:</b> Câu hỏi về sở thích 'màu' → dùng danh từ chỉ khái niệm màu sắc.</p><p><b>Vì sao đúng:</b> 颜色 (yánsè) = màu sắc, đúng chủ ngữ cho câu nói về màu yêu thích.</p><p><b>Vì sao phương án khác sai:</b> 房间 (phòng) không liên quan đến khái niệm 'màu đỏ' làm vị ngữ.</p><p><b>Lỗi HS Việt hay gặp:</b> Nhầm 颜色 (khái niệm chung 'màu') với tên một màu cụ thể như 红色/粉色.</p><p><b>Mẹo ghi nhớ:</b> 颜色 = 颜 (diện mạo/màu vẻ) + 色 (sắc) → khái niệm chung 'màu sắc'.</p><p><b>Ví dụ bổ sung:</b> 你最喜欢什么颜色？</p>"},
    {id:"q7",section:"p2",type:"mcq",prompt:"送 ___ 的人来了吗？",
     options:[{k:"A",t:"牛奶"},{k:"B",t:"手表"}],correct:"A",
     explain:"<p><b>Giải thích:</b> Nguyên văn SGK: 是不是送牛奶的来了？— người giao SỮA, không phải người giao đồng hồ.</p><p><b>Vì sao đúng:</b> 牛奶 (niúnǎi) = sữa bò, đúng nguyên văn bài khóa.</p><p><b>Vì sao phương án khác sai:</b> 手表 (đồng hồ) là món được MUA ở cửa hàng, không phải được ship tận nhà theo ngữ cảnh bài.</p><p><b>Lỗi HS Việt hay gặp:</b> Nhầm cấu trúc 送 + Danh từ + 的 (người giao X) với 送 + 给 + Người (tặng cho ai).</p><p><b>Mẹo ghi nhớ:</b> 送牛奶的 = 'người giao sữa' (danh từ hoá bằng 的-字短语).</p><p><b>Ví dụ bổ sung:</b> 送报纸的还没来。</p>"},
    {id:"q8",section:"p2",type:"mcq",prompt:"那个杯子在杯子的 ___。",
     options:[{k:"A",t:"左边"},{k:"B",t:"旁边"}],correct:"B",
     explain:"<p><b>Giải thích:</b> 旁边 (bên cạnh, không có hướng) phù hợp diễn đạt tự nhiên hơn 左边 (cần mốc quy chiếu rõ ràng) trong câu này.</p><p><b>Vì sao đúng:</b> 旁边 (pángbiān) = bên cạnh, mang nghĩa vị trí liền kề chung.</p><p><b>Vì sao phương án khác sai:</b> 左边 (bên trái) đòi hỏi một mốc quy chiếu khác rõ ràng, dùng lặp lại chủ ngữ sẽ tối nghĩa.</p><p><b>Lỗi HS Việt hay gặp:</b> Dùng lẫn 左边/右边 (có hướng) với 旁边 (không hướng, chỉ 'ở gần').</p><p><b>Mẹo ghi nhớ:</b> 左边/右边 = có hướng rõ ràng; 旁边 = không có hướng, chỉ 'kề bên'.</p><p><b>Ví dụ bổ sung:</b> 杯子在书的旁边。</p>"},
    {id:"q9",section:"p2",type:"mcq",prompt:"你 ___ 漂亮！ (chọn từ phù hợp ngữ khí cảm thán)",
     options:[{k:"A",t:"真"},{k:"B",t:"很"}],correct:"A",
     explain:"<p><b>Giải thích:</b> Câu có dấu chấm than (！) biểu thị cảm thán, cần phó từ ngữ khí 真.</p><p><b>Vì sao đúng:</b> 真 (zhēn) + tính từ + ！ diễn tả cảm thán 'thật là'.</p><p><b>Vì sao phương án khác sai:</b> 很 (hěn) là phó từ mức độ trung tính, không mang sắc thái cảm thán mạnh như 真.</p><p><b>Lỗi HS Việt hay gặp:</b> HS Việt hay dùng 很 cho mọi câu khen, quên câu cảm thán có ! nên ưu tiên 真.</p><p><b>Mẹo ghi nhớ:</b> Thấy dấu '！' sau tính từ khen ngợi → nghĩ ngay đến 真, không phải 很.</p><p><b>Ví dụ bổ sung:</b> 今天天气真好！</p>"},

    // ================= PHẦN III: 真 vs 很 =================
    {id:"q10",section:"p3",type:"mcq",prompt:"今天天气 ___ 好！",
     options:[{k:"A",t:"真"},{k:"B",t:"很"}],correct:"A",
     explain:"<p><b>Giải thích:</b> Câu có '！' → cảm thán, ngạc nhiên vui mừng → dùng 真.</p><p><b>Vì sao đúng:</b> 真 phù hợp ngữ khí cảm thán mạnh, giống mẫu câu SGK 今天天气真好！</p><p><b>Vì sao phương án khác sai:</b> 很 không sai ngữ pháp cơ bản nhưng làm mất sắc thái cảm thán mà dấu ! đòi hỏi.</p><p><b>Lỗi HS Việt hay gặp:</b> Không phân biệt được câu trần thuật và câu cảm thán chỉ qua dấu câu.</p><p><b>Mẹo ghi nhớ:</b> Câu có ! ở cuối + tính từ khen/chê mạnh → ưu tiên 真.</p><p><b>Ví dụ bổ sung:</b> 这个杯子真漂亮！</p>"},
    {id:"q11",section:"p3",type:"mcq",prompt:"这本书 ___ 有意思，但是不太贵。",
     options:[{k:"A",t:"真"},{k:"B",t:"很"}],correct:"B",
     explain:"<p><b>Giải thích:</b> Câu miêu tả trung tính, đi kèm vế so sánh 'nhưng không quá đắt' → 很.</p><p><b>Vì sao đúng:</b> 很 phù hợp câu miêu tả khách quan, không mang cảm xúc mạnh.</p><p><b>Vì sao phương án khác sai:</b> 真 sẽ làm câu nghe quá cảm thán, không hợp với vế sau mang tính liệt kê thông tin.</p><p><b>Lỗi HS Việt hay gặp:</b> Dùng 真 tràn lan cho mọi câu khen, kể cả câu miêu tả trung tính.</p><p><b>Mẹo ghi nhớ:</b> Nếu câu có thể tiếp tục bằng '...nhưng...' một cách bình thản → dùng 很, không phải 真.</p><p><b>Ví dụ bổ sung:</b> 这件衣服很漂亮，但是有点儿贵。</p>"},
    {id:"q12",section:"p3",type:"mcq",prompt:"你女儿的房间 ___ 漂亮！",
     options:[{k:"A",t:"真"},{k:"B",t:"很"}],correct:"A",
     explain:"<p><b>Giải thích:</b> Nguyên văn SGK: 你女儿的房间真漂亮！— câu cảm thán khi vừa nhìn thấy phòng.</p><p><b>Vì sao đúng:</b> 真 đúng nguyên văn bài khóa, phù hợp ngữ khí cảm thán khi mới nhìn thấy điều gì đẹp.</p><p><b>Vì sao phương án khác sai:</b> 很 làm mất sắc thái ngạc nhiên thích thú mà nhân vật thể hiện trong hội thoại gốc.</p><p><b>Lỗi HS Việt hay gặp:</b> Quên tra lại nguyên văn bài khóa khi làm bài, đoán theo cảm tính.</p><p><b>Mẹo ghi nhớ:</b> Ôn lại đúng câu gốc trong SGK là cách nhớ chắc nhất cho câu này.</p><p><b>Ví dụ bổ sung:</b> 你的房间真漂亮！我也想要一个粉色的房间。</p>"},
    {id:"q13",section:"p3",type:"mcq",prompt:"我觉得这个颜色 ___ 好看。",
     options:[{k:"A",t:"真"},{k:"B",t:"很"}],correct:"B",
     explain:"<p><b>Giải thích:</b> Có động từ 觉得 (cho rằng) đứng trước → câu nêu quan điểm cá nhân trung tính.</p><p><b>Vì sao đúng:</b> 很 hợp cấu trúc 'tôi cho rằng...rất...' mang tính nhận định, không cảm thán.</p><p><b>Vì sao phương án khác sai:</b> 真 thường không kết hợp tự nhiên ngay sau 觉得 vì 真 thiên về cảm thán tức thời hơn ý kiến cân nhắc.</p><p><b>Lỗi HS Việt hay gặp:</b> Không nhận ra 觉得 là dấu hiệu của câu nhận định (nên dùng 很).</p><p><b>Mẹo ghi nhớ:</b> 觉得 + 很 + tính từ = mẫu câu nêu ý kiến quen thuộc.</p><p><b>Ví dụ bổ sung:</b> 我觉得这本书很有意思。</p>"},
    {id:"q14",section:"p3",type:"mcq",prompt:"三千多块？ ___ 贵！",
     options:[{k:"A",t:"真"},{k:"B",t:"很"}],correct:"A",
     explain:"<p><b>Giải thích:</b> Câu phản ứng ngạc nhiên trước mức giá cao (dấu ? rồi !) → cảm thán → 真.</p><p><b>Vì sao đúng:</b> 真 phù hợp phản ứng bất ngờ trước mức giá cao.</p><p><b>Vì sao phương án khác sai:</b> 很 làm câu nghe như nhận xét bình thường, không truyền tải được sự ngạc nhiên.</p><p><b>Lỗi HS Việt hay gặp:</b> Không liên hệ ngữ cảnh 'phản ứng bất ngờ' với việc chọn 真 thay vì 很.</p><p><b>Mẹo ghi nhớ:</b> Nghe một con số/sự việc gây bất ngờ → phản xạ dùng 真 + tính từ + !</p><p><b>Ví dụ bổ sung:</b> 一千多块？真便宜！</p>"},
    {id:"q15",section:"p3",type:"mcq",prompt:"他每天六点起床，身体很好，今天他 ___ 高兴。",
     options:[{k:"A",t:"真"},{k:"B",t:"很"}],correct:"B",
     explain:"<p><b>Giải thích:</b> Câu trần thuật kể chuyện nối tiếp (không có dấu !), miêu tả khách quan về thói quen và cảm xúc → dùng 很.</p><p><b>Vì sao đúng:</b> 很 hợp câu trần thuật liên tiếp về thói quen sinh hoạt (ôn lại 起床, 身体 — Bài 2), không có sắc thái cảm thán bất ngờ.</p><p><b>Vì sao phương án khác sai:</b> 真 sẽ tạo cảm giác đột ngột, không hợp mạch kể chuyện đều đều của câu này.</p><p><b>Lỗi HS Việt hay gặp:</b> Lẫn lộn giữa câu kể chuyện (dùng 很) và câu phản ứng cảm thán tức thời (dùng 真).</p><p><b>Mẹo ghi nhớ:</b> Đoạn văn kể chuyện, miêu tả nối tiếp nhiều câu → ưu tiên 很; câu độc lập bộc lộ cảm xúc mạnh → 真.</p><p><b>Ví dụ bổ sung:</b> 她每天很忙，但是身体很好。</p>"},

    // ================= PHẦN IV: Sắp xếp câu (的-字短语) =================
    {id:"q16",section:"p4",type:"reorder",
     tokens:["手表","是","的","不","我","这块"], correctOrder:["这块","手表","不","是","我","的"],
     fullCorrect:"这块手表不是我的。",
     explain:"<p><b>Giải thích:</b> Cấu trúc: Chủ ngữ (这块手表) + 不是 + 我的 (的-字短语, lược bỏ '手表' lặp lại).</p><p><b>Vì sao đúng:</b> 我的 ở cuối câu là 的-字短语 thay cho 我的手表, tránh lặp từ đã nêu ở chủ ngữ.</p><p><b>Lỗi HS Việt hay gặp:</b> Đặt 不 sai vị trí, ví dụ '这块手表是不我的' (sai vì 不 phải đứng trước 是).</p><p><b>Mẹo ghi nhớ:</b> 不 luôn đứng ngay trước động từ/tính từ nó phủ định: 不是.</p><p><b>Ví dụ bổ sung:</b> 这本书不是他的。</p>"},
    {id:"q17",section:"p4",type:"reorder",
     tokens:["昨天","买","这个","是","的","杯子"], correctOrder:["这个","杯子","是","昨天","买","的"],
     fullCorrect:"这个杯子是昨天买的。",
     explain:"<p><b>Giải thích:</b> Cấu trúc 是...的 nhấn mạnh thời điểm mua: Chủ ngữ + 是 + 昨天买 + 的.</p><p><b>Vì sao đúng:</b> 昨天买的 là cụm danh hoá bằng 的 nhấn mạnh 'mua vào lúc nào' — đúng mẫu SGK.</p><p><b>Lỗi HS Việt hay gặp:</b> Quên đặt 是 trước cụm được nhấn mạnh, hoặc đặt 是 sai chỗ.</p><p><b>Mẹo ghi nhớ:</b> Mẫu 是...的 nhấn mạnh thời gian/địa điểm/cách thức của hành động đã xảy ra.</p><p><b>Ví dụ bổ sung:</b> 这件衣服是我在北京买的。</p>"},
    {id:"q18",section:"p4",type:"reorder",
     tokens:["的","是","谁","这","房间"], correctOrder:["这","是","谁","的","房间"],
     fullCorrect:"这是谁的房间？",
     explain:"<p><b>Giải thích:</b> Câu hỏi sở hữu: 这是 + 谁的 + danh từ (房间) — giữ nguyên danh từ vì đây là câu hỏi mở đầu.</p><p><b>Vì sao đúng:</b> 谁的房间 = 'phòng của ai', đúng nguyên văn hội thoại SGK.</p><p><b>Lỗi HS Việt hay gặp:</b> Nhầm giữa câu HỎI (cần đầy đủ danh từ) và câu TRẢ LỜI (có thể rút gọn bằng 的-字短语).</p><p><b>Mẹo ghi nhớ:</b> Câu hỏi mở đầu chủ đề → thường giữ đầy đủ danh từ; câu trả lời tiếp theo mới rút gọn bằng 的.</p><p><b>Ví dụ bổ sung:</b> 这是谁的报纸？</p>"},
    {id:"q19",section:"p4",type:"reorder",
     tokens:["送牛奶","的","是","这"], correctOrder:["这","是","送牛奶","的"],
     fullCorrect:"这是送牛奶的。",
     explain:"<p><b>Giải thích:</b> 送牛奶的 = 'người giao sữa' — Động từ + Tân ngữ + 的 = danh hoá chỉ người thực hiện hành động.</p><p><b>Vì sao đúng:</b> 送牛奶的 đúng mẫu câu SGK: 是送牛奶的。</p><p><b>Lỗi HS Việt hay gặp:</b> HS cố thêm đại từ nhân xưng (我/你) vào câu dù không có trong danh sách từ cho sẵn.</p><p><b>Mẹo ghi nhớ:</b> V + Tân ngữ + 的 (không kèm chủ ngữ) = cụm danh hoá chỉ NGƯỜI thực hiện hành động đó.</p><p><b>Ví dụ bổ sung:</b> 这是送报纸的，不是送牛奶的。</p>"},
    {id:"q20",section:"p4",type:"reorder",
     tokens:["你","吗","的","是","这本书"], correctOrder:["这本书","是","你","的","吗"],
     fullCorrect:"这本书是你的吗？",
     explain:"<p><b>Giải thích:</b> Câu hỏi sở hữu dạng 是...吗，dùng 的-字短语 你的 thay cho 你的书 (đã có 这本书 làm chủ ngữ).</p><p><b>Vì sao đúng:</b> 你的 ở cuối câu là 的-字短语 hợp lệ vì danh từ 书 đã xuất hiện ở đầu câu — đúng mẫu SGK 这块手表是你的吗？</p><p><b>Lỗi HS Việt hay gặp:</b> Quên 吗 phải đứng ở cuối cùng câu, đặt nhầm 吗 trước 的.</p><p><b>Mẹo ghi nhớ:</b> 吗 luôn ở vị trí cuối cùng của câu hỏi có/không.</p><p><b>Ví dụ bổ sung:</b> 这件衣服是她的吗？</p>"},

    // ================= PHẦN V: Viết lại câu =================
    {id:"q21",section:"p5",type:"text_fill",prompt:"这本书不是我的书。 → (rút gọn, bỏ danh từ lặp lại)",
     correct:"这本书不是我的。",
     explain:"<p><b>Giải thích:</b> Danh từ 书 đã xuất hiện ở chủ ngữ nên vị ngữ chỉ cần giữ 我的 (的-字短语).</p><p><b>Vì sao đúng:</b> 我的 thay thế hoàn toàn cho 我的书 mà không mất nghĩa.</p><p><b>Lỗi HS Việt hay gặp:</b> Ngại lược bỏ danh từ vì lo câu 'thiếu ý', trong khi tiếng Trung ưu tiên rút gọn khi ngữ cảnh đã rõ.</p><p><b>Mẹo ghi nhớ:</b> Danh từ đã nhắc ở đầu câu → luôn có thể rút gọn thành 的 ở phần sau.</p><p><b>Ví dụ bổ sung:</b> 这件衣服不是她的（衣服）。→ 这件衣服不是她的。</p>"},
    {id:"q22",section:"p5",type:"text_fill",prompt:"这块手表是三千零五十块。 → (viết lại dùng \"多\" đúng vị trí)",
     correct:"这块手表是三千多块。",
     explain:"<p><b>Giải thích:</b> Khi làm tròn số lớn hơn 10, dùng Số + 多 + lượng từ để diễn đạt 'hơn X'.</p><p><b>Vì sao đúng:</b> 三千多块 = hơn 3000 đồng, đúng vị trí 多 sau số hàng nghìn và trước lượng từ 块 (vì số > 10).</p><p><b>Lỗi HS Việt hay gặp:</b> Đặt 多 sai vị trí, viết '三千块多' (sai) thay vì '三千多块' (đúng).</p><p><b>Mẹo ghi nhớ:</b> Số > 10: [Số]多[Lượng từ]. Ví dụ: 三千多块, 二十多个.</p><p><b>Ví dụ bổ sung:</b> 他有五千多块钱。</p>"},
    {id:"q23",section:"p5",type:"text_fill",prompt:"那个房间是粉色的房间。 → (rút gọn)",
     correct:"那个房间是粉色的。",
     explain:"<p><b>Giải thích:</b> Danh từ 房间 lặp lại ở cuối câu được lược bỏ vì đã có ở chủ ngữ, giữ lại 粉色的.</p><p><b>Vì sao đúng:</b> 粉色的 = 'cái màu hồng ấy', đủ nghĩa nhờ ngữ cảnh chủ ngữ đã nêu trước.</p><p><b>Lỗi HS Việt hay gặp:</b> Nhầm 粉色的 (的-字短语, danh từ hoá) với 粉色 dùng độc lập làm tính từ không có 的.</p><p><b>Mẹo ghi nhớ:</b> Tính từ chỉ màu + 的 ở cuối câu luôn có thể thay thế cho '[màu] + danh từ' đã nhắc trước đó.</p><p><b>Ví dụ bổ sung:</b> 这件衣服是红色的（衣服）。→ 这件衣服是红色的。</p>"},
    {id:"q24",section:"p5",type:"text_fill",prompt:"手表是一千三百块。 → (viết lại dùng \"多\" nếu giá thực tế trên một nghìn ba trăm)",
     correct:"手表是一千三百多块。",
     explain:"<p><b>Giải thích:</b> Khi số tiền thực tế lớn hơn con số tròn đã nêu, thêm 多 sau đơn vị hàng cuối cùng được đọc.</p><p><b>Vì sao đúng:</b> 一千三百多块 = hơn 1300 đồng — 多 đặt sau 百 (đơn vị cuối được đọc rõ) đúng quy tắc.</p><p><b>Lỗi HS Việt hay gặp:</b> Nhầm quy tắc giữa số chỉ đọc 1 hàng (Số + 多 ngay sau) và số đọc đủ nhiều hàng (多 sau đơn vị cuối).</p><p><b>Mẹo ghi nhớ:</b> So sánh: 三千多 (chỉ đọc nghìn) khác 一千三百多 (đọc đủ nghìn+trăm, 多 đặt sau 百).</p><p><b>Ví dụ bổ sung:</b> 这个包一百五十多块。</p>"},
    {id:"q25",section:"p5",type:"text_fill",prompt:"这是我丈夫买的杯子。 → (đặt câu hỏi cho phần được gạch chân: \"我丈夫买的\")",
     correct:"这是谁买的杯子？",
     explain:"<p><b>Giải thích:</b> Phần '我丈夫买的' trả lời cho câu hỏi 'AI mua', dùng từ hỏi 谁, giữ nguyên cấu trúc 是...的.</p><p><b>Vì sao đúng:</b> 谁买的杯子 hỏi đúng vào chủ thể thực hiện hành động mua.</p><p><b>Lỗi HS Việt hay gặp:</b> Quen dùng 什么 để hỏi chung chung, quên rằng hỏi về NGƯỜI phải dùng 谁.</p><p><b>Mẹo ghi nhớ:</b> Hỏi người → 谁; hỏi vật/việc → 什么; hỏi lý do → 为什么 (đã học Bài 1).</p><p><b>Ví dụ bổ sung:</b> 这是谁送的牛奶？</p>"},
    {id:"q26",section:"p5",type:"text_fill",prompt:"那件衣服是红色的衣服。 → (rút gọn)",
     correct:"那件衣服是红色的。",
     explain:"<p><b>Giải thích:</b> Lược bỏ 衣服 lặp lại ở vị ngữ vì đã có ở chủ ngữ (那件衣服), giữ 红色的 làm 的-字短语.</p><p><b>Vì sao đúng:</b> Đây là ứng dụng lặp lại chính xác điểm ngữ pháp rút gọn khi danh từ trung tâm đã rõ từ ngữ cảnh.</p><p><b>Lỗi HS Việt hay gặp:</b> Lỗi lặp lại của cả nhóm bài rút gọn: ngại bỏ danh từ vì nghĩ sẽ 'thiếu nghĩa'.</p><p><b>Mẹo ghi nhớ:</b> Mỗi khi thấy 'A là B + danh từ' mà danh từ giống A → bỏ danh từ ở B, chỉ giữ 的.</p><p><b>Ví dụ bổ sung:</b> 那本书是新的（书）。→ 那本书是新的。</p>"},

    // ================= PHẦN VI: Tìm và sửa lỗi sai =================
    {id:"q27",section:"p6",type:"text_fill",prompt:"这本书不是我的书是。",
     correct:["这本书不是我的书。","这本书不是我的。"],
     explain:"<p><b>Giải thích:</b> Lỗi: 是 bị lặp lại 2 lần (một ở 不是, một thừa ở cuối) — chỉ cần 1 là duy nhất.</p><p><b>Vì sao đúng:</b> 这本书不是我的书 (hoặc rút gọn 这本书不是我的) chỉ có 1 是 ở vị trí phủ định 不是.</p><p><b>Lỗi HS Việt hay gặp:</b> Dịch theo thói quen tiếng Việt 'không phải...là' rồi lặp lại cả 2 từ tương ứng dẫn đến thừa 是.</p><p><b>Mẹo ghi nhớ:</b> 不是 đã bao hàm đủ nghĩa phủ định 'là', không cần thêm 是 ở cuối câu.</p><p><b>Ví dụ bổ sung:</b> 他不是老师。(không nói 他不是老师是。)</p>"},
    {id:"q28",section:"p6",type:"text_fill",prompt:"三千多块钱手表。",
     correct:"手表三千多块钱。",
     explain:"<p><b>Giải thích:</b> Lỗi: trật tự đảo lộn — số tiền phải đứng SAU danh từ được định giá, không đứng trước làm định ngữ thiếu 的.</p><p><b>Vì sao đúng:</b> 手表三千多块钱 đúng trật tự Chủ ngữ (vật) + Vị ngữ (giá tiền).</p><p><b>Lỗi HS Việt hay gặp:</b> Đặt số tiền lên trước theo thói quen liệt kê kiểu tiếng Việt.</p><p><b>Mẹo ghi nhớ:</b> Mẫu câu hỏi/đáp giá tiền cố định: [Vật] + [Giá tiền]. Ví dụ: 这本书十块钱。</p><p><b>Ví dụ bổ sung:</b> 这条裙子二百多块钱。</p>"},
    {id:"q29",section:"p6",type:"text_fill",prompt:"你的房间很真漂亮。",
     correct:"你的房间真漂亮。",
     explain:"<p><b>Giải thích:</b> Lỗi: dùng đồng thời cả 很 và 真 trước cùng một tính từ — hai phó từ này không thể đứng chồng lên nhau.</p><p><b>Vì sao đúng:</b> 真漂亮 (chỉ dùng 1 phó từ) đúng ngữ pháp và đúng nguyên văn SGK.</p><p><b>Lỗi HS Việt hay gặp:</b> Nghĩ dùng càng nhiều phó từ nhấn mạnh càng 'mạnh', trong khi chỉ được chọn MỘT.</p><p><b>Mẹo ghi nhớ:</b> Chọn 1 trong 2: 很 (trung tính) HOẶC 真 (cảm thán) — không dùng cùng lúc trước 1 tính từ.</p><p><b>Ví dụ bổ sung:</b> 今天真热！ (không nói 今天很真热！)</p>"},
    {id:"q30",section:"p6",type:"text_fill",prompt:"我看一下子这个颜色。",
     correct:"我看一下这个颜色。",
     explain:"<p><b>Giải thích:</b> Lỗi: dùng nhầm 一下子 (nghĩa 'đột nhiên') thay vì 一下 (nghĩa 'thử làm một chút').</p><p><b>Vì sao đúng:</b> 一下 đứng sau động từ 看 diễn tả 'xem thử một chút' đúng ngữ pháp và ngữ nghĩa bài học.</p><p><b>Lỗi HS Việt hay gặp:</b> Nhầm 一下 (mới học) với 一下子 (nghe qua nhưng chưa học, khác nghĩa).</p><p><b>Mẹo ghi nhớ:</b> 一下 (sau ĐT, thử làm chốc lát) ≠ 一下子 (đột nhiên) — hai từ khác nghĩa dù giống mặt chữ.</p><p><b>Ví dụ bổ sung:</b> 你尝一下这个菜。</p>"},
    {id:"q31",section:"p6",type:"text_fill",prompt:"这是谁房间的？",
     correct:"这是谁的房间？",
     explain:"<p><b>Giải thích:</b> Lỗi: vị trí 的 sai — phải đứng NGAY SAU 谁 và TRƯỚC danh từ trung tâm 房间.</p><p><b>Vì sao đúng:</b> 谁的房间 đúng cấu trúc định ngữ sở hữu: Đại từ + 的 + Danh từ.</p><p><b>Lỗi HS Việt hay gặp:</b> Nhầm giữa cấu trúc định ngữ đầy đủ (谁的+danh từ) và 的-字短语 rút gọn (danh từ+是+谁的).</p><p><b>Mẹo ghi nhớ:</b> Nếu danh từ đứng SAU 谁/我/你 → 的 nằm GIỮA (谁的房间). Nếu danh từ đã nêu ở đầu câu → 的 nằm CUỐI câu trả lời.</p><p><b>Ví dụ bổ sung:</b> 谁的杯子在桌子上？</p>"},
    {id:"q32",section:"p6",type:"text_fill",prompt:"送牛奶来了的人。",
     correct:"送牛奶的人来了。",

const STORE = {
  historyKey: "lms_history__" + LESSON.id,
  progressKey: "lms_progress__" + LESSON.id,
  themeKey: "lms_theme_pref",

  readJSON(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if(!raw) return fallback;
      const parsed = JSON.parse(raw);
      return parsed === null || parsed === undefined ? fallback : parsed;
    }catch(e){ console.warn("Dữ liệu lưu trữ lỗi, dùng giá trị mặc định cho", key, e); return fallback; }
  },
  writeJSON(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch(e){ console.warn("Không thể ghi localStorage", e); return false; }
  },
  remove(key){ try{ localStorage.removeItem(key); }catch(e){} },

  getHistory(){ const h = this.readJSON(this.historyKey, []); return Array.isArray(h) ? h : []; },
  saveHistory(list){ this.writeJSON(this.historyKey, list); },
  addAttempt(attempt){
    const list = this.getHistory();
    attempt.attemptNumber = list.length + 1;
    list.push(attempt);
    this.saveHistory(list);
    return attempt;
  },
  clearHistory(){ this.remove(this.historyKey); },

  getProgress(){ return this.readJSON(this.progressKey, null); },
  saveProgress(state){ this.writeJSON(this.progressKey, state); },
  clearProgress(){ this.remove(this.progressKey); }
};

/* ==========================================================================================
   3. STATE ỨNG DỤNG
========================================================================================== */
const QUESTIONS = LESSON.questions;
const TOTAL_Q = QUESTIONS.length;
const AUTO_TYPES = new Set(["mcq","blank_most","reorder","text_fill","dialog_fill","matching"]);

const STATE = {
  currentIndex: 0,
  answers: {},         // id -> answer payload (structure depends on type)
  selfMarks: {},        // id -> true/false/null (student self-assessment for self_check)
  startTime: null,
  submitTime: null,
  timeLimitSec: LESSON.timeLimitMinutes * 60,
  remainingSec: LESSON.timeLimitMinutes * 60,
  timerHandle: null,
  submitted: false,
  reviewFilter: "all",
  historyViewOpen: false
};

/* ==========================================================================================
   4. TIỆN ÍCH CHUNG
========================================================================================== */
function $(sel){ return document.querySelector(sel); }
function $all(sel){ return Array.from(document.querySelectorAll(sel)); }
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function normalizeCompare(s){
  return String(s||"")
    .replace(/\s+/g,"")
    .replace(/[。？！，、]/g,"")
    .replace(/[?!,.]/g,"")
    .trim();
}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m>0 ? `${m} phút ${s} giây` : `${s} giây`;
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleString("vi-VN", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove("show"), 2200);
}
function questionById(id){ return QUESTIONS.find(q=>q.id===id); }
function sectionById(id){ return LESSON.sections.find(s=>s.id===id); }

/* ==========================================================================================
   5. THEME (DARK / LIGHT)
========================================================================================== */
function initTheme(){
  const pref = STORE.readJSON(STORE.themeKey, "dark");
  document.documentElement.setAttribute("data-theme", pref);
  $("#themeToggle").textContent = pref==="dark" ? "☀️" : "🌙";
}
$("#themeToggle").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme")==="dark" ? "dark" : "light";
  const next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  STORE.writeJSON(STORE.themeKey, next);
  $("#themeToggle").textContent = next==="dark" ? "☀️" : "🌙";
});

/* ==========================================================================================
   5b. GẮN METADATA BÀI HỌC VÀO GIAO DIỆN (giúp file có thể tái sử dụng chỉ bằng cách đổi LESSON)
========================================================================================== */
function applyLessonMeta(){
  document.title = LESSON.zhTitle + " · " + LESSON.viSubtitle;
  const pageTag = document.getElementById("pageTitleTag");
  if(pageTag) pageTag.textContent = LESSON.zhTitle + " · " + LESSON.viSubtitle;
  const set = (id,txt)=>{ const e=document.getElementById(id); if(e) e.textContent = txt; };
  set("brandZh", LESSON.zhTitle);
  set("brandSub", LESSON.viSubtitle);
  set("heroZh", LESSON.zhTitle);
  set("heroTitle", LESSON.heroTitle || ("Bài tập về nhà — "+LESSON.viSubtitle));
  set("heroDesc", LESSON.heroDescription || "");
}

/* ==========================================================================================
   6. KHỞI ĐỘNG / MÀN HÌNH BẮT ĐẦU
========================================================================================== */
function initStartScreen(){
  applyLessonMeta();
  $("#metaTotalQ").textContent = TOTAL_Q;
  $("#metaSections").textContent = LESSON.sections.length;
  $("#metaTime").textContent = LESSON.timeLimitMinutes + " phút";

  const history = STORE.getHistory();
  const inProgress = STORE.getProgress();

  if(history.length){
    const scores = history.map(a=>a.percentage);
    const best = Math.max(...scores);
    const avg = Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
    const last = history[history.length-1];
    const box = $("#historyMiniBox");
    box.classList.remove("hidden");
    box.innerHTML = `📊 Bạn đã làm bài này <b>${history.length}</b> lần. Điểm gần nhất: <b>${last.percentage}%</b> · Điểm cao nhất: <b>${best}%</b> · Trung bình: <b>${avg}%</b>`;
  }

  if(inProgress && !inProgress.submitted){
    showResumeModal(inProgress);
  }
}

function showResumeModal(saved){
  const answeredCount = Object.keys(saved.answers||{}).length;
  openModal(`
    <h3>Tiếp tục bài làm dở?</h3>
    <p>Hệ thống phát hiện bạn có một lần làm bài chưa hoàn thành (${answeredCount}/${TOTAL_Q} câu đã trả lời, còn ${fmtTime(saved.remainingSec)} phút).</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="mResumeRestart">Làm lại từ đầu</button>
      <button class="btn btn-primary" id="mResumeContinue">Tiếp tục làm bài</button>
    </div>
  `);
  $("#mResumeContinue").onclick = ()=>{ closeModal(); restoreProgress(saved); beginQuiz(true); };
  $("#mResumeRestart").onclick = ()=>{ closeModal(); STORE.clearProgress(); };
}

function restoreProgress(saved){
  STATE.answers = saved.answers || {};
  STATE.selfMarks = saved.selfMarks || {};
  STATE.currentIndex = saved.currentIndex || 0;
  STATE.startTime = saved.startTime || Date.now();
  STATE.remainingSec = saved.remainingSec != null ? saved.remainingSec : STATE.timeLimitSec;
}

$("#btnStart").addEventListener("click", ()=>{
  STATE.startTime = Date.now();
  STATE.remainingSec = STATE.timeLimitSec;
  beginQuiz(false);
});

function beginQuiz(resumed){
  $("#startScreen").classList.add("hidden");
  $("#quizScreen").classList.remove("hidden");
  $("#timerBox").classList.remove("hidden");
  $("#progressWrap").classList.remove("hidden");
  $("#navPanelToggle").classList.remove("hidden");
  renderQNav();
  renderQuestion(STATE.currentIndex);
  updateProgressBar();
  startTimer();
  if(!resumed) toast("Chúc bạn làm bài tốt! 加油！");
}

/* ==========================================================================================
   7. ĐỒNG HỒ ĐẾM NGƯỢC
========================================================================================== */
function startTimer(){
  clearInterval(STATE.timerHandle);
  updateTimerDisplay();
  STATE.timerHandle = setInterval(()=>{
    STATE.remainingSec--;
    if(STATE.remainingSec <= 0){
      STATE.remainingSec = 0;
      updateTimerDisplay();
      clearInterval(STATE.timerHandle);
      toast("⏰ Đã hết thời gian làm bài!");
      finalizeSubmit(true);
      return;
    }
    updateTimerDisplay();
    persistProgress();
  }, 1000);
}
function updateTimerDisplay(){
  $("#timerDisplay").textContent = fmtTime(STATE.remainingSec);
  $("#timerBox").classList.toggle("warn", STATE.remainingSec <= 300);
}

/* ==========================================================================================
   8. TIẾN ĐỘ / LƯU TẠM (LOCALSTORAGE)
========================================================================================== */
function persistProgress(){
  STORE.saveProgress({
    currentIndex: STATE.currentIndex,
    answers: STATE.answers,
    selfMarks: STATE.selfMarks,
    startTime: STATE.startTime,
    remainingSec: STATE.remainingSec,
    submitted: false
  });
}
function isAnswered(q){
  const a = STATE.answers[q.id];
  if(a === undefined || a === null) return false;
  if(q.type==="mcq") return !!a.choice;
  if(q.type==="blank_most") return Array.isArray(a.blanks) && a.blanks.every(b=>b!==null && b!==undefined);
  if(q.type==="reorder") return Array.isArray(a.order) && a.order.length === q.tokens.length;
  if(q.type==="text_fill") return !!(a.text && a.text.trim().length>0);
  if(q.type==="dialog_fill") return a.blanks && Object.keys(a.blanks).length === Object.keys(q.correctMap).length && Object.values(a.blanks).every(v=>!!v);
  if(q.type==="matching") return a.matches && Object.keys(a.matches).length === q.terms.length && Object.values(a.matches).every(v=>!!v);
  if(q.type==="self_check") return !!(a.text && a.text.trim().length>0);
  return false;
}
function answeredCountAll(){ return QUESTIONS.filter(isAnswered).length; }

function updateProgressBar(){
  const done = answeredCountAll();
  const pct = Math.round(done/TOTAL_Q*100);
  $("#progressText").textContent = `Đã làm: ${done} / ${TOTAL_Q} câu`;
  $("#progressPercent").textContent = pct+"%";
  $("#progressBarFill").style.width = pct+"%";
  $("#unansweredCount").textContent = `Chưa làm: ${TOTAL_Q-done} câu`;
  refreshQNavStates();
}

/* ==========================================================================================
   9. BẢNG ĐIỀU HƯỚNG CÂU HỎI
========================================================================================== */
function renderQNav(){
  const grid = $("#qnavGrid");
  grid.innerHTML = "";
  QUESTIONS.forEach((q, idx)=>{
    const btn = el("button","qnav-item", (idx+1));
    btn.dataset.idx = idx;
    btn.title = sectionById(q.section).title;
    btn.addEventListener("click", ()=>{ STATE.currentIndex = idx; renderQuestion(idx); });
    grid.appendChild(btn);
  });
  refreshQNavStates();
}
function refreshQNavStates(){
  $all(".qnav-item").forEach((btn,idx)=>{
    const q = QUESTIONS[idx];
    btn.classList.remove("answered","current","correct","wrong","self","partial");
    if(idx === STATE.currentIndex) btn.classList.add("current");
    if(STATE.submitted){
      const g = gradeQuestion(q);
      if(g.status==="correct") btn.classList.add("correct");
      else if(g.status==="wrong") btn.classList.add("wrong");
      else if(g.status==="partial") btn.classList.add("partial");
      else if(g.status==="self") btn.classList.add("self");
    } else if(isAnswered(q)){
      btn.classList.add("answered");
    }
  });
}
$("#navPanelToggle").addEventListener("click", ()=>{
  $("#navPanel").scrollIntoView({behavior:"smooth", block:"start"});
});

/* ==========================================================================================
   10. RENDER CÂU HỎI (theo từng dạng)
========================================================================================== */
function renderQuestion(idx){
  STATE.currentIndex = idx;
  const q = QUESTIONS[idx];
  const sec = sectionById(q.section);
  const card = $("#questionCard");
  card.innerHTML = "";

  card.appendChild(el("div","q-section-title", escapeHtml(sec.title)));
  card.appendChild(el("span","q-skill-tag", escapeHtml(sec.skill)));
  card.appendChild(el("div","q-num", `Câu ${idx+1} / ${TOTAL_Q}${sec.instruction ? " · "+escapeHtml(sec.instruction) : ""}`));

  if(sec.passage){
    card.appendChild(el("div","passage-box zh", escapeHtml(LESSON.passages[sec.passage])));
  }

  const body = el("div","q-body");
  card.appendChild(body);

  switch(q.type){
    case "mcq": renderMCQ(body,q); break;
    case "blank_most": renderBlankMost(body,q); break;
    case "reorder": renderReorder(body,q); break;
    case "text_fill": renderTextFill(body,q); break;
    case "dialog_fill": renderDialogFill(body,q); break;
    case "matching": renderMatching(body,q); break;
    case "self_check": renderSelfCheck(body,q); break;
  }

  if(STATE.submitted) renderGradedFeedback(card,q);

  $("#btnPrev").disabled = idx===0;
  $("#btnNext").classList.toggle("hidden", idx===TOTAL_Q-1);
  $("#btnSubmit").classList.toggle("hidden", idx!==TOTAL_Q-1 || STATE.submitted);
  updateProgressBar();
  card.scrollIntoView({behavior:"smooth", block:"start"});
}
function autoAdvance(){
  // Tự động chuyển sang câu tiếp theo sau khi học sinh chọn xong đáp án (không áp dụng cho câu nhập văn bản tự do).
  if(STATE.submitted) return;
  if(STATE.currentIndex >= TOTAL_Q-1) return;
  clearTimeout(autoAdvance._h);
  autoAdvance._h = setTimeout(()=>{
    if(STATE.currentIndex < TOTAL_Q-1) renderQuestion(STATE.currentIndex+1);
  }, 500);
}
function isFirstOfSection(idx){
  const sec = QUESTIONS[idx].section;
  return idx===0 || QUESTIONS[idx-1].section !== sec;
}

function renderMCQ(body,q){
  if(q.prompt) body.appendChild(el("div","q-prompt zh", escapeHtml(q.prompt)));
  if(q.markedSentence){
    const CIRCLES = {1:"①",2:"②",3:"③",4:"④"};
    const line = el("div","sentence-line zh");
    q.markedSentence.forEach(part=>{
      if(typeof part === "number"){
        line.appendChild(el("span","gap-mark", CIRCLES[part] || part));
      } else {
        line.appendChild(document.createTextNode(part));
      }
    });
    body.appendChild(line);
    body.appendChild(el("p",null,`<span style="font-size:15px;color:var(--text-dim);">${q.options.some(o=>o.k==="none") ? `Chọn vị trí đúng để điền ${q.gapWord||"最"}, hoặc chọn "Không cần điền ${q.gapWord||"最"}" nếu câu không cần so sánh nhất.` : `Chọn vị trí đúng để điền ${q.gapWord||"最"}.`}</span>`));
  }
  const list = el("div","options-list");
  const cur = STATE.answers[q.id];
  q.options.forEach(opt=>{
    const item = el("button","option-item");
    item.innerHTML = `<span class="opt-key">${opt.k}</span><span class="zh">${escapeHtml(opt.t)}</span>`;
    if(cur && cur.choice===opt.k) item.classList.add("selected");
    item.disabled = STATE.submitted;
    if(STATE.submitted){
      item.classList.add("locked");
      if(opt.k===q.correct) item.classList.add("correct-answer");
      else if(cur && cur.choice===opt.k) item.classList.add("wrong-selected");
    }
    item.addEventListener("click", ()=>{
      STATE.answers[q.id] = {choice: opt.k};
      persistProgress();
      renderQuestion(STATE.currentIndex);
      autoAdvance();
    });
    list.appendChild(item);
  });
  body.appendChild(list);
  if(STATE.submitted && q.fullCorrect){
    body.appendChild(el("p",null,`<b>Câu hoàn chỉnh đúng:</b> <span class="zh">${escapeHtml(q.fullCorrect)}</span>`));
  }
}

function renderBlankMost(body,q){
  const line = el("div","sentence-line zh");
  const cur = STATE.answers[q.id] || {blanks:new Array(q.blanks.length).fill(null)};
  q.segments.forEach((seg,i)=>{
    line.appendChild(document.createTextNode(seg));
    if(i < q.blanks.length){
      const sel = document.createElement("select");
      sel.className = "blank-select";
      sel.disabled = STATE.submitted;
      sel.innerHTML = `<option value="">(chọn)</option><option value="0">(để trống)</option><option value="1">最</option>`;
      sel.value = cur.blanks[i]==null ? "" : (cur.blanks[i]?"1":"0");
      sel.addEventListener("change", ()=>{
        const arr = (STATE.answers[q.id]||{blanks:new Array(q.blanks.length).fill(null)}).blanks.slice();
        arr[i] = sel.value==="" ? null : sel.value==="1";
        STATE.answers[q.id] = {blanks:arr};
        persistProgress();
        updateProgressBar();
      });
      line.appendChild(sel);
    }
  });
  body.appendChild(line);
  if(STATE.submitted){
    body.appendChild(el("p",null,`<b>Câu hoàn chỉnh đúng:</b> <span class="zh">${escapeHtml(q.fullCorrect)}</span>`));
  }
}

function renderReorder(body,q){
  const cur = STATE.answers[q.id] || {order:[]};
  const answerRow = el("div","reorder-answer-row");
  const poolRow = el("div","reorder-tokens-pool");

  function usedIndices(){ return cur.order.slice(); }

  function draw(){
    answerRow.innerHTML = "";
    poolRow.innerHTML = "";
    if(cur.order.length===0){ answerRow.appendChild(el("span",null,'<span style="color:var(--text-faint);font-size:13px;">Bấm các từ bên dưới theo đúng thứ tự...</span>')); }
    cur.order.forEach((tok,pos)=>{
      const chip = el("button","token-chip zh", escapeHtml(tok));
      chip.disabled = STATE.submitted;
      chip.addEventListener("click", ()=>{
        cur.order.splice(pos,1);
        STATE.answers[q.id] = {order:cur.order};
        persistProgress(); draw(); updateProgressBar();
      });
      answerRow.appendChild(chip);
    });
    // pool = remaining tokens (respect duplicates by index)
    const usedFlags = new Array(q.tokens.length).fill(false);
    cur.order.forEach(tok=>{
      const i = q.tokens.findIndex((t,ti)=>t===tok && !usedFlags[ti]);
      if(i>-1) usedFlags[i]=true;
    });
    q.tokens.forEach((tok,ti)=>{
      const chip = el("button","token-chip zh", escapeHtml(tok));
      if(usedFlags[ti]){ chip.classList.add("used"); chip.disabled = true; }
      else{
        chip.disabled = STATE.submitted;
        chip.addEventListener("click", ()=>{
          cur.order.push(tok);
          STATE.answers[q.id] = {order:cur.order};
          persistProgress(); draw(); updateProgressBar();
          if(cur.order.length === q.tokens.length) autoAdvance();
        });
      }
      poolRow.appendChild(chip);
    });
  }
  draw();
  body.appendChild(el("div",null,'<p style="font-size:13px;color:var(--text-dim);margin-bottom:6px;">Câu bạn đã ghép:</p>'));
  body.appendChild(answerRow);
  body.appendChild(el("div",null,'<p style="font-size:13px;color:var(--text-dim);margin:12px 0 6px;">Các từ cho sẵn:</p>'));
  body.appendChild(poolRow);
  if(!STATE.submitted){
    const resetBtn = el("button","btn btn-ghost btn-sm", "Đặt lại");
    resetBtn.style.marginTop="12px";
    resetBtn.addEventListener("click", ()=>{ cur.order=[]; STATE.answers[q.id]={order:[]}; persistProgress(); draw(); updateProgressBar(); });
    body.appendChild(resetBtn);
  }
  if(STATE.submitted){
    body.appendChild(el("p",null,`<b>Câu đúng:</b> <span class="zh">${escapeHtml(q.fullCorrect)}</span>`));
  }
}

   13. CHẤM ĐIỂM
========================================================================================== */
function gradeQuestion(q){
  const a = STATE.answers[q.id];
  if(q.type === "self_check"){
    if(!STATE.submitted) return {status:"pending", graded:false};
    const mark = STATE.selfMarks[q.id];
    return {status: mark===true ? "correct" : mark===false ? "wrong" : "self", graded:false, selfMark:mark};
  }
  if(!STATE.submitted) return {status:"pending", graded:true};

  // Các dạng câu hỏi có nhiều "ô nhỏ" bên trong (hội thoại nhiều chỗ trống, nối từ)
  // được chấm điểm từng phần (partial credit) thay vì chỉ đúng/sai toàn bộ.
  if(q.type === "dialog_fill"){
    const keys = Object.keys(q.correctMap);
    const max = keys.length;
    const score = a && a.blanks ? keys.filter(k => (a.blanks[k]||"") === q.correctMap[k]).length : 0;
    const status = score===0 ? "wrong" : score===max ? "correct" : "partial";
    return {status, graded:true, score, max};
  }
  if(q.type === "matching"){
    const max = q.terms.length;
    const score = a && a.matches ? q.terms.filter(t => (a.matches[t.id]||"") === q.correctMap[t.id]).length : 0;
    const status = score===0 ? "wrong" : score===max ? "correct" : "partial";
    return {status, graded:true, score, max};
  }

  if(!a) return {status:"wrong", graded:true, unanswered:true, score:0, max:1};
  let ok = false;
  if(q.type === "mcq"){
    ok = a.choice === q.correct;
  } else if(q.type === "blank_most"){
    ok = Array.isArray(a.blanks) && q.blanks.every((b,i)=> a.blanks[i]===b.correct);
  } else if(q.type === "reorder"){
    ok = Array.isArray(a.order) && a.order.length===q.correctOrder.length && a.order.every((t,i)=>t===q.correctOrder[i]);
  } else if(q.type === "text_fill"){
    ok = Array.isArray(q.correct)
      ? q.correct.some(c => normalizeCompare(a.text) === normalizeCompare(c))
      : normalizeCompare(a.text) === normalizeCompare(q.correct);
  }
  return {status: ok ? "correct":"wrong", graded:true, score: ok?1:0, max:1};
}

function computeResult(){
  const autoQuestions = QUESTIONS.filter(q=>AUTO_TYPES.has(q.type));
  const selfQuestions = QUESTIONS.filter(q=>q.type==="self_check");
  let autoScore = 0, autoMax = 0, questionsFullyCorrect = 0;
  autoQuestions.forEach(q=>{
    const g = gradeQuestion(q);
    autoScore += g.score; autoMax += g.max;
    if(g.status==="correct") questionsFullyCorrect++;
  });
  const autoCorrect = questionsFullyCorrect;
  const autoWrong = autoQuestions.length - questionsFullyCorrect;
  const percentage = autoMax ? Math.round(autoScore/autoMax*100) : 0;
  const score100 = percentage;

  // group by skill (autoScore/autoMax dùng để tính % chính xác theo điểm thành phần,
  // autoCorrect/autoTotal dùng để đếm số CÂU chấm đúng hoàn toàn)
  const bySkill = {};
  QUESTIONS.forEach(q=>{
    const sec = sectionById(q.section);
    const skill = sec.skill || "Khác";
    if(!bySkill[skill]) bySkill[skill] = {total:0, autoTotal:0, autoCorrect:0, autoScore:0, autoMax:0, selfTotal:0, selfOk:0, selfDone:0};
    bySkill[skill].total++;
    if(AUTO_TYPES.has(q.type)){
      const g = gradeQuestion(q);
      bySkill[skill].autoTotal++;
      bySkill[skill].autoScore += g.score;
      bySkill[skill].autoMax += g.max;
      if(g.status==="correct") bySkill[skill].autoCorrect++;
    } else {
      bySkill[skill].selfTotal++;
      const mark = STATE.selfMarks[q.id];
      if(mark!==undefined && mark!==null){ bySkill[skill].selfDone++; if(mark===true) bySkill[skill].selfOk++; }
    }
  });

  const unansweredCount = QUESTIONS.filter(q=>!isAnswered(q)).length;
  const durationSec = Math.round((STATE.submitTime - STATE.startTime)/1000);

  let classification = "";
  if(percentage>=95) classification="Xuất sắc";
  else if(percentage>=90) classification="Rất tốt";
  else if(percentage>=80) classification="Giỏi";
  else if(percentage>=70) classification="Khá";
  else if(percentage>=60) classification="Đạt";
  else classification="Cần cố gắng";

  // strengths / weaknesses based only on measured skill data (no fabrication)
  const skillEntries = Object.entries(bySkill).filter(([k,v])=>v.autoMax>0).map(([k,v])=>({skill:k, pct:Math.round(v.autoScore/v.autoMax*100)}));
  skillEntries.sort((a,b)=>b.pct-a.pct);
  const strengths = skillEntries.filter(s=>s.pct>=80).map(s=>s.skill);
  const weaknesses = skillEntries.filter(s=>s.pct<70).map(s=>s.skill);

  const attemptRecord = {
    lessonId: LESSON.id,
    lessonTitle: LESSON.title,
    startTime: STATE.startTime,
    submitTime: STATE.submitTime,
    duration: durationSec,
    totalScore: score100,
    percentage: percentage,
    correctAnswers: autoCorrect,
    wrongAnswers: autoWrong,
    unansweredQuestions: unansweredCount,
    scoreBySection: Object.fromEntries(LESSON.sections.map(s=>{
      const qs = QUESTIONS.filter(q=>q.section===s.id && AUTO_TYPES.has(q.type));
      const c = qs.filter(q=>gradeQuestion(q).status==="correct").length;
      return [s.id, {title:s.title, total:qs.length, correct:c}];
    })),
    scoreBySkill: Object.fromEntries(Object.entries(bySkill).map(([k,v])=>[k,{autoTotal:v.autoTotal,autoCorrect:v.autoCorrect,autoScore:v.autoScore,autoMax:v.autoMax,selfTotal:v.selfTotal,selfDone:v.selfDone,selfOk:v.selfOk}])),
    studentAnswers: STATE.answers,
    selfMarks: STATE.selfMarks,
    teacherFeedback: null,
    classification: classification,
    version: LESSON.version
  };

  return {autoCorrect, autoWrong, autoTotal: autoQuestions.length, autoScore, autoMax, percentage, score100, classification,
           bySkill, unansweredCount, durationSec, strengths, weaknesses, attemptRecord};
}
