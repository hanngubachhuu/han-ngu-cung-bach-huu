<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">Luyện tập HSK 2</title>
<style>
/* ============================================================
   THEME VARIABLES
============================================================ */
:root{
  --bg:#f4f6fb; --bg-card:#ffffff; --bg-soft:#eef1f8;
  --text:#1c2333; --text-dim:#5b6577; --text-faint:#8992a3;
  --accent:#3b5bdb; --accent-dark:#2a43a8; --accent-soft:#e9edfd;
  --green:#1f9d55; --green-soft:#e6f7ec;
  --red:#e03131; --red-soft:#fdecec;
  --amber:#f0a500; --amber-soft:#fff6e0;
  --gray:#9aa2b1; --gray-soft:#eef0f4;
  --border:#e3e7f0; --shadow:0 4px 18px rgba(30,40,80,.07);
  --shadow-sm:0 2px 8px rgba(30,40,80,.06);
  --radius:16px; --radius-sm:10px;
  --zh-font:"KaiTi","STKaiti","KaiTi_GB2312",serif;
  --vi-font:"Times New Roman","Times",serif;
}
[data-theme="dark"]{
  --bg:#12151f; --bg-card:#1a1e2b; --bg-soft:#20253544;
  --text:#e8eaf2; --text-dim:#a9b0c3; --text-faint:#767f95;
  --accent:#6d8dff; --accent-dark:#4f6ee0; --accent-soft:#232a48;
  --green:#4bd07a; --green-soft:#16301f;
  --red:#ff6b6b; --red-soft:#3a1c1c;
  --amber:#ffc94a; --amber-soft:#3a2f10;
  --gray:#767f95; --gray-soft:#232838;
  --border:#2b3145; --shadow:0 4px 20px rgba(0,0,0,.35);
  --shadow-sm:0 2px 10px rgba(0,0,0,.3);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--vi-font); line-height:1.6;
  transition:background .3s,color .3s;
  padding-bottom:40px;
}
.zh{font-family:var(--zh-font); font-size:1.15em; letter-spacing:.5px;}
h1,h2,h3,h4{font-family:var(--vi-font); margin:0 0 8px;}
h1{font-size:44pt; line-height:1.15;}
h2{font-size:28pt; line-height:1.2;}
h3{font-size:20pt; line-height:1.25;}
h4{font-size:16pt;}
p{margin:0 0 10px;}
button{font-family:var(--vi-font); cursor:pointer;}
a{color:var(--accent);}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

.container{max-width:980px; margin:0 auto; padding:0 18px;}
.hidden{display:none !important;}
.card{
  background:var(--bg-card); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:24px; margin-bottom:20px;
  border:1px solid var(--border);
}
.btn{
  border:none; border-radius:999px; padding:13px 24px; font-size:17px;
  font-weight:600; transition:.2s; background:var(--accent-soft); color:var(--accent-dark);
}
.btn:hover{filter:brightness(1.05); transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--accent); color:#fff; box-shadow:0 4px 14px rgba(59,91,219,.35);}
.btn-primary:hover{background:var(--accent-dark);}
.btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--border);}
.btn-danger{background:var(--red-soft); color:var(--red);}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
.btn-sm{padding:8px 16px; font-size:15px;}

/* ============ HEADER / TOPBAR ============ */
.topbar{
  position:sticky; top:0; z-index:50; background:var(--bg-card);
  border-bottom:1px solid var(--border); box-shadow:var(--shadow-sm);
}
.topbar-inner{
  max-width:980px; margin:0 auto; padding:10px 18px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.brand{font-weight:800; font-size:20px; color:var(--accent-dark); flex:1; min-width:140px;}
.brand small{display:block; font-weight:400; color:var(--text-faint); font-size:13px;}
.timer-box{
  display:flex; align-items:center; gap:6px; background:var(--bg-soft);
  padding:8px 16px; border-radius:999px; font-weight:700; font-size:17px;
  font-variant-numeric:tabular-nums;
}
.timer-box.warn{color:var(--red); background:var(--red-soft);}
.icon-btn{
  background:var(--bg-soft); border:none; border-radius:50%; width:38px; height:38px;
  display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--text);
}

/* ============ PROGRESS ============ */
.progress-wrap{margin:14px 0 6px;}
.progress-meta{
  display:flex; justify-content:space-between; font-size:15px; color:var(--text-dim); margin-bottom:6px;
}
.progress-bar-track{
  height:10px; border-radius:999px; background:var(--bg-soft); overflow:hidden;
}
.progress-bar-fill{
  height:100%; background:linear-gradient(90deg,var(--accent),#7c9bff);
  border-radius:999px; transition:width .4s ease;
}

/* ============ NAV GRID ============ */
.nav-toggle-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.qnav-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:14px; color:var(--text-dim); margin-bottom:10px;}
.legend-dot{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:middle;}
.qnav-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(42px,1fr)); gap:8px;}
.qnav-item{
  aspect-ratio:1/1; border-radius:8px; border:none; background:var(--gray-soft); color:var(--text-dim);
  font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center;
  position:relative; transition:.15s;
}
.qnav-item.answered{background:var(--accent-soft); color:var(--accent-dark);}
.qnav-item.current{outline:2px solid var(--accent); outline-offset:2px;}
.qnav-item.correct{background:var(--green-soft); color:var(--green);}
.qnav-item.wrong{background:var(--red-soft); color:var(--red);}
.qnav-item.self{background:var(--amber-soft); color:var(--amber);}
.qnav-item.partial{background:var(--amber-soft); color:var(--amber);}
.qnav-item .dot-type{position:absolute; bottom:2px; right:2px; width:5px; height:5px; border-radius:50%; background:var(--text-faint);}

/* ============ QUESTION CARD ============ */
.q-section-title{font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); font-weight:700; margin-bottom:4px;}
.q-skill-tag{
  display:inline-block; font-size:13px; padding:4px 12px; border-radius:999px;
  background:var(--accent-soft); color:var(--accent-dark); font-weight:700; margin-bottom:10px;
}
.q-num{font-size:15px; color:var(--text-faint); margin-bottom:6px;}
.q-prompt{font-size:24pt; line-height:1.5; margin-bottom:18px;}
.passage-box{
  background:var(--bg-soft); border-left:4px solid var(--accent); border-radius:8px;
  padding:18px 20px; margin-bottom:18px; font-size:22pt; line-height:1.6;
}
.options-list{display:flex; flex-direction:column; gap:12px;}
.option-item{
  display:flex; align-items:center; gap:14px; padding:16px 20px; border-radius:12px;
  border:1.5px solid var(--border); background:var(--bg-card); transition:.15s; text-align:left; width:100%;
  font-size:22pt; color:var(--text);
}
.option-item:hover{border-color:var(--accent);}
.option-item.selected{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark); font-weight:600;}
.option-item .opt-key{
  width:34px; height:34px; border-radius:50%; background:var(--bg-soft); display:flex; align-items:center;
  justify-content:center; font-size:15px; font-weight:700; flex-shrink:0;
}
.option-item.selected .opt-key{background:var(--accent); color:#fff;}
.option-item.locked.correct-answer{border-color:var(--green); background:var(--green-soft); color:var(--green);}
.option-item.locked.wrong-selected{border-color:var(--red); background:var(--red-soft); color:var(--red);}

.text-input, textarea.text-input{
  width:100%; padding:15px 18px; border-radius:12px; border:1.5px solid var(--border);
  background:var(--bg-card); color:var(--text); font-size:22pt; font-family:var(--zh-font);
}
textarea.text-input{min-height:120px; resize:vertical; font-family:var(--vi-font);}
.text-input:focus, textarea.text-input:focus{outline:none; border-color:var(--accent);}
select.blank-select{
  font-family:var(--zh-font); padding:7px 12px; border-radius:8px; border:1.5px solid var(--accent);
  background:var(--accent-soft); color:var(--accent-dark); font-size:18pt; font-weight:600; margin:0 4px;
}
select.blank-select.correct{border-color:var(--green); background:var(--green-soft); color:var(--green);}
select.blank-select.wrong{border-color:var(--red); background:var(--red-soft); color:var(--red);}
.sentence-line{font-size:24pt; line-height:2.1;}
.gap-mark{
  display:inline-flex; align-items:center; justify-content:center; width:1.1em; height:1.1em;
  border-radius:50%; background:var(--accent-soft); color:var(--accent-dark); font-size:.6em;
  font-weight:800; margin:0 2px; vertical-align:middle;
}

.reorder-tokens-pool, .reorder-answer-row{
  display:flex; flex-wrap:wrap; gap:10px; min-height:64px; padding:12px; border-radius:12px;
}
.reorder-answer-row{background:var(--bg-soft); border:1.5px dashed var(--border); margin-bottom:14px;}
.token-chip{
  font-family:var(--zh-font); font-size:20pt; background:var(--accent-soft); color:var(--accent-dark);
  border:none; padding:10px 16px; border-radius:10px; font-weight:600;
}
.token-chip.used{opacity:.35; pointer-events:none;}
.token-chip.in-answer{background:var(--accent); color:#fff;}

.result-badge{
  display:inline-flex; align-items:center; gap:6px; padding:6px 16px; border-radius:999px;
  font-size:15px; font-weight:700; margin-bottom:12px;
}
.result-badge.ok{background:var(--green-soft); color:var(--green);}
.result-badge.no{background:var(--red-soft); color:var(--red);}
.result-badge.pending{background:var(--amber-soft); color:var(--amber);}
.result-badge.partial{background:var(--amber-soft); color:var(--amber);}

.classification-box{
  text-align:center; font-size:32pt; font-weight:800; padding:26px 20px; border-radius:18px;
  margin:16px auto 22px; max-width:640px; border:2.5px solid transparent; line-height:1.3;
}
.classification-box .cb-score{font-size:16pt; font-weight:600; display:block; margin-top:6px;}
.classification-box.tier-good{background:var(--green-soft); color:var(--green); border-color:var(--green);}
.classification-box.tier-mid{background:var(--amber-soft); color:var(--amber); border-color:var(--amber);}
.classification-box.tier-low{background:var(--red-soft); color:var(--red); border-color:var(--red);}

.explain-box{
  margin-top:16px; padding:18px 20px; background:var(--bg-soft); border-radius:12px; font-size:18pt; line-height:1.55;
}
.explain-box p{margin:0 0 10px;}
.explain-box p:last-child{margin-bottom:0;}
.explain-box b{color:var(--accent-dark);}
.ref-answer-box{
  margin-top:16px; padding:18px 20px; background:var(--amber-soft); border-radius:12px; border-left:4px solid var(--amber);
  font-size:20pt; line-height:1.55;
}
.self-mark-row{display:flex; gap:10px; margin-top:14px;}

.match-table{width:100%; border-collapse:separate; border-spacing:0 10px;}
.match-row td{padding:6px 0; vertical-align:middle;}
.match-term{
  font-family:var(--zh-font); font-size:22pt; background:var(--bg-soft); border-radius:10px;
  padding:10px 16px; display:inline-block; min-width:64px; text-align:center; font-weight:700;
}
.match-arrow{color:var(--text-faint); padding:0 12px; font-size:18px;}
select.match-select{
  font-size:16px; padding:9px 12px; border-radius:10px; border:1.5px solid var(--border);
  background:var(--bg-card); color:var(--text); min-width:220px; max-width:100%;
}
select.match-select.correct{border-color:var(--green); background:var(--green-soft); color:var(--green);}
select.match-select.wrong{border-color:var(--red); background:var(--red-soft); color:var(--red);}
@media (max-width:640px){
  .match-table, .match-table tbody, .match-table tr, .match-table td{display:block; width:100%;}
  .match-row{margin-bottom:4px; border-bottom:1px solid var(--border); padding-bottom:10px;}
  select.match-select{width:100%; margin-top:6px;}
}

.qnav-arrows{display:flex; justify-content:space-between; margin-top:20px; gap:10px;}

.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin:16px 0;}
.stat-box{background:var(--bg-soft); border-radius:12px; padding:14px; text-align:center;}
.stat-box .num{font-size:30px; font-weight:800; color:var(--accent-dark);}
.stat-box .lbl{font-size:14px; color:var(--text-dim); margin-top:2px;}

.filter-row{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0;}
.filter-chip{
  padding:8px 18px; border-radius:999px; border:1.5px solid var(--border); background:var(--bg-card);
  color:var(--text-dim); font-size:15px; font-weight:600;
}
.filter-chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}

table.history-table{width:100%; border-collapse:collapse; font-size:16px;}
table.history-table th, table.history-table td{padding:10px 8px; text-align:left; border-bottom:1px solid var(--border);}
table.history-table th{color:var(--text-dim); font-size:13px; text-transform:uppercase;}
table.history-table tr:hover td{background:var(--bg-soft); cursor:pointer;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(10,14,25,.55); display:flex; align-items:center; justify-content:center;
  z-index:200; padding:20px;
}
.modal-box{
  background:var(--bg-card); border-radius:var(--radius); padding:26px; max-width:440px; width:100%;
  box-shadow:var(--shadow);
}
.modal-box h3{margin-bottom:10px;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:20px; flex-wrap:wrap;}
.missing-list{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0;}
.missing-chip{background:var(--red-soft); color:var(--red); padding:5px 12px; border-radius:8px; font-size:15px; font-weight:700;}

.float-btns{position:fixed; right:20px; bottom:24px; display:flex; flex-direction:column; gap:10px; z-index:80;}
.float-btn{
  width:44px; height:44px; border-radius:50%; background:var(--accent); color:#fff; border:none;
  box-shadow:var(--shadow); font-size:18px; display:flex; align-items:center; justify-content:center;
}

.chart-wrap{background:var(--bg-card); border-radius:12px; padding:10px 6px;}
canvas{max-width:100%;}

.toast{
  position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg-card);
  padding:11px 22px; border-radius:999px; font-size:16px; z-index:300; box-shadow:var(--shadow);
  opacity:0; transition:opacity .3s, top .3s; pointer-events:none;
}
.toast.show{opacity:1; top:26px;}

.start-hero{text-align:center; padding:34px 20px;}
.start-hero .zh{font-size:50pt; font-weight:800; display:block; margin-bottom:10px; color:var(--accent-dark); line-height:1.2;}
.start-meta{display:flex; justify-content:center; gap:26px; flex-wrap:wrap; margin:22px 0; color:var(--text-dim); font-size:16px;}
.start-meta b{display:block; font-size:26px; color:var(--text); font-weight:800;}

.history-mini{
  background:var(--accent-soft); border-radius:12px; padding:16px 20px; margin-top:18px; font-size:16px; color:var(--accent-dark);
}

@media print{
  .no-print{display:none !important;}
  body{background:#fff; color:#000; padding:0;}
  .card{box-shadow:none; border:1px solid #ccc; page-break-inside:avoid;}
  .container{max-width:100%;}
  @page{size:A4; margin:14mm;}
}
@media (max-width:640px){
  .card{padding:16px;}
  .qnav-grid{grid-template-columns:repeat(auto-fill,minmax(32px,1fr));}
  .start-meta{gap:16px;}
}
</style>
</head>
<body>

<!-- ============================================================ TOP BAR ============================================================ -->
<div class="topbar no-print" id="topbar">
  <div class="topbar-inner">
    <div class="brand"><span id="brandZh"></span><small id="brandSub"></small></div>
    <div class="timer-box hidden" id="timerBox">⏱ <span id="timerDisplay">45:00</span></div>
    <button class="icon-btn" id="themeToggle" title="Đổi giao diện sáng/tối">🌙</button>
    <button class="icon-btn hidden" id="navPanelToggle" title="Bảng câu hỏi">☰</button>
  </div>
  <div class="container hidden" id="progressWrap">
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="progressText">Đã làm: 0 / 52 câu</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div></div>
    </div>
  </div>
</div>

<div class="container">

  <!-- ============================================================ START SCREEN ============================================================ -->
  <section id="startScreen">
    <div class="card start-hero">
      <span class="zh" id="heroZh"></span>
      <h1 id="heroTitle"></h1>
      <p id="heroDesc" style="color:var(--text-dim);max-width:560px;margin:0 auto;"></p>
      <div class="start-meta">
        <div><b id="metaTotalQ">52</b>Câu hỏi</div>
        <div><b id="metaSections">13</b>Phần bài tập</div>
        <div><b id="metaTime">45 phút</b>Thời gian đề nghị</div>
      </div>
      <button class="btn btn-primary" id="btnStart" style="font-size:18px;padding:16px 38px;">Bắt đầu làm bài</button>
      <div id="historyMiniBox" class="history-mini hidden"></div>
    </div>
  </section>

  <!-- ============================================================ QUIZ SCREEN ============================================================ -->
  <section id="quizScreen" class="hidden">
    <div class="card no-print" id="navPanel">
      <div class="nav-toggle-row">
        <h3 style="margin:0;font-size:17px;">Bảng điều hướng câu hỏi</h3>
        <span id="unansweredCount" style="font-size:14px;color:var(--text-dim);"></span>
      </div>
      <div class="qnav-legend">
        <span><i class="legend-dot" style="background:var(--gray-soft);"></i>Chưa làm</span>
        <span><i class="legend-dot" style="background:var(--accent-soft);"></i>Đã làm</span>
        <span><i class="legend-dot" style="background:var(--accent);"></i>Đang xem</span>
      </div>
      <div class="qnav-grid" id="qnavGrid"></div>
    </div>

    <div class="card" id="questionCard"></div>

    <div class="qnav-arrows no-print">
      <button class="btn btn-ghost" id="btnPrev">← Câu trước</button>
      <button class="btn btn-primary hidden" id="btnSubmit">Nộp bài</button>
      <button class="btn btn-ghost" id="btnNext">Câu sau →</button>
    </div>
  </section>

  <!-- ============================================================ RESULT SCREEN ============================================================ -->
  <section id="resultScreen" class="hidden">
    <div class="card" id="resultSummaryCard"></div>

    <div class="card no-print">
      <h3>Biểu đồ kết quả theo nhóm kiến thức</h3>
      <div class="chart-wrap"><canvas id="skillChart" width="900" height="320"></canvas></div>
    </div>

    <div class="card">
      <h3>Thống kê lịch sử làm bài</h3>
      <div class="stat-grid" id="historyStatGrid"></div>
      <div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
        <button class="btn btn-ghost btn-sm" id="btnShowHistory">Xem lịch sử các lần làm</button>
        <button class="btn btn-danger btn-sm" id="btnClearHistory">Xóa toàn bộ lịch sử</button>
      </div>
      <div id="historyTableWrap" class="hidden" style="margin-top:16px;overflow-x:auto;"></div>
    </div>

    <div class="card no-print" style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-primary" id="btnRetake">↻ Làm lại bài</button>
      <button class="btn btn-ghost" id="btnPrintResult">🖨 In kết quả</button>
      <button class="btn btn-ghost" id="btnPdfExport">⬇ Xuất PDF</button>
    </div>

    <div class="card no-print">
      <h3>Xem lại chi tiết từng câu</h3>
      <div class="filter-row" id="reviewFilters"></div>
      <div id="reviewList"></div>
    </div>
  </section>

</div>

<!-- Floating buttons -->
<div class="float-btns no-print">
  <button class="float-btn" id="btnScrollTop" title="Lên đầu trang">↑</button>
  <button class="float-btn" id="btnScrollBottom" title="Xuống cuối trang">↓</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal container -->
<div id="modalRoot"></div>

<script>
"use strict";
/* ==========================================================================================
   1. DỮ LIỆU BÀI HỌC — tách biệt hoàn toàn khỏi logic hiển thị.
   Muốn tái sử dụng cho bài học khác: chỉ cần thay object LESSON này.
========================================================================================== */
const LESSON = {
  id: "hsk2_bai4_zhege_gongzuo",
  zhTitle: "这个工作是他帮我介绍的",
  viSubtitle: "Bài 4 · Giáo trình chuẩn HSK 2",
  heroTitle: "Bài tập về nhà — Bài 4 · Giáo trình chuẩn HSK 2",

    // ================= A1: Nối từ (matching, 8 cặp) =================
    {id:"q1",section:"p1",type:"matching",
     terms:[{id:1,zh:"生日"},{id:2,zh:"快乐"},{id:3,zh:"晚上"},{id:4,zh:"问"},{id:5,zh:"非常"},{id:6,zh:"开始"},{id:7,zh:"已经"},{id:8,zh:"介绍"}],
     optionsPool:[{k:"A",t:"hỏi"},{k:"B",t:"đã"},{k:"C",t:"sinh nhật"},{k:"D",t:"bắt đầu"},{k:"E",t:"buổi tối"},{k:"F",t:"giới thiệu"},{k:"G",t:"rất, vô cùng"},{k:"H",t:"vui vẻ"}],
     correctMap:{1:"C",2:"H",3:"E",4:"A",5:"G",6:"D",7:"B",8:"F"},
     explain:"<p><b>1. 生日→C</b>: 生 (sinh) + 日 (ngày) = ngày sinh. Không nhầm với 生病 (Bài 2) vì cùng có chữ 生.</p><p><b>2. 快乐→H</b>: thường đi sau danh từ ngày lễ (生日快乐, 新年快乐).</p><p><b>3. 晚上→E</b>: đối lập với 早上 (Bài 2). Lỗi hay gặp: viết nhầm thứ tự 上晚.</p><p><b>4. 问→A</b>: có bộ 口 (miệng) trong chữ 门 → dùng miệng để hỏi. Không nhầm với 请 (mời/xin).</p><p><b>5. 非常→G</b>: mạnh hơn 很, đứng trước tính từ/động từ tâm lý. Không nhầm với 真 (Bài 3).</p><p><b>6. 开始→D</b>: 开 (mở) + 始 (đầu) = mở đầu. Luôn cần theo sau bởi một động từ khác.</p><p><b>7. 已经→B</b>: thường đi cùng 了 cuối câu. Không nhầm với 开始 (điểm bắt đầu, không phải trạng thái hoàn thành).</p><p><b>8. 介绍→F</b>: thường đi với 帮 (帮我介绍 = giúp tôi giới thiệu). Không nhầm với 认识 (kết quả sau khi giới thiệu).</p>"},

    // ================= A2: Chọn từ đúng (mcq 4 lựa chọn) =================
    {id:"q2",section:"p2",type:"mcq",prompt:"请你 ___ 我一杯牛奶，谢谢！ (Cho tôi một cốc sữa nhé, cảm ơn!)",
     options:[{k:"A",t:"给"},{k:"B",t:"送"},{k:"C",t:"问"},{k:"D",t:"帮"}],correct:"A",
     explain:"<p><b>Giải thích:</b> 给 (gěi) ở đây là động từ 'đưa, cho' — 给 + người + vật: 给我一杯牛奶 = đưa/cho tôi một cốc sữa.</p><p><b>Vì sao các đáp án khác sai:</b> 送 (tặng) dùng khi biếu quà có tính lâu dài; 问 (hỏi) và 帮 (giúp) không phù hợp nghĩa 'đưa đồ uống'.</p><p><b>Lỗi HS Việt hay gặp:</b> Dùng 送 thay 给 vì cả hai đều dịch là 'cho/tặng' trong tiếng Việt.</p><p><b>Mẹo ghi nhớ:</b> 给 = trao tận tay ngay lúc đó; 送 = tặng món quà có ý nghĩa hơn.</p><p><b>Ví dụ bổ sung:</b> 服务员，请给我一杯咖啡。</p>"},
    {id:"q3",section:"p2",type:"mcq",prompt:"我 ___ 你介绍一下我的丈夫。 (Tôi giúp bạn giới thiệu chồng tôi một chút.)",
     options:[{k:"A",t:"给"},{k:"B",t:"帮"},{k:"C",t:"已经"},{k:"D",t:"两"}],correct:"B",
     explain:"<p><b>Giải thích:</b> 帮 (bāng) = giúp — 帮 + người + động từ khác: 帮你介绍 = giúp bạn giới thiệu.</p><p><b>Vì sao các đáp án khác sai:</b> 给 cũng đứng trước động từ (给你介绍) nhưng nghĩa là 'giới thiệu cho bạn', không khớp 'giúp' trong đề; 已经/两 không phải động từ giúp đỡ.</p><p><b>Lỗi HS Việt hay gặp:</b> Lẫn 帮 và 给 vì cả hai đều đứng trước động từ khác.</p><p><b>Mẹo ghi nhớ:</b> 帮 luôn mang nghĩa 'ra tay giúp đỡ'; 给 thiên về 'làm việc đó cho ai'.</p><p><b>Ví dụ bổ sung:</b> 谁帮你介绍这个工作的？</p>"},
    {id:"q4",section:"p2",type:"mcq",prompt:"我今年 ___ 二十岁了，明年就要工作了。 (Năm nay tôi đã 20 tuổi rồi, sang năm là phải đi làm.)",
     options:[{k:"A",t:"已经"},{k:"B",t:"非常"},{k:"C",t:"开始"},{k:"D",t:"两"}],correct:"A",
     explain:"<p><b>Giải thích:</b> 已经 + số tuổi + 了 diễn tả mức độ/trạng thái đã đạt được: 已经二十岁了.</p><p><b>Vì sao các đáp án khác sai:</b> 非常 (rất) không đi trước số tuổi; 开始 (bắt đầu) không hợp nghĩa; 两 chỉ dùng trước lượng từ.</p><p><b>Lỗi HS Việt hay gặp:</b> Quên 了 cuối câu khi có 已经.</p><p><b>Mẹo ghi nhớ:</b> 已经……了 luôn đi thành cặp trong câu khẳng định trạng thái đã đạt tới.</p><p><b>Ví dụ bổ sung:</b> 我已经工作两年多了。</p>"},
    {id:"q5",section:"p2",type:"mcq",prompt:"今天 ___，我要和丈夫一起看电视。 (Tối nay, tôi sẽ cùng chồng xem tivi.)",
     options:[{k:"A",t:"早上"},{k:"B",t:"时间"},{k:"C",t:"晚上"},{k:"D",t:"生日"}],correct:"C",
     explain:"<p><b>Giải thích:</b> 晚上 = buổi tối, khớp nghĩa 'tối nay'; ngữ cảnh 'xem tivi cùng chồng' thường diễn ra buổi tối.</p><p><b>Vì sao các đáp án khác sai:</b> 早上 (sáng) trái nghĩa; 时间 (thời gian nói chung) không xác định buổi; 生日 (sinh nhật) không liên quan.</p><p><b>Lỗi HS Việt hay gặp:</b> Nhầm 今天晚上 (tối nay) với 明天晚上 (tối mai) khi dịch.</p><p><b>Mẹo ghi nhớ:</b> 今天 + 晚上 = tối của ngày hôm nay.</p><p><b>Ví dụ bổ sung:</b> 今天晚上你有电话吗？</p>"},
    {id:"q6",section:"p2",type:"mcq",prompt:"他八岁的时候 ___ 踢足球。 (Anh ấy bắt đầu đá bóng từ năm 8 tuổi.)",
     options:[{k:"A",t:"已经"},{k:"B",t:"两"},{k:"C",t:"开始"},{k:"D",t:"长"}],correct:"C",
     explain:"<p><b>Giải thích:</b> 开始 + động từ = bắt đầu làm gì: 开始踢足球 = bắt đầu đá bóng.</p><p><b>Vì sao các đáp án khác sai:</b> 已经 diễn tả việc đã hoàn thành, không phải điểm bắt đầu; 两/长 không phải động từ.</p><p><b>Lỗi HS Việt hay gặp:</b> Lẫn 开始 (bắt đầu một hành động) với 已经 (đã ở trạng thái nào đó).</p><p><b>Mẹo ghi nhớ:</b> [mốc thời gian] + 的时候 + 开始 + V.</p><p><b>Ví dụ bổ sung:</b> 我六岁的时候开始学中文。</p>"},
    {id:"q7",section:"p2",type:"mcq",prompt:"我买了 ___ 本书，一本给儿子，一本给女儿。 (Tôi đã mua hai quyển sách, một quyển cho con trai, một quyển cho con gái.)",
     options:[{k:"A",t:"二"},{k:"B",t:"两"},{k:"C",t:"已经"},{k:"D",t:"长"}],correct:"B",
     explain:"<p><b>Giải thích:</b> 两 dùng trước lượng từ (本, 个, 年...): 两本书 đúng quy tắc 两 + lượng từ + danh từ.</p><p><b>Vì sao các đáp án khác sai:</b> 二本书 sai ngữ pháp (二 không đứng trước lượng từ); 已经/长 không phải số từ.</p><p><b>Lỗi HS Việt hay gặp:</b> Đây là lỗi rất phổ biến của HS Việt: dùng '二' thay '两' trước lượng từ.</p><p><b>Mẹo ghi nhớ:</b> 两 + lượng từ; 二 + đơn vị đếm thứ tự/số điện thoại/toán học.</p><p><b>Ví dụ bổ sung:</b> 我家有两个孩子。</p>"},

    // ================= A3: Phân biệt từ dễ nhầm =================
    {id:"q8",section:"p3",type:"mcq",prompt:"我家有 ___ 个孩子。 (Nhà tôi có hai đứa con.)",
     options:[{k:"A",t:"二"},{k:"B",t:"两"}],correct:"B",
     explain:"<p><b>Giải thích:</b> 两 luôn đứng trước lượng từ 个/本/张... — '两个孩子' đúng quy tắc, '二个孩子' sai ngữ pháp.</p><p><b>Vì sao 二 sai:</b> 二 chỉ dùng để đếm số đơn thuần (一二三...) hoặc số điện thoại/số nhà, không đứng trước lượng từ.</p><p><b>Lỗi HS Việt hay gặp:</b> Lỗi phổ biến nhất của HS Việt khi học số đếm HSK2.</p><p><b>Mẹo ghi nhớ:</b> 'Hai' trước lượng từ → luôn là 两, không bao giờ là 二.</p><p><b>Ví dụ bổ sung:</b> 我要两杯咖啡。</p>"},
    {id:"q9",section:"p3",type:"mcq",prompt:"现在是 ___ 点半。 (Bây giờ là hai giờ rưỡi.)",
     options:[{k:"A",t:"二"},{k:"B",t:"两"}],correct:"B",
     explain:"<p><b>Giải thích:</b> 点 (giờ) là lượng từ chỉ thời gian, nên phải dùng 两 — '两点半' là cách nói giờ chuẩn.</p><p><b>Vì sao 二 sai:</b> '二点半' là lỗi sai điển hình, không tồn tại trong tiếng Trung chuẩn.</p><p><b>Lỗi HS Việt hay gặp:</b> Áp dụng máy móc 'hai = 二' trong mọi trường hợp kể cả khi nói giờ.</p><p><b>Mẹo ghi nhớ:</b> Nói giờ luôn dùng 两点, không dùng 二点 (trừ 十二点 vì đó là số ghép).</p><p><b>Ví dụ bổ sung:</b> 现在两点十分。</p>"},
    {id:"q10",section:"p3",type:"mcq",prompt:"这条河很长。(Dòng sông này rất dài.) — Trong câu này, 长 đọc là:",
     options:[{k:"A",t:"cháng"},{k:"B",t:"zhǎng"}],correct:"A",
     explain:"<p><b>Giải thích:</b> 长 đọc cháng khi mang nghĩa 'dài' (khoảng cách/độ dài) — '很长' miêu tả độ dài dòng sông.</p><p><b>Vì sao zhǎng sai:</b> zhǎng dùng khi 长 mang nghĩa 'lớn tuổi hơn/trưởng thành', không phù hợp ngữ cảnh miêu tả độ dài.</p><p><b>Lỗi HS Việt hay gặp:</b> Đọc lẫn lộn hai âm vì mặt chữ giống nhau hoàn toàn.</p><p><b>Mẹo ghi nhớ:</b> 长 vốn nghĩa 'người già chống gậy' → nghĩa mở rộng 'khoảng cách xa' đọc cháng, còn 'lớn tuổi' đọc zhǎng.</p><p><b>Ví dụ bổ sung:</b> 那条路很长。</p>"},
    {id:"q11",section:"p3",type:"mcq",prompt:"我爷爷是家里最年长的人。(Ông tôi là người lớn tuổi nhất trong nhà.) — Trong câu này, 长 đọc là:",
     options:[{k:"A",t:"cháng"},{k:"B",t:"zhǎng"}],correct:"B",
     explain:"<p><b>Giải thích:</b> 长 đọc zhǎng khi mang nghĩa 'lớn tuổi, trưởng thành' (年长 = cao niên, lớn tuổi).</p><p><b>Vì sao cháng sai:</b> cháng chỉ dùng cho nghĩa 'dài/lâu' như trong 时间很长, 路很长.</p><p><b>Lỗi HS Việt hay gặp:</b> Đọc mọi trường hợp của 长 là cháng vì đó là nghĩa được học chính thức trong Bài 4.</p><p><b>Mẹo ghi nhớ:</b> Câu thần chú: 'đo độ dài → cháng; đo tuổi tác → zhǎng'.</p><p><b>Ví dụ bổ sung:</b> 他是家里最年长的哥哥。</p>"},

     lines:[{sp:"", segs:["这本书 ",1," 我在北京买 ",2,"。"]}],
     correctMap:{1:"是",2:"的"},
     explain:"<p><b>Giải thích:</b> Cấu trúc 是……的 nhấn mạnh địa điểm (北京) của hành động 买 đã xảy ra: Tân ngữ (这本书) + 是 + chủ thể/nơi chốn + động từ + 的.</p><p><b>Vì sao đúng:</b> Nếu chỉ dùng 我在北京买了这本书 thì đúng ngữ pháp nhưng không nhấn mạnh được địa điểm bằng 是……的.</p><p><b>Lỗi HS Việt hay gặp:</b> Quên 的 ở cuối, chỉ viết '这本书是我在北京买。'</p><p><b>Mẹo ghi nhớ:</b> 是……的 giống như đóng khung: 是 mở đầu nhấn mạnh, 的 đóng lại cuối câu.</p><p><b>Ví dụ bổ sung:</b> 这件衣服是我在商店买的。</p>"},
    {id:"q13",section:"p4",type:"dialog_fill",wordBank:["是","的"],
     lines:[
       {sp:"A", segs:["这件衣服 ",1," 谁送 ",2,"？"]},
       {sp:"B", segs:[3," 我妈妈送 ",4,"。"]}
     ],
     correctMap:{1:"是",2:"的",3:"是",4:"的"},
     explain:"<p><b>Giải thích:</b> Câu hỏi và câu trả lời đều dùng khung 是……的 để nhấn mạnh người tặng (谁/我妈妈) — cấu trúc hỏi-đáp song song.</p><p><b>Vì sao đúng:</b> Nếu bỏ 是 ở câu trả lời, câu vẫn đúng nhưng mất sắc thái nhấn mạnh 'chính là mẹ tôi'.</p><p><b>Lỗi HS Việt hay gặp:</b> Chỉ điền một trong hai từ (thiếu 是 hoặc thiếu 的).</p><p><b>Mẹo ghi nhớ:</b> Câu hỏi dùng 谁 ở vị trí chủ thể thì câu trả lời cũng đặt tên người ở đúng vị trí đó.</p><p><b>Ví dụ bổ sung:</b> A: 这个电话是谁打的？ B: 是我姐姐打的。</p>"},
    {id:"q14",section:"p4",type:"dialog_fill",wordBank:["是","的"],
     lines:[{sp:"", segs:["你 ",1," 什么时候来中国 ",2,"？"]}],
     correctMap:{1:"是",2:"的"},
     explain:"<p><b>Giải thích:</b> Nhấn mạnh mốc thời gian (什么时候) của hành động 来 đã xảy ra trong quá khứ. Câu hỏi về thời gian của việc đã biết chắc chắn xảy ra bắt buộc dùng 是……的, không dùng 了.</p><p><b>Vì sao đúng:</b> '你什么时候来中国了？' không tự nhiên bằng cấu trúc 是……的 khi hỏi lại thông tin đã biết.</p><p><b>Lỗi HS Việt hay gặp:</b> Dùng 了 thay vì 是……的 khi hỏi về thời gian của việc đã xảy ra.</p><p><b>Mẹo ghi nhớ:</b> Hỏi 'khi nào/ở đâu/bằng cách nào' cho việc ĐÃ XẢY RA và ĐÃ BIẾT → luôn nghĩ đến 是……的.</p><p><b>Ví dụ bổ sung:</b> 你是几月来的越南？</p>"},
    {id:"q15",section:"p4",type:"dialog_fill",wordBank:["是","的"],
     lines:[{sp:"", segs:["这个电话不 ",1," 我打 ",2,"，",3," 我丈夫打 ",4,"。"]}],
     correctMap:{1:"是",2:"的",3:"是",4:"的"},
     explain:"<p><b>Giải thích:</b> Phủ định của 是……的 là thêm 不 trước 是: 不是……的. 不是我打的 (phủ định) + 是我丈夫打的 (khẳng định lại chủ thể đúng).</p><p><b>Vì sao đúng:</b> Không thể nói '这个电话不我打的' — thiếu 是 sau 不.</p><p><b>Lỗi HS Việt hay gặp:</b> Quên thêm 是 sau 不, chỉ viết 不打的.</p><p><b>Mẹo ghi nhớ:</b> Phủ định luôn thêm 不 ngay trước 是, giữ nguyên 的 ở cuối.</p><p><b>Ví dụ bổ sung:</b> 这个汉字不是我写的，是老师写的。</p>"},
    {id:"q16",section:"p4",type:"dialog_fill",wordBank:["是","的"],
     lines:[
       {sp:"A", segs:["这个工作 ",1," 谁介绍 ",2,"？"]},
       {sp:"B", segs:[3," 王先生帮我介绍 ",4,"。"]}
     ],
     correctMap:{1:"是",2:"的",3:"是",4:"的"},
     explain:"<p><b>Giải thích:</b> Câu gốc trong bài khóa: 这个工作是他帮我介绍的 — nhấn mạnh chủ thể (王先生) thực hiện hành động 帮…介绍.</p><p><b>Vì sao đúng:</b> Nếu nói '这个工作王先生介绍了' thì đúng nhưng không nhấn mạnh được 'chính là ai' như bài khóa yêu cầu.</p><p><b>Lỗi HS Việt hay gặp:</b> Đặt 是 sai vị trí, để trước 谁 thay vì đầu cụm chủ thể.</p><p><b>Mẹo ghi nhớ:</b> Đây chính là câu chủ đề của Bài 4 — học thuộc câu mẫu này để nhớ cấu trúc.</p><p><b>Ví dụ bổ sung:</b> 这个工作是他帮我介绍的。(câu gốc bài khóa)</p>"},

    // ================= B2: Sắp xếp câu =================
    {id:"q17",section:"p5",type:"reorder",
     tokens:["是","我","写","这本书","的"], correctOrder:["这本书","是","我","写","的"],
     fullCorrect:"这本书是我写的。",
     explain:"<p><b>Giải thích:</b> Trật tự: Tân ngữ (这本书) + 是 + Chủ thể (我) + Động từ (写) + 的.</p><p><b>Vì sao đúng:</b> Đúng khung 是……的 đã học ở B1.</p><p><b>Lỗi HS Việt hay gặp:</b> Để 是 ở đầu câu theo thói quen tiếng Việt 'Là tôi viết quyển sách này.'</p><p><b>Mẹo ghi nhớ:</b> Luôn đưa vật/sự việc được nhắc tới lên đầu câu trước 是.</p><p><b>Ví dụ bổ sung:</b> 这封信是他写的。</p>"},
    {id:"q18",section:"p5",type:"reorder",
     tokens:["他","八岁","的时候","开始","踢足球"], correctOrder:["他","八岁","的时候","开始","踢足球"],
     fullCorrect:"他八岁的时候开始踢足球。",
     explain:"<p><b>Giải thích:</b> Trật tự: Chủ ngữ + [mốc thời gian] + 的时候 + Động từ. 的时候 luôn đứng ngay sau cụm chỉ thời gian/tuổi, trước phần hành động chính.</p><p><b>Vì sao đúng:</b> '他的时候八岁开始踢足球' sai vì 的时候 phải theo sau 八岁 chứ không xen giữa chủ ngữ và số tuổi.</p><p><b>Lỗi HS Việt hay gặp:</b> Đặt 的时候 ngay sau chủ ngữ vì dịch theo trật tự tiếng Việt 'khi anh ấy...'.</p><p><b>Mẹo ghi nhớ:</b> 的时候 giống một 'dấu ngoặc đóng' cho cụm thời gian phía trước nó.</p><p><b>Ví dụ bổ sung:</b> 她五岁的时候开始学画画。</p>"},
    {id:"q19",section:"p5",type:"reorder",
     tokens:["他","回家","的时候","已经","晚上了"], correctOrder:["他","回家","的时候","已经","晚上了"],
     fullCorrect:"他回家的时候已经晚上了。",
     explain:"<p><b>Giải thích:</b> Mệnh đề động từ (回家) + 的时候 đứng trước, mệnh đề kết quả (已经晚上了) đứng sau.</p><p><b>Vì sao đúng:</b> Đúng cấu trúc [Động từ] + 的时候, [已经 + trạng thái + 了].</p><p><b>Lỗi HS Việt hay gặp:</b> Để 已经 lên đầu câu theo thói quen tiếng Việt 'đã... khi...'.</p><p><b>Mẹo ghi nhớ:</b> Câu có hai mệnh đề: mệnh đề '的时候' luôn là bối cảnh, đứng trước mệnh đề chính.</p><p><b>Ví dụ bổ sung:</b> 我到公司的时候，同事已经开始工作了。</p>"},
    {id:"q20",section:"p5",type:"reorder",
     tokens:["这个","工作","是","谁","帮你","介绍","的"], correctOrder:["这个","工作","是","谁","帮你","介绍","的"],
     fullCorrect:"这个工作是谁帮你介绍的？",
     explain:"<p><b>Giải thích:</b> Câu hỏi dùng 是……的, từ nghi vấn 谁 thay cho vị trí chủ thể. Trật tự giống câu khẳng định, chỉ thay chủ thể bằng 谁.</p><p><b>Vì sao đúng:</b> '谁是这个工作帮你介绍的' sai vì 是 phải đứng ngay sau tân ngữ 这个工作.</p><p><b>Lỗi HS Việt hay gặp:</b> Đưa 谁 lên đầu câu như trong tiếng Việt 'Ai giới thiệu công việc này cho bạn?'</p><p><b>Mẹo ghi nhớ:</b> Từ nghi vấn 谁 luôn thay vào đúng vị trí của thành phần được hỏi, không dời lên đầu câu.</p><p><b>Ví dụ bổ sung:</b> 这本书是谁写的？</p>"},
    {id:"q21",section:"p5",type:"reorder",
     tokens:["不是","这","我","打","的"], correctOrder:["这","不是","我","打","的"],
     fullCorrect:"这不是我打的。",
     explain:"<p><b>Giải thích:</b> Phủ định 是……的: Tân ngữ/chủ đề + 不是 + chủ thể + động từ + 的.</p><p><b>Vì sao đúng:</b> Giữ nguyên khung câu, chỉ thêm 不 trước 是.</p><p><b>Lỗi HS Việt hay gặp:</b> Để 不是 ở giữa câu thay vì ngay sau chủ đề.</p><p><b>Mẹo ghi nhớ:</b> Chủ đề luôn đứng đầu, 不是 đứng ngay sau, phần còn lại giữ nguyên trật tự câu khẳng định.</p><p><b>Ví dụ bổ sung:</b> 这不是他送的礼物。</p>"},

    // ================= B3: Viết lại câu =================
    {id:"q22",section:"p6",type:"text_fill",prompt:"Viết lại câu dùng \"已经……了\": 他现在会做饭。 (Trước đây không biết, giờ đã biết.)",
     correct:"他已经会做饭了。",
     explain:"<p><b>Giải thích:</b> 已经 + V + 了 nhấn mạnh sự thay đổi/đạt được kỹ năng, diễn tả đúng ý 'trước không biết, giờ đã biết'.</p><p><b>Lỗi HS Việt hay gặp:</b> Quên thêm 了 cuối câu dù đã có 已经.</p><p><b>Mẹo ghi nhớ:</b> 已经 và 了 luôn đi cùng nhau trong câu khẳng định trạng thái mới đạt được.</p><p><b>Ví dụ bổ sung:</b> 他已经会说汉语了。</p>"},
    {id:"q23",section:"p6",type:"text_fill",prompt:"Viết lại câu dùng \"已经……了\" để nhấn mạnh việc đã hoàn thành: 我做完了作业。",
     correct:"我已经做完作业了。",
     explain:"<p><b>Giải thích:</b> Thêm 已经 trước động từ để nhấn mạnh mức độ hoàn thành: 已经做完...了 nhấn mạnh hơn chỉ dùng 了 đơn thuần.</p><p><b>Lỗi HS Việt hay gặp:</b> Đặt 已经 ngay trước 了 ở cuối câu thay vì trước động từ.</p><p><b>Mẹo ghi nhớ:</b> Trật tự chuẩn: Chủ ngữ + 已经 + Động từ (+ Tân ngữ) + 了.</p><p><b>Ví dụ bổ sung:</b> 我已经吃完饭了。</p>"},
    {id:"q24",section:"p6",type:"text_fill",prompt:"Dùng \"是……的\" để viết câu nhấn mạnh thời gian, từ thông tin sau: (thời gian: hôm qua; hành động: đến Bắc Kinh)",
     correct:"我是昨天来北京的。",
     explain:"<p><b>Giải thích:</b> 是……的 nhấn mạnh mốc thời gian 昨天 của hành động 来 đã xảy ra.</p><p><b>Lỗi HS Việt hay gặp:</b> Quên 是, vì nghĩ chỉ cần thêm 的 là đủ.</p><p><b>Mẹo ghi nhớ:</b> 是……的 luôn cần đủ cả hai từ, thiếu một từ là sai cấu trúc.</p><p><b>Ví dụ bổ sung:</b> 我是去年来越南的。</p>"},
    {id:"q25",section:"p6",type:"text_fill",prompt:"Dùng \"已经……了\" để viết câu từ thông tin: (đã đá bóng được mười năm)",
     correct:"我已经踢足球十年了。",
     explain:"<p><b>Giải thích:</b> 已经 + V + Tân ngữ + thời lượng + 了 — đúng cấu trúc câu mẫu trong bài khóa: 已经踢了十年了.</p><p><b>Lỗi HS Việt hay gặp:</b> Đặt thời lượng (十年) trước động từ do ảnh hưởng trật tự tiếng Việt.</p><p><b>Mẹo ghi nhớ:</b> Trật tự: Động từ + Tân ngữ + Thời lượng + 了.</p><p><b>Ví dụ bổ sung:</b> 他已经学中文两年了。</p>"},

    // ================= B4: Sửa lỗi sai =================
    {id:"q26",section:"p7",type:"text_fill",prompt:"这本书是我买。",
     correct:"这本书是我买的。",
     explain:"<p><b>Giải thích:</b> Lỗi: thiếu 的 cuối câu — thành phần bắt buộc của khung 是……的.</p><p><b>Vì sao đúng:</b> 的 đóng vai trò kết thúc và xác nhận cấu trúc nhấn mạnh.</p><p><b>Lỗi HS Việt hay gặp:</b> Đây là lỗi phổ biến nhất khi mới học 是……的: quên 的 cuối câu.</p><p><b>Mẹo ghi nhớ:</b> 是……的 luôn đi thành cặp — có 是 thì phải có 的.</p><p><b>Ví dụ bổ sung:</b> 这是他送的。(không phải '这是他送')</p>"},
    {id:"q27",section:"p7",type:"text_fill",prompt:"我的时候六点起床，妈妈已经做饭了。",
     correct:"我六点起床的时候，妈妈已经做饭了。",
     explain:"<p><b>Giải thích:</b> Lỗi: 的时候 phải đứng sau cụm thời gian/động từ (六点起床), không đứng ngay sau chủ ngữ.</p><p><b>Vì sao đúng:</b> Trật tự đúng: [六点起床] + 的时候.</p><p><b>Lỗi HS Việt hay gặp:</b> Lỗi điển hình do dịch trực tiếp trật tự tiếng Việt 'khi tôi dậy lúc 6 giờ'.</p><p><b>Mẹo ghi nhớ:</b> 的时候 luôn đứng SAU toàn bộ cụm mô tả thời điểm/hành động, không đứng trước.</p><p><b>Ví dụ bổ sung:</b> 我吃饭的时候，他打电话来了。</p>"},
    {id:"q28",section:"p7",type:"text_fill",prompt:"我已经吃饭。",
     correct:"我已经吃饭了。",
     explain:"<p><b>Giải thích:</b> Lỗi: 已经 cần đi kèm 了 cuối câu để khẳng định trạng thái đã hoàn thành.</p><p><b>Vì sao đúng:</b> Thêm 了 hoàn chỉnh cấu trúc 已经……了.</p><p><b>Lỗi HS Việt hay gặp:</b> HS Việt hay bỏ 了 vì 'đã' trong tiếng Việt không bắt buộc thêm trợ từ đi kèm.</p><p><b>Mẹo ghi nhớ:</b> Hễ thấy 已经 ở đầu/giữa câu, luôn kiểm tra xem cuối câu đã có 了 chưa.</p><p><b>Ví dụ bổ sung:</b> 他已经回家了。</p>"},
    {id:"q29",section:"p7",type:"text_fill",prompt:"这个电话不是我打了。",
     correct:"这个电话不是我打的。",
     explain:"<p><b>Giải thích:</b> Lỗi: câu phủ định 是……的 phải kết thúc bằng 的, không dùng 了.</p><p><b>Vì sao đúng:</b> 不是……的 là cấu trúc cố định, không thể thay 的 bằng 了.</p><p><b>Lỗi HS Việt hay gặp:</b> Nhầm lẫn giữa hai trợ từ 了 và 的 vì cả hai đều liên quan đến 'việc đã xảy ra'.</p><p><b>Mẹo ghi nhớ:</b> Nếu câu có 是 ở đầu (khẳng định hoặc phủ định 不是), cuối câu luôn là 的, không phải 了.</p><p><b>Ví dụ bổ sung:</b> 这不是我写的信。</p>"},
    {id:"q30",section:"p7",type:"text_fill",prompt:"他踢足球已经了十年。",
     correct:"他已经踢足球十年了。",
     explain:"<p><b>Giải thích:</b> Lỗi: 已经 phải đứng trước động từ, và 了 phải đứng cuối câu, sau thời lượng.</p><p><b>Vì sao đúng:</b> Trật tự chuẩn: Chủ ngữ + 已经 + Động từ + Tân ngữ + Thời lượng + 了.</p><p><b>Lỗi HS Việt hay gặp:</b> Dồn 已经 và 了 sát nhau ở giữa câu thay vì tách đúng vị trí đầu và cuối.</p><p><b>Mẹo ghi nhớ:</b> Hình dung 已经 đứng 'gác cổng' trước động từ, còn 了 luôn 'đóng cửa' cuối câu.</p><p><b>Ví dụ bổ sung:</b> 我已经学汉语三年了。</p>"},

    // ================= C1: Đọc hiểu — Tiệc sinh nhật =================
    {id:"q31",section:"p8",type:"mcq",prompt:"爸爸送给女儿什么礼物？",
     options:[{k:"A",t:"蛋糕"},{k:"B",t:"一本书"},{k:"C",t:"汉堡"},{k:"D",t:"草莓"}],correct:"B",
     explain:"<p><b>Giải thích:</b> Đoạn văn nêu rõ: '爸爸送给女儿一个礼物，是一本书。'</p><p><b>Vì sao các đáp án khác sai:</b> 蛋糕/草莓/汉堡 chỉ là món ăn trong bữa tiệc, không phải quà tặng.</p><p><b>Lỗi HS Việt hay gặp:</b> Chọn nhầm món ăn xuất hiện gần cuối đoạn (汉堡) vì đọc sót thông tin ở giữa.</p><p><b>Mẹo ghi nhớ:</b> Đọc kỹ động từ 送给 (tặng cho) để xác định đúng 'món quà' chứ không phải 'món ăn'.</p>"},
    {id:"q32",section:"p8",type:"self_check",prompt:"那本书是爸爸什么时候买的？",prompt_is_zh:true,
     reference:"是昨天买的。(这本书是爸爸昨天买的。)",
     explain:"<p><b>Giải thích:</b> Đoạn văn dùng cấu trúc 是……的 để nêu rõ mốc thời gian mua sách — câu gốc: '这本书是爸爸昨天买的。'</p><p><b>Lỗi HS Việt hay gặp:</b> Trả lời thiếu 是……的 khi trích dẫn lại câu trong bài, chỉ viết '昨天'.</p><p><b>Mẹo ghi nhớ:</b> Khi trả lời câu hỏi thời gian có 是……的 trong bài, nên giữ nguyên cấu trúc đó trong câu trả lời.</p>"},

    // ================= C2: Đọc hiểu — Trong công ty =================
    {id:"q33",section:"p9",type:"mcq",prompt:"这个工作是谁帮\u201c我\u201d介绍的？",
     options:[{k:"A",t:"同事"},{k:"B",t:"快递员"},{k:"C",t:"王方"},{k:"D",t:"丈夫"}],correct:"C",
     explain:"<p><b>Giải thích:</b> Đoạn văn nêu: '这个工作是王方帮我介绍的。' — thông tin trực tiếp từ câu đầu đoạn văn.</p><p><b>Vì sao các đáp án khác sai:</b> 同事 chỉ giúp giải quyết vấn đề, 快递员 giao hàng, 丈夫 không xuất hiện trong bài.</p><p><b>Lỗi HS Việt hay gặp:</b> Chọn 同事 vì nhân vật này xuất hiện nhiều lần trong đoạn.</p><p><b>Mẹo ghi nhớ:</b> Câu hỏi về 'công việc do ai giới thiệu' luôn nằm ở đầu đoạn giới thiệu bối cảnh.</p>"},
    {id:"q34",section:"p9",type:"mcq",prompt:"中午快递员打电话的时候，\u201c我\u201d接了。 (Đúng hay Sai?)",
     options:[{k:"T",t:"Đúng"},{k:"F",t:"Sai"}],correct:"F",
     explain:"<p><b>Giải thích:</b> Đoạn văn ghi rõ: '可是我在忙，没接。' — '没接' nghĩa là không nghe máy, trái với nhận định trong câu hỏi.</p><p><b>Lỗi HS Việt hay gặp:</b> Đọc lướt và nhầm giữa đoạn '没接' (buổi trưa) và '我给他回了电话' (buổi chiều gọi lại).</p><p><b>Mẹo ghi nhớ:</b> Chú ý các từ chỉ thời gian trong bài (中午/下午) để không nhầm hai hành động khác thời điểm.</p>"},

    // ================= C3: Đọc hiểu — Thói quen sức khỏe =================
    {id:"q35",section:"p10",type:"mcq",prompt:"医生说，什么对健康好？",
     options:[{k:"A",t:"晚睡晚起"},{k:"B",t:"按时睡觉、常常运动"},{k:"C",t:"吃很多蛋糕"},{k:"D",t:"每天工作到很晚"}],correct:"B",
     explain:"<p><b>Giải thích:</b> Đoạn văn nêu: '医生说，按时睡觉、常常运动对健康非常好。'</p><p><b>Vì sao các đáp án khác sai:</b> Các đáp án còn lại đều là hành vi KHÔNG tốt cho sức khỏe được nhắc đến trong bài (làm việc khuya, không vận động).</p><p><b>Lỗi HS Việt hay gặp:</b> Chọn nhầm D vì từ '晚' xuất hiện gần đó, nhưng đó là mô tả việc XẤU, không phải lời khuyên của bác sĩ.</p><p><b>Mẹo ghi nhớ:</b> Tìm đúng câu có '医生说' để xác định lời khuyên, tránh nhầm với các câu mô tả khác.</p>"},
    {id:"q36",section:"p10",type:"self_check",prompt:"昨天\u201c我\u201d为什么觉得很累？",prompt_is_zh:true,
     reference:"因为昨天工作到很晚才睡觉。",
     explain:"<p><b>Giải thích:</b> Đoạn văn nêu rõ nguyên nhân bằng câu: '昨天我工作到很晚才睡觉，今天早上起床的时候觉得很累。'</p><p><b>Lỗi HS Việt hay gặp:</b> Trả lời chung chung 'vì không ngủ đủ' mà không nêu rõ lý do làm việc khuya.</p><p><b>Mẹo ghi nhớ:</b> Câu hỏi 'vì sao' luôn có tín hiệu nhân quả gần đó — tìm từ 昨天 để định vị đúng đoạn.</p>"},

    // ================= C4: Đọc hiểu — Gia đình và thú cưng =================
    {id:"q37",section:"p11",type:"mcq",prompt:"老鼠有什么特点？",
     options:[{k:"A",t:"很大很高"},{k:"B",t:"圆圆的、很可爱"},{k:"C",t:"颜色是红色的"},{k:"D",t:"喜欢吃蛋糕"}],correct:"B",
     explain:"<p><b>Giải thích:</b> Đoạn văn nêu: '我们家的老鼠圆圆的，非常可爱。'</p><p><b>Vì sao các đáp án khác sai:</b> 红色 là màu váy của người vợ, không phải màu con chuột; A và D không có trong bài.</p><p><b>Lỗi HS Việt hay gặp:</b> Nhầm đặc điểm của 妻子 (mặc váy đỏ) sang cho 老鼠.</p><p><b>Mẹo ghi nhớ:</b> Đọc kỹ chủ ngữ của từng câu để không gán nhầm đặc điểm giữa các nhân vật/vật nuôi.</p>"},
    {id:"q38",section:"p11",type:"mcq",prompt:"妻子今天穿的裙子是黑色的。 (Đúng hay Sai?)",
     options:[{k:"T",t:"Đúng"},{k:"F",t:"Sai"}],correct:"F",
     explain:"<p><b>Giải thích:</b> Đoạn văn ghi: '我妻子今天穿了一条红色的裙子' — màu đỏ, không phải đen.</p><p><b>Lỗi HS Việt hay gặp:</b> Đọc lướt và bỏ qua từ chỉ màu sắc 红色 (Bài 3 đã học).</p><p><b>Mẹo ghi nhớ:</b> Ôn lại từ vựng màu sắc ở Bài 3 (颜色, 红色, 左边...) để nhận diện nhanh trong bài đọc.</p>"},

    // ================= C5: Đọc hiểu — Lễ hội cuối năm =================
    {id:"q39",section:"p12",type:"mcq",prompt:"妈妈把好吃的东西放在哪儿？",
     options:[{k:"A",t:"房间里"},{k:"B",t:"冰箱里"},{k:"C",t:"桌子上"},{k:"D",t:"快递里"}],correct:"B",
     explain:"<p><b>Giải thích:</b> Đoạn văn nêu: '妈妈已经把很多好吃的东西放进冰箱了。'</p><p><b>Vì sao các đáp án khác sai:</b> Các đáp án còn lại không xuất hiện trong bài liên quan đến việc cất đồ ăn.</p><p><b>Lỗi HS Việt hay gặp:</b> Chưa quen cấu trúc '把...放进...了' nên dễ bỏ sót vị trí chính xác.</p><p><b>Mẹo ghi nhớ:</b> 冰箱 (tủ lạnh) là nơi cất đồ ăn — liên hệ hình ảnh thực tế để nhớ nhanh.</p>"},
    {id:"q40",section:"p12",type:"self_check",prompt:"朋友们打算圣诞节的时候做什么运动？",prompt_is_zh:true,
     reference:"打篮球和打羽毛球。",
     explain:"<p><b>Giải thích:</b> Đoạn văn nêu: '我和朋友们打算圣诞节的时候一起打篮球、打羽毛球。'</p><p><b>Lỗi HS Việt hay gặp:</b> Chỉ trả lời một trong hai môn thể thao, bỏ sót thông tin còn lại.</p><p><b>Mẹo ghi nhớ:</b> Khi câu hỏi dùng '做什么' cho một liệt kê, luôn kiểm tra xem bài có bao nhiêu mục được liệt kê.</p>"},

    // ================= D1: Hoàn thành câu theo tình huống =================
    {id:"q41",section:"p13",type:"self_check",prompt:"Bạn nhận được một món quà sinh nhật, muốn hỏi bạn thân ai đã tặng. Hoàn thành câu hỏi dùng \"是……的\": 这个礼物 ___ ？",
     reference:"这个礼物是谁送给我的？",
     explain:"<p><b>Giải thích:</b> Dùng 是……的 để hỏi nhấn mạnh người tặng — đúng cấu trúc và tình huống: hỏi về chủ thể của hành động 送 đã xảy ra.</p><p><b>Lỗi HS Việt hay gặp:</b> Quên 的 cuối câu hỏi.</p><p><b>Mẹo ghi nhớ:</b> Câu hỏi về 'ai làm việc gì đó (đã biết chắc đã xảy ra)' luôn nghĩ ngay đến 是……的.</p><p><b>Ví dụ bổ sung:</b> 这本书是谁写的？</p>"},
    {id:"q42",section:"p13",type:"self_check",prompt:"Bạn của bạn hỏi bạn bắt đầu học tiếng Trung từ khi nào. Hoàn thành câu trả lời dùng \"是……的\": 我 ___ 。",
     reference:"我是去年开始学习中文的。(đáp án mẫu, có thể thay mốc thời gian phù hợp bản thân)",
     explain:"<p><b>Giải thích:</b> Dùng 是……的 nhấn mạnh mốc thời gian bắt đầu — đúng cấu trúc trả lời cho câu hỏi thời gian của việc đã xảy ra.</p><p><b>Lỗi HS Việt hay gặp:</b> Quên đưa 是 vào đầu phần trả lời.</p><p><b>Mẹo ghi nhớ:</b> Trả lời câu hỏi '什么时候……的' luôn lặp lại khung 是……的 trong câu trả lời.</p><p><b>Ví dụ bổ sung:</b> 我是三月开始工作的。</p>"},
    {id:"q43",section:"p13",type:"self_check",prompt:"Bạn muốn báo với bạn bè rằng hôm nay bạn đã làm xong hết công việc. Hoàn thành câu dùng \"已经……了\": 今天，我 ___ 。",
     reference:"今天，我已经做完工作了。",
     explain:"<p><b>Giải thích:</b> 已经 + V + 了 nhấn mạnh việc đã hoàn thành — đúng cấu trúc và đúng tình huống giao tiếp.</p><p><b>Lỗi HS Việt hay gặp:</b> Quên 了 cuối câu.</p><p><b>Mẹo ghi nhớ:</b> Thông báo một việc vừa hoàn thành luôn cần cặp 已经……了.</p><p><b>Ví dụ bổ sung:</b> 今天，我已经吃完饭了。</p>"},
    {id:"q44",section:"p13",type:"self_check",prompt:"Mô tả bạn bắt đầu chơi một môn thể thao từ năm bao nhiêu tuổi, dùng \"……的时候\". Hoàn thành câu: 我 ___ 。",
     reference:"我八岁的时候开始踢足球。(đáp án mẫu, có thể thay số tuổi/môn thể thao phù hợp bản thân)",
     explain:"<p><b>Giải thích:</b> [Tuổi] + 的时候 + 开始 + V — đúng cấu trúc ngữ pháp trọng tâm của bài.</p><p><b>Lỗi HS Việt hay gặp:</b> Đặt 的时候 sai vị trí (trước số tuổi thay vì sau).</p><p><b>Mẹo ghi nhớ:</b> Công thức: [mốc tuổi/thời gian] + 的时候 + [hành động bắt đầu].</p><p><b>Ví dụ bổ sung:</b> 我十岁的时候开始打羽毛球。</p>"},

    // ================= D2: Viết đoạn văn ngắn =================
    {id:"q45",section:"p14",type:"self_check",essay:true,
     prompt:"Hãy viết một đoạn văn ngắn (4-5 câu) kể bạn bắt đầu học tiếng Trung từ khi nào (dùng \"是……的\") và hiện đã học được bao lâu (dùng \"已经……了\").",
     reference:"我是去年九月开始学习中文的。那时候，我觉得中文很难，但是我很喜欢。现在，我已经学了一年多了。我认识了很多汉字，也认识了很多新朋友。我希望以后可以说得更好。",
     explain:"<p><b>Giải thích:</b> Đoạn văn mẫu sử dụng đủ 2 cấu trúc trọng tâm: 是……的 (mở đầu) và 已经……了 (giữa/cuối đoạn).</p><p><b>Tiêu chí đánh giá:</b> đảm bảo đúng yêu cầu ngữ pháp, mạch lạc, có mở-thân-kết đơn giản.</p><p><b>Lỗi HS Việt hay gặp:</b> Viết đoạn văn chỉ kể sự kiện mà quên lồng ghép 2 cấu trúc ngữ pháp được yêu cầu.</p><p><b>Mẹo ghi nhớ:</b> Trước khi viết, gạch chân trong đề bài các cấu trúc bắt buộc để không bỏ sót.</p>"},

    // ================= E1: Dịch Việt → Trung =================
    {id:"q46",section:"p15",type:"self_check",prompt:"Anh ấy bắt đầu học bơi từ năm anh ấy tám tuổi.",
     reference:"他八岁的时候开始学游泳。",
     explain:"<p><b>Giải thích:</b> Cấu trúc [tuổi] + 的时候 + 开始 + V — đúng trật tự và đúng nghĩa câu tiếng Việt.</p><p><b>Lỗi HS Việt hay gặp:</b> Đặt '的时候' ở cuối câu do ảnh hưởng trật tự tiếng Việt.</p><p><b>Mẹo ghi nhớ:</b> Luôn đặt mốc thời gian + 的时候 lên đầu câu, trước phần hành động chính.</p>"},
    {id:"q47",section:"p15",type:"self_check",prompt:"Con gái tôi đã biết chơi đàn piano rồi.",
     reference:"我女儿已经会弹钢琴了。",
     explain:"<p><b>Giải thích:</b> 已经 + 会 + V + 了 nhấn mạnh kỹ năng mới đạt được.</p><p><b>Lỗi HS Việt hay gặp:</b> Bỏ sót 会 khi dịch 'biết làm gì', làm sai nghĩa (chỉ còn nghĩa 'đã chơi đàn' chứ không phải 'đã biết chơi').</p><p><b>Mẹo ghi nhớ:</b> 会 luôn cần thiết khi nói về kỹ năng đã học được, không chỉ hành động đơn thuần.</p>"},
    {id:"q48",section:"p15",type:"self_check",prompt:"Cuốn sách này là mẹ tôi mua cho tôi.",
     reference:"这本书是我妈妈买给我的。",
     explain:"<p><b>Giải thích:</b> Cấu trúc 是……的 nhấn mạnh chủ thể 我妈妈: Tân ngữ (这本书) + 是 + Chủ thể + Động từ + 给 + Người nhận + 的.</p><p><b>Lỗi HS Việt hay gặp:</b> Để 是 lùi xuống giữa câu.</p><p><b>Mẹo ghi nhớ:</b> 是 luôn đứng ngay sau chủ đề câu (thứ được nhắc đến đầu tiên).</p>"},
    {id:"q49",section:"p15",type:"self_check",prompt:"Bây giờ đã là buổi tối rồi, chúng ta về nhà thôi.",
     reference:"现在已经晚上了，我们回家吧。",
     explain:"<p><b>Giải thích:</b> 已经 + danh từ thời gian + 了 diễn tả trạng thái thời gian đã đến — cấu trúc 已经……了 áp dụng cho cả danh từ, không chỉ động từ/tính từ.</p><p><b>Lỗi HS Việt hay gặp:</b> Chưa quen 已经……了 có thể dùng với danh từ thời gian.</p><p><b>Mẹo ghi nhớ:</b> 已经 + [bất kỳ trạng thái/thời điểm nào] + 了 đều hợp lệ.</p>"},
    {id:"q50",section:"p15",type:"self_check",prompt:"Ai đã giới thiệu công việc này cho bạn vậy?",
     reference:"这个工作是谁帮你介绍的？",
     explain:"<p><b>Giải thích:</b> Câu hỏi dùng 是……的 với từ nghi vấn 谁 ở vị trí chủ thể — đúng câu mẫu trọng tâm của Bài 4.</p><p><b>Lỗi HS Việt hay gặp:</b> Quên 是 khi câu hỏi có từ nghi vấn 谁.</p><p><b>Mẹo ghi nhớ:</b> Câu hỏi 'ai làm gì (đã xảy ra)' cũng cần đủ khung 是……的 như câu khẳng định.</p>"},

    // ================= E2: Dịch Trung → Việt =================
    {id:"q51",section:"p16",type:"self_check",prompt:"这条路很长，我们走了两个小时。",prompt_is_zh:true,
     reference:"Con đường này rất dài, chúng tôi đã đi bộ hai tiếng đồng hồ.",
     explain:"<p><b>Giải thích:</b> 长 ở đây đọc cháng, nghĩa 'dài'; 两 đứng trước lượng từ 个小时.</p><p><b>Lỗi HS Việt hay gặp:</b> Dịch nhầm 长 thành 'lâu' thay vì 'dài' trong ngữ cảnh miêu tả con đường.</p><p><b>Mẹo ghi nhớ:</b> 长 tả không gian (con đường, dòng sông) → 'dài'; tả thời gian → có thể là 'lâu'.</p>"},
    {id:"q52",section:"p16",type:"self_check",prompt:"你可以尝一尝这个吗？很好吃。",prompt_is_zh:true,
     reference:"Bạn có thể nếm thử cái này không? Rất ngon.",
     explain:"<p><b>Giải thích:</b> 尝一尝 là dạng động từ lặp lại (AA) diễn tả hành động ngắn, nhẹ nhàng — 'nếm thử'.</p><p><b>Lỗi HS Việt hay gặp:</b> Chưa quen dạng động từ lặp AA (尝一尝) nên dễ dịch cứng thành 'nếm nếm'.</p><p><b>Mẹo ghi nhớ:</b> Động từ lặp lại (V一V hoặc VV) mang nghĩa 'làm thử một chút, nhẹ nhàng'.</p>"},
    {id:"q53",section:"p16",type:"self_check",prompt:"我已经跟他说了这件事，他知道了。",prompt_is_zh:true,
     reference:"Tôi đã nói chuyện này với anh ấy rồi, anh ấy biết rồi.",
     explain:"<p><b>Giải thích:</b> 已经……了 (đã nói) kết hợp với 了 cuối câu thứ hai (biết rồi).</p><p><b>Lỗi HS Việt hay gặp:</b> Dịch thiếu chữ 'rồi' ở câu thứ hai (知道了) vì không để ý 了 xuất hiện hai lần với hai vai trò khác nhau.</p><p><b>Mẹo ghi nhớ:</b> 了 cuối câu luôn mang nghĩa 'đã/rồi', dù xuất hiện ở đâu trong câu ghép.</p>"},
    {id:"q54",section:"p16",type:"self_check",prompt:"他是九月来北京工作的。",prompt_is_zh:true,
     reference:"Anh ấy đến Bắc Kinh làm việc vào tháng 9.",
     explain:"<p><b>Giải thích:</b> 是……的 nhấn mạnh mốc thời gian (九月) của hành động 来...工作 đã xảy ra.</p><p><b>Lỗi HS Việt hay gặp:</b> Dịch thành 'Anh ấy LÀ đến Bắc Kinh làm việc vào tháng 9' — dịch thừa từ 'là' theo kiểu word-by-word.</p><p><b>Mẹo ghi nhớ:</b> 是……的 khi dịch sang tiếng Việt thường KHÔNG cần dịch từ 'là' — chỉ cần nhấn giọng vào phần được nhấn mạnh.</p>"},

    // ================= F1: Hoàn thành hội thoại =================
    {id:"q55",section:"p17",type:"self_check",prompt:"A: 生日快乐！这是送给你的。 B: ___ ？",prompt_is_zh:true,
     reference:"谢谢你！这是什么？",
     explain:"<p><b>Giải thích:</b> Câu trả lời tự nhiên khi nhận quà: cảm ơn + hỏi lại về món quà.</p><p><b>Lỗi HS Việt hay gặp:</b> Quên câu cảm ơn, chỉ hỏi thẳng '这是什么' thiếu lịch sự.</p><p><b>Mẹo ghi nhớ:</b> Trong giao tiếp tiếng Trung, luôn cảm ơn trước khi hỏi thêm thông tin.</p>"},
    {id:"q56",section:"p17",type:"self_check",prompt:"A: 这个电话是谁打的？ B: ___ 。",prompt_is_zh:true,
     reference:"是我姐姐打的。(đáp án mẫu)",

const STORE = {
  historyKey: "lms_history__" + LESSON.id,
  progressKey: "lms_progress__" + LESSON.id,
  themeKey: "lms_theme_pref",

  readJSON(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if(!raw) return fallback;
      const parsed = JSON.parse(raw);
      return parsed === null || parsed === undefined ? fallback : parsed;
    }catch(e){ console.warn("Dữ liệu lưu trữ lỗi, dùng giá trị mặc định cho", key, e); return fallback; }
  },
  writeJSON(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch(e){ console.warn("Không thể ghi localStorage", e); return false; }
  },
  remove(key){ try{ localStorage.removeItem(key); }catch(e){} },

  getHistory(){ const h = this.readJSON(this.historyKey, []); return Array.isArray(h) ? h : []; },
  saveHistory(list){ this.writeJSON(this.historyKey, list); },
  addAttempt(attempt){
    const list = this.getHistory();
    attempt.attemptNumber = list.length + 1;
    list.push(attempt);
    this.saveHistory(list);
    return attempt;
  },
  clearHistory(){ this.remove(this.historyKey); },

  getProgress(){ return this.readJSON(this.progressKey, null); },
  saveProgress(state){ this.writeJSON(this.progressKey, state); },
  clearProgress(){ this.remove(this.progressKey); }
};

/* ==========================================================================================
   3. STATE ỨNG DỤNG
========================================================================================== */
const QUESTIONS = LESSON.questions;
const TOTAL_Q = QUESTIONS.length;
const AUTO_TYPES = new Set(["mcq","blank_most","reorder","text_fill","dialog_fill","matching"]);

const STATE = {
  currentIndex: 0,
  answers: {},         // id -> answer payload (structure depends on type)
  selfMarks: {},        // id -> true/false/null (student self-assessment for self_check)
  startTime: null,
  submitTime: null,
  timeLimitSec: LESSON.timeLimitMinutes * 60,
  remainingSec: LESSON.timeLimitMinutes * 60,
  timerHandle: null,
  submitted: false,
  reviewFilter: "all",
  historyViewOpen: false
};

/* ==========================================================================================
   4. TIỆN ÍCH CHUNG
========================================================================================== */
function $(sel){ return document.querySelector(sel); }
function $all(sel){ return Array.from(document.querySelectorAll(sel)); }
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function normalizeCompare(s){
  return String(s||"")
    .replace(/\s+/g,"")
    .replace(/[。？！，、]/g,"")
    .replace(/[?!,.]/g,"")
    .trim();
}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m>0 ? `${m} phút ${s} giây` : `${s} giây`;
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleString("vi-VN", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove("show"), 2200);
}
function questionById(id){ return QUESTIONS.find(q=>q.id===id); }
function sectionById(id){ return LESSON.sections.find(s=>s.id===id); }

/* ==========================================================================================
   5. THEME (DARK / LIGHT)
========================================================================================== */
function initTheme(){
  const pref = STORE.readJSON(STORE.themeKey, "dark");
  document.documentElement.setAttribute("data-theme", pref);
  $("#themeToggle").textContent = pref==="dark" ? "☀️" : "🌙";
}
$("#themeToggle").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme")==="dark" ? "dark" : "light";
  const next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  STORE.writeJSON(STORE.themeKey, next);
  $("#themeToggle").textContent = next==="dark" ? "☀️" : "🌙";
});

/* ==========================================================================================
   5b. GẮN METADATA BÀI HỌC VÀO GIAO DIỆN (giúp file có thể tái sử dụng chỉ bằng cách đổi LESSON)
========================================================================================== */
function applyLessonMeta(){
  document.title = LESSON.zhTitle + " · " + LESSON.viSubtitle;
  const pageTag = document.getElementById("pageTitleTag");
  if(pageTag) pageTag.textContent = LESSON.zhTitle + " · " + LESSON.viSubtitle;
  const set = (id,txt)=>{ const e=document.getElementById(id); if(e) e.textContent = txt; };
  set("brandZh", LESSON.zhTitle);
  set("brandSub", LESSON.viSubtitle);
  set("heroZh", LESSON.zhTitle);

  set("heroDesc", LESSON.heroDescription || "");
}

/* ==========================================================================================
   6. KHỞI ĐỘNG / MÀN HÌNH BẮT ĐẦU
========================================================================================== */
function initStartScreen(){
  applyLessonMeta();
  $("#metaTotalQ").textContent = TOTAL_Q;
  $("#metaSections").textContent = LESSON.sections.length;
  $("#metaTime").textContent = LESSON.timeLimitMinutes + " phút";

  const history = STORE.getHistory();
  const inProgress = STORE.getProgress();

  if(history.length){
    const scores = history.map(a=>a.percentage);
    const best = Math.max(...scores);
    const avg = Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
    const last = history[history.length-1];
    const box = $("#historyMiniBox");
    box.classList.remove("hidden");
    box.innerHTML = `📊 Bạn đã làm bài này <b>${history.length}</b> lần. Điểm gần nhất: <b>${last.percentage}%</b> · Điểm cao nhất: <b>${best}%</b> · Trung bình: <b>${avg}%</b>`;
  }

  if(inProgress && !inProgress.submitted){
    showResumeModal(inProgress);
  }
}

function showResumeModal(saved){
  const answeredCount = Object.keys(saved.answers||{}).length;
  openModal(`
    <h3>Tiếp tục bài làm dở?</h3>
    <p>Hệ thống phát hiện bạn có một lần làm bài chưa hoàn thành (${answeredCount}/${TOTAL_Q} câu đã trả lời, còn ${fmtTime(saved.remainingSec)} phút).</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="mResumeRestart">Làm lại từ đầu</button>
      <button class="btn btn-primary" id="mResumeContinue">Tiếp tục làm bài</button>
    </div>
  `);
  $("#mResumeContinue").onclick = ()=>{ closeModal(); restoreProgress(saved); beginQuiz(true); };
  $("#mResumeRestart").onclick = ()=>{ closeModal(); STORE.clearProgress(); };
}

function restoreProgress(saved){
  STATE.answers = saved.answers || {};
  STATE.selfMarks = saved.selfMarks || {};
  STATE.currentIndex = saved.currentIndex || 0;
  STATE.startTime = saved.startTime || Date.now();
  STATE.remainingSec = saved.remainingSec != null ? saved.remainingSec : STATE.timeLimitSec;
}

$("#btnStart").addEventListener("click", ()=>{
  STATE.startTime = Date.now();
  STATE.remainingSec = STATE.timeLimitSec;
  beginQuiz(false);
});

function beginQuiz(resumed){
  $("#startScreen").classList.add("hidden");
  $("#quizScreen").classList.remove("hidden");
  $("#timerBox").classList.remove("hidden");
  $("#progressWrap").classList.remove("hidden");
  $("#navPanelToggle").classList.remove("hidden");
  renderQNav();
  renderQuestion(STATE.currentIndex);
  updateProgressBar();
  startTimer();
  if(!resumed) toast("Chúc bạn làm bài tốt! 加油！");
}

/* ==========================================================================================
   7. ĐỒNG HỒ ĐẾM NGƯỢC
========================================================================================== */
function startTimer(){
  clearInterval(STATE.timerHandle);
  updateTimerDisplay();
  STATE.timerHandle = setInterval(()=>{
    STATE.remainingSec--;
    if(STATE.remainingSec <= 0){
      STATE.remainingSec = 0;
      updateTimerDisplay();
      clearInterval(STATE.timerHandle);
      toast("⏰ Đã hết thời gian làm bài!");
      finalizeSubmit(true);
      return;
    }
    updateTimerDisplay();
    persistProgress();
  }, 1000);
}
function updateTimerDisplay(){
  $("#timerDisplay").textContent = fmtTime(STATE.remainingSec);
  $("#timerBox").classList.toggle("warn", STATE.remainingSec <= 300);
}

/* ==========================================================================================
   8. TIẾN ĐỘ / LƯU TẠM (LOCALSTORAGE)
========================================================================================== */
function persistProgress(){
  STORE.saveProgress({
    currentIndex: STATE.currentIndex,
    answers: STATE.answers,
    selfMarks: STATE.selfMarks,
    startTime: STATE.startTime,
    remainingSec: STATE.remainingSec,
    submitted: false
  });
}
function isAnswered(q){
  const a = STATE.answers[q.id];
  if(a === undefined || a === null) return false;
  if(q.type==="mcq") return !!a.choice;
  if(q.type==="blank_most") return Array.isArray(a.blanks) && a.blanks.every(b=>b!==null && b!==undefined);
  if(q.type==="reorder") return Array.isArray(a.order) && a.order.length === q.tokens.length;
  if(q.type==="text_fill") return !!(a.text && a.text.trim().length>0);
  if(q.type==="dialog_fill") return a.blanks && Object.keys(a.blanks).length === Object.keys(q.correctMap).length && Object.values(a.blanks).every(v=>!!v);
  if(q.type==="matching") return a.matches && Object.keys(a.matches).length === q.terms.length && Object.values(a.matches).every(v=>!!v);
  if(q.type==="self_check") return !!(a.text && a.text.trim().length>0);
  return false;
}
function answeredCountAll(){ return QUESTIONS.filter(isAnswered).length; }

function updateProgressBar(){
  const done = answeredCountAll();
  const pct = Math.round(done/TOTAL_Q*100);
  $("#progressText").textContent = `Đã làm: ${done} / ${TOTAL_Q} câu`;
  $("#progressPercent").textContent = pct+"%";
  $("#progressBarFill").style.width = pct+"%";
  $("#unansweredCount").textContent = `Chưa làm: ${TOTAL_Q-done} câu`;
  refreshQNavStates();
}

/* ==========================================================================================
   9. BẢNG ĐIỀU HƯỚNG CÂU HỎI
========================================================================================== */
function renderQNav(){
  const grid = $("#qnavGrid");
  grid.innerHTML = "";
  QUESTIONS.forEach((q, idx)=>{
    const btn = el("button","qnav-item", (idx+1));
    btn.dataset.idx = idx;
    btn.title = sectionById(q.section).title;
    btn.addEventListener("click", ()=>{ STATE.currentIndex = idx; renderQuestion(idx); });
    grid.appendChild(btn);
  });
  refreshQNavStates();
}
function refreshQNavStates(){
  $all(".qnav-item").forEach((btn,idx)=>{
    const q = QUESTIONS[idx];
    btn.classList.remove("answered","current","correct","wrong","self","partial");
    if(idx === STATE.currentIndex) btn.classList.add("current");
    if(STATE.submitted){
      const g = gradeQuestion(q);
      if(g.status==="correct") btn.classList.add("correct");
      else if(g.status==="wrong") btn.classList.add("wrong");
      else if(g.status==="partial") btn.classList.add("partial");
      else if(g.status==="self") btn.classList.add("self");
    } else if(isAnswered(q)){
      btn.classList.add("answered");
    }
  });
}
$("#navPanelToggle").addEventListener("click", ()=>{
  $("#navPanel").scrollIntoView({behavior:"smooth", block:"start"});
});

/* ==========================================================================================
   10. RENDER CÂU HỎI (theo từng dạng)
========================================================================================== */
function renderQuestion(idx){
  STATE.currentIndex = idx;
  const q = QUESTIONS[idx];
  const sec = sectionById(q.section);
  const card = $("#questionCard");
  card.innerHTML = "";

  card.appendChild(el("div","q-section-title", escapeHtml(sec.title)));
  card.appendChild(el("span","q-skill-tag", escapeHtml(sec.skill)));
  card.appendChild(el("div","q-num", `Câu ${idx+1} / ${TOTAL_Q}${sec.instruction ? " · "+escapeHtml(sec.instruction) : ""}`));

  if(sec.passage){
    card.appendChild(el("div","passage-box zh", escapeHtml(LESSON.passages[sec.passage])));
  }

  const body = el("div","q-body");
  card.appendChild(body);

  switch(q.type){
    case "mcq": renderMCQ(body,q); break;
    case "blank_most": renderBlankMost(body,q); break;
    case "reorder": renderReorder(body,q); break;
    case "text_fill": renderTextFill(body,q); break;
    case "dialog_fill": renderDialogFill(body,q); break;
    case "matching": renderMatching(body,q); break;
    case "self_check": renderSelfCheck(body,q); break;
  }

  if(STATE.submitted) renderGradedFeedback(card,q);

  $("#btnPrev").disabled = idx===0;
  $("#btnNext").classList.toggle("hidden", idx===TOTAL_Q-1);
  $("#btnSubmit").classList.toggle("hidden", idx!==TOTAL_Q-1 || STATE.submitted);
  updateProgressBar();
  card.scrollIntoView({behavior:"smooth", block:"start"});
}
function autoAdvance(){
  // Tự động chuyển sang câu tiếp theo sau khi học sinh chọn xong đáp án (không áp dụng cho câu nhập văn bản tự do).
  if(STATE.submitted) return;
  if(STATE.currentIndex >= TOTAL_Q-1) return;
  clearTimeout(autoAdvance._h);
  autoAdvance._h = setTimeout(()=>{
    if(STATE.currentIndex < TOTAL_Q-1) renderQuestion(STATE.currentIndex+1);
  }, 500);
}
function isFirstOfSection(idx){
  const sec = QUESTIONS[idx].section;
  return idx===0 || QUESTIONS[idx-1].section !== sec;
}

function renderMCQ(body,q){
  if(q.prompt) body.appendChild(el("div","q-prompt zh", escapeHtml(q.prompt)));
  if(q.markedSentence){
    const CIRCLES = {1:"①",2:"②",3:"③",4:"④"};
    const line = el("div","sentence-line zh");
    q.markedSentence.forEach(part=>{
      if(typeof part === "number"){
        line.appendChild(el("span","gap-mark", CIRCLES[part] || part));
      } else {
        line.appendChild(document.createTextNode(part));
      }
    });
    body.appendChild(line);
    body.appendChild(el("p",null,`<span style="font-size:15px;color:var(--text-dim);">${q.options.some(o=>o.k==="none") ? `Chọn vị trí đúng để điền ${q.gapWord||"最"}, hoặc chọn "Không cần điền ${q.gapWord||"最"}" nếu câu không cần so sánh nhất.` : `Chọn vị trí đúng để điền ${q.gapWord||"最"}.`}</span>`));
  }
  const list = el("div","options-list");
  const cur = STATE.answers[q.id];
  q.options.forEach(opt=>{
    const item = el("button","option-item");
    item.innerHTML = `<span class="opt-key">${opt.k}</span><span class="zh">${escapeHtml(opt.t)}</span>`;
    if(cur && cur.choice===opt.k) item.classList.add("selected");
    item.disabled = STATE.submitted;
    if(STATE.submitted){
      item.classList.add("locked");
      if(opt.k===q.correct) item.classList.add("correct-answer");
      else if(cur && cur.choice===opt.k) item.classList.add("wrong-selected");
    }
    item.addEventListener("click", ()=>{
      STATE.answers[q.id] = {choice: opt.k};
      persistProgress();
      renderQuestion(STATE.currentIndex);
      autoAdvance();
    });
    list.appendChild(item);
  });
  body.appendChild(list);
  if(STATE.submitted && q.fullCorrect){
    body.appendChild(el("p",null,`<b>Câu hoàn chỉnh đúng:</b> <span class="zh">${escapeHtml(q.fullCorrect)}</span>`));
  }
}

function renderBlankMost(body,q){
  const line = el("div","sentence-line zh");
  const cur = STATE.answers[q.id] || {blanks:new Array(q.blanks.length).fill(null)};
  q.segments.forEach((seg,i)=>{
    line.appendChild(document.createTextNode(seg));
    if(i < q.blanks.length){
      const sel = document.createElement("select");
      sel.className = "blank-select";
      sel.disabled = STATE.submitted;
      sel.innerHTML = `<option value="">(chọn)</option><option value="0">(để trống)</option><option value="1">最</option>`;
      sel.value = cur.blanks[i]==null ? "" : (cur.blanks[i]?"1":"0");
      sel.addEventListener("change", ()=>{
        const arr = (STATE.answers[q.id]||{blanks:new Array(q.blanks.length).fill(null)}).blanks.slice();
        arr[i] = sel.value==="" ? null : sel.value==="1";
        STATE.answers[q.id] = {blanks:arr};
        persistProgress();
        updateProgressBar();
      });
      line.appendChild(sel);
    }
  });
  body.appendChild(line);
  if(STATE.submitted){
    body.appendChild(el("p",null,`<b>Câu hoàn chỉnh đúng:</b> <span class="zh">${escapeHtml(q.fullCorrect)}</span>`));
  }
}

function renderReorder(body,q){
  const cur = STATE.answers[q.id] || {order:[]};
  const answerRow = el("div","reorder-answer-row");
  const poolRow = el("div","reorder-tokens-pool");

  function usedIndices(){ return cur.order.slice(); }

  function draw(){
    answerRow.innerHTML = "";
    poolRow.innerHTML = "";
    if(cur.order.length===0){ answerRow.appendChild(el("span",null,'<span style="color:var(--text-faint);font-size:13px;">Bấm các từ bên dưới theo đúng thứ tự...</span>')); }
    cur.order.forEach((tok,pos)=>{
      const chip = el("button","token-chip zh", escapeHtml(tok));
      chip.disabled = STATE.submitted;
      chip.addEventListener("click", ()=>{
        cur.order.splice(pos,1);
        STATE.answers[q.id] = {order:cur.order};
        persistProgress(); draw(); updateProgressBar();
      });
      answerRow.appendChild(chip);
    });
    // pool = remaining tokens (respect duplicates by index)
    const usedFlags = new Array(q.tokens.length).fill(false);
    cur.order.forEach(tok=>{
      const i = q.tokens.findIndex((t,ti)=>t===tok && !usedFlags[ti]);
      if(i>-1) usedFlags[i]=true;
    });
    q.tokens.forEach((tok,ti)=>{
      const chip = el("button","token-chip zh", escapeHtml(tok));
      if(usedFlags[ti]){ chip.classList.add("used"); chip.disabled = true; }
      else{
        chip.disabled = STATE.submitted;
        chip.addEventListener("click", ()=>{
          cur.order.push(tok);
          STATE.answers[q.id] = {order:cur.order};
          persistProgress(); draw(); updateProgressBar();
          if(cur.order.length === q.tokens.length) autoAdvance();
        });
      }
      poolRow.appendChild(chip);
    });
  }
  draw();

   13. CHẤM ĐIỂM
========================================================================================== */
function gradeQuestion(q){
  const a = STATE.answers[q.id];
  if(q.type === "self_check"){
    if(!STATE.submitted) return {status:"pending", graded:false};
    const mark = STATE.selfMarks[q.id];
    return {status: mark===true ? "correct" : mark===false ? "wrong" : "self", graded:false, selfMark:mark};
  }
  if(!STATE.submitted) return {status:"pending", graded:true};

  // Các dạng câu hỏi có nhiều "ô nhỏ" bên trong (hội thoại nhiều chỗ trống, nối từ)
  // được chấm điểm từng phần (partial credit) thay vì chỉ đúng/sai toàn bộ.
  if(q.type === "dialog_fill"){
    const keys = Object.keys(q.correctMap);
    const max = keys.length;
    const score = a && a.blanks ? keys.filter(k => (a.blanks[k]||"") === q.correctMap[k]).length : 0;
    const status = score===0 ? "wrong" : score===max ? "correct" : "partial";
    return {status, graded:true, score, max};
  }
  if(q.type === "matching"){
    const max = q.terms.length;
    const score = a && a.matches ? q.terms.filter(t => (a.matches[t.id]||"") === q.correctMap[t.id]).length : 0;
    const status = score===0 ? "wrong" : score===max ? "correct" : "partial";
    return {status, graded:true, score, max};
  }

  if(!a) return {status:"wrong", graded:true, unanswered:true, score:0, max:1};
  let ok = false;
  if(q.type === "mcq"){
    ok = a.choice === q.correct;
  } else if(q.type === "blank_most"){
    ok = Array.isArray(a.blanks) && q.blanks.every((b,i)=> a.blanks[i]===b.correct);
  } else if(q.type === "reorder"){
    ok = Array.isArray(a.order) && a.order.length===q.correctOrder.length && a.order.every((t,i)=>t===q.correctOrder[i]);
  } else if(q.type === "text_fill"){
    ok = Array.isArray(q.correct)
      ? q.correct.some(c => normalizeCompare(a.text) === normalizeCompare(c))
      : normalizeCompare(a.text) === normalizeCompare(q.correct);
  }
  return {status: ok ? "correct":"wrong", graded:true, score: ok?1:0, max:1};
}

function computeResult(){
  const autoQuestions = QUESTIONS.filter(q=>AUTO_TYPES.has(q.type));
  const selfQuestions = QUESTIONS.filter(q=>q.type==="self_check");
  let autoScore = 0, autoMax = 0, questionsFullyCorrect = 0;
  autoQuestions.forEach(q=>{
    const g = gradeQuestion(q);
    autoScore += g.score; autoMax += g.max;
    if(g.status==="correct") questionsFullyCorrect++;
  });
  const autoCorrect = questionsFullyCorrect;
  const autoWrong = autoQuestions.length - questionsFullyCorrect;
  const percentage = autoMax ? Math.round(autoScore/autoMax*100) : 0;
  const score100 = percentage;

  // group by skill (autoScore/autoMax dùng để tính % chính xác theo điểm thành phần,
  // autoCorrect/autoTotal dùng để đếm số CÂU chấm đúng hoàn toàn)
  const bySkill = {};
  QUESTIONS.forEach(q=>{
    const sec = sectionById(q.section);
    const skill = sec.skill || "Khác";
    if(!bySkill[skill]) bySkill[skill] = {total:0, autoTotal:0, autoCorrect:0, autoScore:0, autoMax:0, selfTotal:0, selfOk:0, selfDone:0};
    bySkill[skill].total++;
    if(AUTO_TYPES.has(q.type)){
      const g = gradeQuestion(q);
      bySkill[skill].autoTotal++;
      bySkill[skill].autoScore += g.score;
      bySkill[skill].autoMax += g.max;
      if(g.status==="correct") bySkill[skill].autoCorrect++;
    } else {
      bySkill[skill].selfTotal++;
      const mark = STATE.selfMarks[q.id];
      if(mark!==undefined && mark!==null){ bySkill[skill].selfDone++; if(mark===true) bySkill[skill].selfOk++; }
    }
  });

  const unansweredCount = QUESTIONS.filter(q=>!isAnswered(q)).length;
  const durationSec = Math.round((STATE.submitTime - STATE.startTime)/1000);

  let classification = "";
  if(percentage>=95) classification="Xuất sắc";
  else if(percentage>=90) classification="Rất tốt";
  else if(percentage>=80) classification="Giỏi";
  else if(percentage>=70) classification="Khá";
  else if(percentage>=60) classification="Đạt";
  else classification="Cần cố gắng";

  // strengths / weaknesses based only on measured skill data (no fabrication)
  const skillEntries = Object.entries(bySkill).filter(([k,v])=>v.autoMax>0).map(([k,v])=>({skill:k, pct:Math.round(v.autoScore/v.autoMax*100)}));
  skillEntries.sort((a,b)=>b.pct-a.pct);
  const strengths = skillEntries.filter(s=>s.pct>=80).map(s=>s.skill);
  const weaknesses = skillEntries.filter(s=>s.pct<70).map(s=>s.skill);

  const attemptRecord = {
    lessonId: LESSON.id,
    lessonTitle: LESSON.title,
    startTime: STATE.startTime,
    submitTime: STATE.submitTime,
    duration: durationSec,
    totalScore: score100,
    percentage: percentage,
    correctAnswers: autoCorrect,
    wrongAnswers: autoWrong,
    unansweredQuestions: unansweredCount,
    scoreBySection: Object.fromEntries(LESSON.sections.map(s=>{
      const qs = QUESTIONS.filter(q=>q.section===s.id && AUTO_TYPES.has(q.type));
      const c = qs.filter(q=>gradeQuestion(q).status==="correct").length;
      return [s.id, {title:s.title, total:qs.length, correct:c}];
    })),
    scoreBySkill: Object.fromEntries(Object.entries(bySkill).map(([k,v])=>[k,{autoTotal:v.autoTotal,autoCorrect:v.autoCorrect,autoScore:v.autoScore,autoMax:v.autoMax,selfTotal:v.selfTotal,selfDone:v.selfDone,selfOk:v.selfOk}])),
    studentAnswers: STATE.answers,
    selfMarks: STATE.selfMarks,
    teacherFeedback: null,
    classification: classification,
    version: LESSON.version
  };

  return {autoCorrect, autoWrong, autoTotal: autoQuestions.length, autoScore, autoMax, percentage, score100, classification,
           bySkill, unansweredCount, durationSec, strengths, weaknesses, attemptRecord};
}

function drawSkillChart(bySkill){
  const canvas = $("#skillChart");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.parentElement.clientWidth - 12;
  const cssH = 320;
  canvas.width = cssW*dpr; canvas.height = cssH*dpr;
  canvas.style.width = cssW+"px"; canvas.style.height = cssH+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);

  const styles = getComputedStyle(document.documentElement);
  const colGreen = styles.getPropertyValue("--green").trim() || "#1f9d55";
  const colRed = styles.getPropertyValue("--red").trim() || "#e03131";
  const colAmber = styles.getPropertyValue("--amber").trim() || "#f0a500";
  const colText = styles.getPropertyValue("--text").trim() || "#1c2333";
  const colGrid = styles.getPropertyValue("--border").trim() || "#e3e7f0";

  const entries = Object.entries(bySkill);
  const rowH = Math.min(46, (cssH-40)/Math.max(entries.length,1));
  const chartLeft = 130, chartRight = cssW-70;
  const chartW = chartRight - chartLeft;

  ctx.font = "12px Times New Roman, serif";
  ctx.textBaseline = "middle";

  entries.forEach(([skill,v], i)=>{
    const y = 24 + i*rowH + rowH/2;
    ctx.fillStyle = colText;
    ctx.textAlign = "right";
    ctx.fillText(skill, chartLeft-12, y);

    // grid line baseline
    ctx.strokeStyle = colGrid;
    ctx.beginPath(); ctx.moveTo(chartLeft,y+rowH*0.32); ctx.lineTo(chartRight,y+rowH*0.32); ctx.stroke();

    if(v.autoMax>0){
      const pctCorrect = v.autoScore/v.autoMax;
      const barH = rowH*0.44;
      // background track
      ctx.fillStyle = colGrid;
      ctx.fillRect(chartLeft, y-barH/2, chartW, barH);
      // correct portion
      ctx.fillStyle = colGreen;
      ctx.fillRect(chartLeft, y-barH/2, chartW*pctCorrect, barH);
      // wrong portion
      ctx.fillStyle = colRed;
      ctx.fillRect(chartLeft+chartW*pctCorrect, y-barH/2, chartW*(1-pctCorrect), barH);
      ctx.fillStyle = colText; ctx.textAlign="left";
      ctx.fillText(`${v.autoScore}/${v.autoMax} điểm (${Math.round(pctCorrect*100)}%)`, chartRight+8, y);
    } else if(v.selfTotal>0){
      const pctDone = v.selfDone/v.selfTotal;
      const barH = rowH*0.44;
      ctx.fillStyle = colGrid;
      ctx.fillRect(chartLeft, y-barH/2, chartW, barH);
      ctx.fillStyle = colAmber;
      ctx.fillRect(chartLeft, y-barH/2, chartW*pctDone, barH);
      ctx.fillStyle = colText; ctx.textAlign="left";
      ctx.fillText(`${v.selfDone}/${v.selfTotal} đã tự đánh giá`, chartRight+8, y);
    }
  });
}
window.addEventListener("resize", ()=>{
  if(!$("#resultScreen").classList.contains("hidden") && STATE.submitted){

    drawSkillChart(result.bySkill);
  }
